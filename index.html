function hasEntitlement(){
  if(profile&&profile.is_admin)return true;           // admin siempre pasa
  if(effectiveSettings&&effectiveSettings().apiKey)return true; // dev con key local
  if(!entitlementChecked)return true;                 // setup pendiente → permisivo

}
// REQ-228: acceso sin cobro (beta, cupón o cortesía) o invitación aún sin
// canjear: mientras dure, la app no muestra precios ni "activa tu plan".
function freeAccessActive(){
  if(!entitlement||entitlement.origin==="checkout")return false;
  const exp=new Date(entitlement.expires_at).getTime();
  return !Number.isFinite(exp)||exp>Date.now();
}
function noPricesMode(){return freeAccessActive()||(!entitlement&&!!pendingInviteCode());}
function hasActivePremiumTrial(){
  if(!premiumTrial||premiumTrial.status!=="active")return false;
  const exp=new Date(premiumTrial.expires_at).getTime();
  return Number.isFinite(exp)&&exp>Date.now();

function premiumTrialDaysLeft(){
  if(!hasActivePremiumTrial())return 0;
  const exp=new Date(premiumTrial.expires_at).getTime();
  return Math.max(1,Math.ceil((exp-Date.now())/86400000));
}
function dayState(ds){if(!S.days[ds])S.days[ds]={meals:{},extras:[],workoutDone:false};const d=S.days[ds];if(!d.meals)d.meals={};if(!d.extras)d.extras=[];return d;}
function mealState(ds,id){const d=dayState(ds);if(!d.meals[id])d.meals[id]={done:false};return d.meals[id];}
// REQ-125: orden visual del día (comidas + extras), independiente de slot/horario/historial.
function nextExtraOid(st){st.extraSeq=(st.extraSeq||0)+1;return st.extraSeq;}
function dayItemKey(item){return item.type==="meal"?"meal:"+item.id:"extra:"+(item.oid!=null?"oid:"+item.oid:"idx:"+item.idx);}
function dayDefaultItems(ds){
  const day=buildDay(ds);const st=dayState(ds);
  const meals=day.meals.map(m=>({type:"meal",id:m.id,base:m}));
  const extras=st.extras.map((e,idx)=>({type:"extra",idx,oid:e.oid!=null?e.oid:null,data:e}));
  return[...meals,...extras];
}
// Aplica el orden guardado (si existe), agrega al final cualquier ítem nuevo que no esté
// en la lista guardada, y descarta claves de ítems que ya no existen (ej. extra eliminado).
function dayEffectiveOrder(ds){
  const st=dayState(ds);
  const items=dayDefaultItems(ds);
  const byKey=new Map(items.map(it=>[dayItemKey(it),it]));
  const stored=Array.isArray(st.mealOrder)?st.mealOrder:[];
  const ordered=[];const seen=new Set();
  stored.forEach(key=>{if(byKey.has(key)&&!seen.has(key)){ordered.push(byKey.get(key));seen.add(key);}});
  items.forEach(it=>{const key=dayItemKey(it);if(!seen.has(key)){ordered.push(it);seen.add(key);}});
  return ordered;
}
// El reordenamiento es solo visual (no cambia slot/horario/macros) y solo aplica a
// hoy/futuro: los días ya ejecutados conservan su disposición histórica.
function canReorderDay(ds){return ds>=todayStr();}
function moveDayItem(ds,key,dir){
  if(!canReorderDay(ds))return;
  const st=dayState(ds);
  const order=dayEffectiveOrder(ds).map(dayItemKey);
  const i=order.indexOf(key);if(i<0)return;
  const j=i+dir;if(j<0||j>=order.length)return;
  [order[i],order[j]]=[order[j],order[i]];
  st.mealOrder=order;
  commitDay(ds);render();
}
function reorderControlsHtml(ds,key,canUp,canDown){

function dishCompatibleSlots(dish){

// Resuelve los macros de una comida:
// 1) override manual con macros (editar valores / personalizada)
// 2) macros calculados desde la base de datos por nombre de plato
// 3) fallback a los valores del plan hardcodeados (DB no conectada)
function mealValue(base,ms){
  const o=ms&&ms.ovr;
  const name=o&&o.name!=null?o.name:base.name;
  // 1. Override manual del usuario (custom kcal o dishName explícito)
  if(o&&o.kcal!=null&&o.dishName==null){
    return Object.assign({name,kcal:+o.kcal||0,p:+o.p||0,c:+o.c||0,f:+o.f||0,src:"custom"},o.macrosUnknown?{macrosUnknown:true}:{});
  }
  // 1b. Reemplazo materializado (REQ-83/131/142, "Cambiar comida"/rebalanceo
  // de futuras): el candidato ya trae sus propios macros sobre la porción
  // ESCALADA al target del slot. Recalcular con dishMacros() de la receta
  // BASE sin escalar contradice al encabezado con la receta/ingredientes ya
  // escalados que se despliegan debajo y descuadra dayTotals() (REQ-154).
  if(o&&o.gen&&o.dishName!=null&&o.kcal!=null){
    return{name,kcal:+o.kcal||0,p:+o.p||0,c:+o.c||0,f:+o.f||0,src:"replacement"};
  }
  // 2. Prescripción del nutritionPlan (snapshot materializado, REQ-82) — tiene
  // prioridad sobre la resolución por nombre de plato en el catálogo: el
  // snapshot ya trae la porción ESCALADA al target del slot, y el catálogo
  // puede tener un plato del mismo nombre con macros de receta BASE distintos
  // (REQ-162). Solo se salta cuando el override cambió de plato (o.dishName
  // presente): ahí sí debe resolver por catálogo la comida NUEVA elegida.
  if((!o||o.dishName==null)&&base.src==="nutritionPlan"&&base.kcal>0){
    return{name:base.name||name,kcal:base.kcal,p:base.p,c:base.c,f:base.f,src:"nutritionPlan"};
  }
  const dn=o&&o.dishName!=null?o.dishName:base.dishName;
  if(dn&&DB.loaded){const d=dishByName(dn);if(d){const m=dishMacros(d.id);return{name,kcal:m.kcal,p:m.p,c:m.c,f:m.f,src:"db"};}}
  // 3. Fallback: plan/slot vacío
  return{name,kcal:base.kcal,p:base.p,c:base.c,f:base.f,src:"plan"};
}
// Un slot "Sin asignar" (sin nombre ni macros) no es contenido real: no debe
// poder registrarse como hecho ni contar como comida cumplida (REQ-161).
function mealHasContent(v){return!!(v&&(v.name||v.kcal||v.p||v.c||v.f));}

// totales CONSUMIDOS (solo comidas marcadas como hechas)
function dayTotals(ds){
  const day=buildDay(ds); const st=dayState(ds);
  // REQ-125: una comida saltada no cuenta como pendiente ni como consumida.
  const skippedCount=day.meals.filter(b=>st.meals[b.id]&&st.meals[b.id].skipped).length;
  let t={kcal:0,p:0,c:0,f:0}, doneMeals=0, totMeals=day.meals.length-skippedCount+st.extras.length, partial=0;
  day.meals.forEach(b=>{const ms=st.meals[b.id];if(ms&&ms.done){const v=mealValue(b,ms);if(mealHasContent(v)){t.kcal+=v.kcal;t.p+=v.p;t.c+=v.c;t.f+=v.f;doneMeals++;if(v.macrosUnknown)partial++;}}});
  st.extras.forEach(e=>{if(e.done){t.kcal+=+e.kcal||0;t.p+=+e.p||0;t.c+=+e.c||0;t.f+=+e.f||0;doneMeals++;if(e.macrosUnknown)partial++;}});
  // REQ-269/271: se suma con la precisión guardada y se redondea solo al final.
  t={kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f)};
  // REQ-269: `partial` cuenta comidas registradas solo con calorías (macros incompletos).
  return {t,doneMeals,totMeals,target:day.target,partial};
}

/* ---------- Fase 5: color de proteína según ritmo ---------- */
function paceClass(consumed,target,isToday){
  const pct=target?consumed/target:0;
  if(pct>=1)return"fill-good";
  if(!isToday)return pct>=0.7?"fill-warn":"fill-bad";
  const now=new Date();const h=now.getHours()+now.getMinutes()/60;
  const expected=Math.min(1,Math.max(0,(h-7)/(21-7)));
  if(pct>=expected-0.1)return"fill-good";
  if(pct>=expected-0.3)return"fill-warn";
  return"fill-bad";
}
function pctW(v,t){return Math.min(100,t?Math.round(v/t*100):0);}

function cycleSummary(untilDs){
  // REQ-214: un ciclo interrumpido se resume hasta el día en que se deja.
  const last=validYmd(untilDs)&&untilDs<END?untilDs:END;
  let ds=START,activeDays=0,bestStreak=0,currentStreak=0,workouts=0,partialWorkouts=0,doneMeals=0,plannedMeals=0;
  while(ds<=last){
    const st=S.days[ds]||{};
    const day=buildDay(ds);
    const mealStates=st.meals||{};
    const dayMeals=day.meals.reduce((n,m)=>n+(mealStates[m.id]&&mealStates[m.id].done?1:0),0);
    const workoutOutcome=workoutOutcomeForState(st);
    const dayAny=dayMeals>0||workoutHasRecordedActivity(st)||(Array.isArray(st.extras)&&st.extras.some(x=>x&&x.done));
    const dayCombined=combinedDayDone(ds);
    plannedMeals+=day.meals.length;doneMeals+=dayMeals;
    if(workoutOutcome==="completed")workouts++;
    if(workoutOutcome==="partial")partialWorkouts++;
    if(dayAny)activeDays++;
    if(dayCombined){currentStreak++;bestStreak=Math.max(bestStreak,currentStreak);}else currentStreak=0;
    ds=addDays(ds,1);
  }
  const weighted=Object.keys(WEIGHT_RANGES).map(Number).filter(n=>wkg(n)!=null).sort((a,b)=>a-b);
  const firstWeek=weighted[0],lastWeek=weighted[weighted.length-1];
  const prefs=(profile&&profile.prefs)||{};
  const initialWeight=Number(prefs.cycleStartWeight);
  const initialBf=Number(prefs.cycleStartBodyFat);
  const startWeight=Number.isFinite(initialWeight)&&initialWeight>0?initialWeight:(firstWeek!=null?wkg(firstWeek):null);
  const startBf=Number.isFinite(initialBf)&&initialBf>0?initialBf:(firstWeek!=null?wbf(firstWeek):null);
  const endWeight=lastWeek!=null?wkg(lastWeek):null,endBf=lastWeek!=null?wbf(lastWeek):null;
  return {
    activeDays,bestStreak,workouts,partialWorkouts,doneMeals,plannedMeals,
    mealAdherence:plannedMeals?Math.round(doneMeals/plannedMeals*100):0,
    startWeight,endWeight,weightChange:startWeight!=null&&endWeight!=null?+(endWeight-startWeight).toFixed(1):null,
    startBodyFat:startBf,endBodyFat:endBf,bodyFatChange:startBf!=null&&endBf!=null?+(endBf-startBf).toFixed(1):null,
    checkinsAccepted:getWeeklyCheckins().filter(c=>c.accepted).length,
  };
}

async function loadPrivacyState(){
  privacyReady=false;privacyError="";consentRecords=[];safetyScreening=null;
  if(!supa||!uid()){privacyReady=true;return false;}
  try{
    const [consents,screening]=await Promise.all([
      supa.from("user_consents").select("*").eq("user_id",uid()).eq("policy_version",CONSENT_POLICY_VERSION),
      supa.from("safety_screenings").select("*").eq("user_id",uid()).eq("screening_version",SAFETY_SCREENING_VERSION).maybeSingle(),
    ]);
    if(consents.error)throw consents.error;
    if(screening.error)throw screening.error;
    consentRecords=consents.data||[];
    safetyScreening=screening.data||null;
    return true;
  }catch(e){
    privacyError=privacyApiMessage(e);
    return false;
  }finally{privacyReady=true;}
}

async function savePrivacyChoices(source,origin){
  if(!supa||!uid())return{error:{message:"Sin sesión"}};
  const choices=privacyChoicesFrom(source||{});
  if(!source.consentCore)return{error:{message:"Acepta el uso esencial de datos para personalizar tu plan"}};
  const age=Number(source.age!=null?source.age:(profile&&profile.prefs&&profile.prefs.age));
  if(age<MINIMUM_AGE)return{error:{message:`Debes tener al menos ${MINIMUM_AGE} años`}};
  const responses=Object.fromEntries(SAFETY_QUESTIONS.map(([key])=>[key,source.safetyResponses&&source.safetyResponses[key]==="yes"]));
  if(SAFETY_QUESTIONS.some(([key])=>!["yes","no"].includes(source.safetyResponses&&source.safetyResponses[key])))return{error:{message:"Cuestionario de seguridad incompleto"}};
  const now=new Date().toISOString();
  const rows=Object.entries(choices).map(([type,accepted])=>({
    user_id:uid(),
    consent_type:type,
    policy_version:CONSENT_POLICY_VERSION,
    status:accepted?"accepted":"withdrawn",
    accepted_at:accepted?now:null,
    withdrawn_at:accepted?null:now,
    source:origin||"app",
    metadata:{legal_review_required:true},
    updated_at:now,
  }));
  const hasRedFlags=Object.values(responses).some(Boolean);
  const [consents,screening]=await Promise.all([
    supa.from("user_consents").upsert(rows,{onConflict:"user_id,consent_type,policy_version"}),
    supa.from("safety_screenings").upsert({
      user_id:uid(),
      screening_version:SAFETY_SCREENING_VERSION,
      age_confirmed:true,
      responses,
      has_red_flags:hasRedFlags,
      cleared_for_training:!hasRedFlags,
      completed_at:now,
      updated_at:now,
    },{onConflict:"user_id,screening_version"}),
  ]);
  if(consents.error)return{error:consents.error};
  if(screening.error)return{error:screening.error};
  await loadPrivacyState();
  return{error:null};
}

  if(times.some(time=>time<start||time>end))return "Los horarios de comida deben quedar dentro de tu ventana de alimentación";
  if(times.some((time,index)=>index>0&&time<=times[index-1]))return "Ordena los horarios de comida de más temprano a más tarde";
  if(d.mainMealIndex<1||d.mainMealIndex>d.mealCount)return "Elige tu comida principal";
  if(!Number.isFinite(d.cookingMinutes)||d.cookingMinutes<5||d.cookingMinutes>180)return "El tiempo para cocinar debe estar entre 5 y 180 minutos";
  if(!FOOD_BUDGET_LABELS[d.foodBudget]||!REPEAT_LABELS[d.repeatPreference])return "Completa presupuesto y frecuencia de repetición";
  return "";
}

    const reconciled=reconcileOnboardingMacros(prevMacros,d);

    if(!d.equipment.length)d.equipment=defaultEquipmentForStrengthChoice(d.strengthPlace);

function validateOnboardingStep(){
  const d=onboardingDraft;
  if(onboardingStep===1){
    if(!d.name)return "Escribe tu nombre";
    if(!["male","female"].includes(d.sex))return "Selecciona el sexo usado para el cálculo";
    if(d.age<MINIMUM_AGE||d.age>90)return `Debes tener entre ${MINIMUM_AGE} y 90 años`;
    if(d.heightCm<130||d.heightCm>230)return "Revisa tu estatura";
    if(d.weightKg<35||d.weightKg>250)return "Revisa tu peso";
    if(d.bodyFatPct!==""&&(d.bodyFatPct<3||d.bodyFatPct>60))return "El porcentaje de grasa debe estar entre 3% y 60%";
  }
  if(onboardingStep===2&&[d.calorieTarget,d.proteinTarget,d.carbTarget,d.fatTarget].some(v=>!Number.isFinite(v)||v<=0))return "Completa las cuatro metas de nutrición";
  if(onboardingStep===3)return validateTrainingProfileCore(d);
  if(onboardingStep===4){
    const foodError=validateFoodPreferences(d);
    if(foodError)return foodError;
    if(d.age<MINIMUM_AGE)return `Debes tener al menos ${MINIMUM_AGE} años`;
    if(!d.consentCore)return "Acepta el uso esencial de datos para crear tu plan";
    if(SAFETY_QUESTIONS.some(([key])=>!["yes","no"].includes(d.safetyResponses&&d.safetyResponses[key])))return "Responde las cuatro preguntas de seguridad";

  return "";

function applyCalculatedMacros(){
  const result=calculateMacroTargets(onboardingDraft);
  onboardingDraft.calorieTarget=result.kcal;onboardingDraft.proteinTarget=result.p;
  onboardingDraft.carbTarget=result.c;onboardingDraft.fatTarget=result.f;
  onboardingDraft.maintenanceCalories=result.maintenance;onboardingDraft.macroMethod=result.method;
}
// REQ-227: "Ajustar valores" del paso 2 expone kcal/P/C/G por separado; editar solo uno
// y pulsar "Continuar" (no "Recalcular") dejaba kcal != suma de macros. Reconcilia
// determinista: si el usuario tocó un macro, kcal se deriva de p·4+c·4+f·9 (mismo
// invariante que calculateMacroTargets); si solo tocó kcal, la proteína queda fija y
// carbohidratos/grasa escalan al nuevo presupuesto (mismo patrón que
// applyWeeklyCheckinProposal), con los pisos de calculateMacroTargets (carb 50g/grasa 45g).
function reconcileOnboardingMacros(prev,next){
  const n={calorieTarget:next.calorieTarget,proteinTarget:next.proteinTarget,carbTarget:next.carbTarget,fatTarget:next.fatTarget};
  if(![n.calorieTarget,n.proteinTarget,n.carbTarget,n.fatTarget].every(Number.isFinite))return{...n,adjusted:""};
  const macrosChanged=n.proteinTarget!==prev.proteinTarget||n.carbTarget!==prev.carbTarget||n.fatTarget!==prev.fatTarget;
  const kcalChanged=n.calorieTarget!==prev.calorieTarget;
  if(macrosChanged){
    const kcal=Math.round(n.proteinTarget*4+n.carbTarget*4+n.fatTarget*9);
    return{...n,calorieTarget:kcal,adjusted:kcal!==n.calorieTarget||kcalChanged?"kcal":""};
  }
  if(kcalChanged){
    const cFloor=50,fFloor=45;
    const protKcal=Math.max(0,prev.proteinTarget)*4;
    const oldRem=Math.max(0,prev.calorieTarget-protKcal);
    const newRem=Math.max(0,n.calorieTarget-protKcal);
    const ratio=oldRem>0?newRem/oldRem:1;
    const carbTarget=Math.max(cFloor,Math.round(prev.carbTarget*ratio));
    const fatTarget=Math.max(fFloor,Math.round(prev.fatTarget*ratio));
    const kcal=Math.round(n.proteinTarget*4+carbTarget*4+fatTarget*9);
    return{...n,calorieTarget:kcal,carbTarget,fatTarget,adjusted:(carbTarget!==prev.carbTarget||fatTarget!==prev.fatTarget||kcal!==n.calorieTarget)?"macros":""};
  }
  return{...n,adjusted:""};
}
function onboardingNext(){
  readOnboardingStep();
  const error=validateOnboardingStep();
  if(error){toast(error);return;}
  if(onboardingStep===1)applyCalculatedMacros();
  const prevStep=onboardingStep;
  onboardingStep=Math.min(4,onboardingStep+1);
  renderOnboarding();scrollAppTop();
  if(prevStep===3&&onboardingDraft&&onboardingDraft.primarySport==="strength_only"){
    showCardioNudge("onboarding");
  }
}

async function prepareFirstWeekNutrition(ds,setup){
  const week=firstWeekForDate(ds);
  if(!week)return{ok:false,daysData:[],problems:["La semana inicial está fuera del plan."]};
  const allDays=weekDays(week);
  const days=weekPendingDays(allDays);
  if(!allDays.length)return{ok:false,daysData:[],problems:["La semana inicial está fuera del plan."]};
  if(!days.length)return{ok:true,week,label:firstWeekLabel(week),daysData:[],problems:[]};
  if(supa&&!DB.loaded&&!DB.error){try{await dbLoad();}catch(e){}}
  const daysData=[];const problems=[];
  if(aiAvailable()&&hasEntitlement()){
    const actionKey="first_week_diet";
    const requestId=beginCoachAction(actionKey);
    if(requestId){
      try{
        for(let i=0;i<days.length;i++){
          const day=days[i];
          if(setup){setup.message=`Preparando comidas: día ${i+1} de ${days.length}`;renderFirstWeekSetup(setup);}
          try{
            const {res}=await generateOneDay(day,{action:"diet_week",requestId,partKey:"day-"+(i+1)});
            if(res&&res.ok&&Array.isArray(res.comidas)&&res.comidas.length)daysData.push({ds:day,comidas:res.comidas});
            else problems.push(prettyDate(day)+": "+((res&&res.issues&&res.issues[0])||"no válido"));
          }catch(e){problems.push(prettyDate(day)+": "+coachErrorMessage(e));}
        }
      }finally{endCoachAction(actionKey);}
    }
  }
  const doneIds=new Set(daysData.map(d=>d.ds));
  const missing=days.filter(day=>!doneIds.has(day));
  if(missing.length){
    if(setup){setup.message="Completando comidas con opciones prácticas";renderFirstWeekSetup(setup);}
    const det=deterministicDaysForWeek(week,missing);
    if(det&&det.daysData.length){
      daysData.push(...det.daysData);
      if(det.variety&&setup)setup.nutritionVariety=det.variety;
    }else{
      missing.forEach(day=>problems.push(prettyDate(day)+": no se pudo completar con el catálogo."));
    }
  }
  daysData.sort((a,b)=>a.ds.localeCompare(b.ds));
  const shoppingList=(window.FITBUD_NUTRITION_DOMAIN&&window.FITBUD_NUTRITION_DOMAIN.buildShoppingListFromNutritionPlan)
    ?window.FITBUD_NUTRITION_DOMAIN.buildShoppingListFromNutritionPlan(daysData)
    :buildShoppingList(daysData);
  const draft={week,label:firstWeekLabel(week),daysData,problems,shoppingList,variety:setup&&setup.nutritionVariety};
  const nutritionPlan=buildNutritionPlanSnapshot(daysData,shoppingList);
  return{ok:daysData.length>0,week,label:draft.label,draft,nutritionPlan,daysData,problems};
}
async function prepareFirstWeekTraining(setup){
  if(trainingSafetyHold())return{ok:false,skipped:true,problems:["El entrenamiento quedó pausado por seguridad."]};
  if(!hasRequiredConsents()||!hasCurrentScreening())return{ok:false,problems:["Revisa privacidad y seguridad antes de preparar entrenamiento."]};
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const expectedWeeks=trainingExpectedWeeks(prefs);
  const missing=expectedWeeks.flatMap(week=>week.sessions.filter(session=>!session.allowedExerciseIds.length));
  if(missing.length)return{ok:false,problems:["Faltan ejercicios compatibles con tus lugares o recursos."]};
  const trialFirstWeekOnly=hasActivePremiumTrial()&&!entitlement;
  const actionKey="first_week_training";
  const requestId=beginCoachAction(actionKey);
  if(!requestId)return{ok:false,problems:["El entrenamiento ya está en preparación."]};
  const weeks=[];const warnings=[];
  let fallbackOnly=!aiAvailable();
  try{
    for(let index=0;index<expectedWeeks.length;index++){
      const expected=expectedWeeks[index];
      if(setup){setup.message=`Preparando entrenamiento: semana ${index+1} de ${expectedWeeks.length}`;renderFirstWeekSetup(setup);}
      let result;
      if(trialFirstWeekOnly&&index>0){
        result=await generateTrainingWeek(expected,prefs,{fallbackOnly:true});
        warnings.push(`semana ${expected.week}`);
        weeks.push(result.week);
        continue;
      }
      try{
        result=await generateTrainingWeek(expected,prefs,{
          action:"training_plan",requestId,partKey:`week-${expected.week}`,fallbackOnly,
        });
        if(!result.ok)throw new Error(result.issues[0]||"La semana no pasó las validaciones.");
      }catch(error){
        fallbackOnly=true;
        result=await generateTrainingWeek(expected,prefs,{fallbackOnly:true});
        warnings.push(`semana ${expected.week}`);
      }
      weeks.push(result.week);
    }
  }finally{endCoachAction(actionKey);}
  const plan={
    version:TRAINING_PLAN.VERSION,
    durationWeeks:resolvedPlanDuration(prefs),
    startDate:START,endDate:END,
    reason:"Combina tu actividad principal con fuerza, respeta tus días y ajusta la carga por fase.",
    createdAt:new Date().toISOString(),
    validation:{schema:"training_plan_week_v1",status:"passed",catalogHash:coachCompatibilityContext("training_plan").catalog.exercises},
    weeks,
  };
  const check=TRAINING_PLAN.validatePlan(plan,{durationWeeks:resolvedPlanDuration(prefs)});
  if(!check.ok)return{ok:false,problems:[check.issues[0]||"El plan de entrenamiento no pasó las validaciones."]};
  return{
    ok:true,plan,prefs,expectedWeeks,warnings,trialFirstWeekOnly,
    prompt:trainingPlanPromptMetadata(prefs,expectedWeeks),
  };
}

async function prepareFirstCycleWeek(ds,options){
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  if(prefs.cycleFirstWeekPreparedAt&&!(options&&options.force))return{ok:true,skipped:true,errors:[]};
  const setup={current:"nutrition",done:[],failed:[],message:"Preparando tus comidas"};
  renderFirstWeekSetup(setup);
  const summary={ok:false,nutrition:null,training:null,errors:[]};
  try{
    await loadEntitlement();
    const nutrition=await prepareFirstWeekNutrition(ds,setup);
    summary.nutrition=nutrition;
    if(nutrition&&nutrition.ok)setup.done.push("nutrition");
    else{setup.failed.push("nutrition");summary.errors.push(...((nutrition&&nutrition.problems)||["No pudimos preparar comidas."]));}
    setup.current="training";setup.message="Preparando tu entrenamiento";renderFirstWeekSetup(setup);
    const training=await prepareFirstWeekTraining(setup);
    summary.training=training;
    if(training&&training.ok)setup.done.push("training");
    else{setup.failed.push("training");summary.errors.push(...((training&&training.problems)||["No pudimos preparar entrenamiento."]));}
    setup.current="validate";setup.message="Guardando tu semana";renderFirstWeekSetup(setup);
    if((nutrition&&nutrition.ok)||(training&&training.ok))await persistFirstWeekPlan(nutrition,training);
    setup.done.push("validate");renderFirstWeekSetup(setup);
    const nowStr=new Date().toISOString();
    if(profile&&profile.prefs){
      profile.prefs.cycleFirstWeekPreparedAt=nowStr;
      profile.prefs.cycleFirstDayPreparedAt=nowStr;
    }
    const markedPrefs={...migrateProfilePrefs((profile&&profile.prefs)||{}),cycleFirstWeekPreparedAt:nowStr,cycleFirstDayPreparedAt:nowStr};
    try{await saveProfilePrefs(markedPrefs,{source:"system",reason:"Primera semana preparada",skipPlanVersion:true});}catch(e){}
    summary.ok=summary.errors.length===0;
    window._firstWeekSetup=summary;

  }catch(e){

// Anillo de progreso SVG (Ring). pct 0..1, centerHtml va en el centro.
function ring(pct,centerHtml,opt){
  opt=opt||{};
  const size=opt.size||128, stroke=opt.stroke||12, color=opt.color||"var(--accent2)", track=opt.track||"var(--surf3)";
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const p=Math.min(Math.max(pct||0,0),1), off=c*(1-p);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r.toFixed(1)}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"/>
    </svg>
    <div class="ring-center">${centerHtml}</div>
  </div>`;
}

const UI_KEY="fitbud_ui";

/* ---- Sugerencia: agregar a la pantalla de inicio (solo móvil, una vez) ---- */
let deferredInstallPrompt=null;
function isStandaloneMode(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function isIOSDevice(){return /iphone|ipad|ipod/i.test(navigator.userAgent||"")&&!window.MSStream;}
function isMobileDevice(){return /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent||"");}
function installDismissed(){return !!(UI&&UI.installDismissed);}
function removeInstallPrompt(){const el=document.getElementById("a2hs");if(el)el.remove();}
function dismissInstall(){UI.installDismissed=true;uiSave();removeInstallPrompt();}
function updateInstallPrompt(){
  const inApp=session&&profile&&(typeof isActive!=="function"||isActive())&&privacyReady&&!privacyError&&!privacyGateRequired()&&!onboardingActive&&!passwordRecovery&&!(typeof planNeedsRecap==="function"&&planNeedsRecap());
  const show=inApp&&isMobileDevice()&&!isStandaloneMode()&&!installDismissed();
  if(!show){removeInstallPrompt();return;}
  if(document.getElementById("a2hs"))return;               // ya visible
  const ios=isIOSDevice(), canPrompt=!!deferredInstallPrompt;
  const txt=ios
    ? 'Pulsa <b>Compartir</b> y luego <b>“Añadir a pantalla de inicio”</b> para abrirla como app.'
    : canPrompt
      ? 'Instálala para abrirla a pantalla completa, como una app de tu celular.'
      : 'Abre el menú de tu navegador y elige <b>“Instalar app”</b> o <b>“Añadir a pantalla de inicio”</b>.';
  const action=(!ios&&canPrompt)?'<button class="btn btn-sm btn-accent" onclick="installApp()">Instalar</button>':'';
  const el=document.createElement("div");
  el.id="a2hs"; el.className="a2hs";
  el.innerHTML=`<div class="a2hs-ic">📲</div>
    <div class="a2hs-body">
      <div class="a2hs-title">Agrega Evolv a tu inicio</div>
      <div class="a2hs-txt">${txt}</div>
      <div class="a2hs-actions">${action}<button class="btn btn-sm" onclick="dismissInstall()">${action?'Ahora no':'Entendido'}</button></div>
    </div>
    <button class="a2hs-x" aria-label="Cerrar" onclick="dismissInstall()">✕</button>`;
  document.body.appendChild(el);
}
async function installApp(){
  const dp=deferredInstallPrompt; deferredInstallPrompt=null;
  if(!dp){dismissInstall();return;}
  try{ dp.prompt(); await dp.userChoice; }catch(e){}
  UI.installDismissed=true; uiSave(); removeInstallPrompt();   // no volver a sugerir tras el intento
}

/* ---------- HOME: acción prioritaria del día sin llamada IA (REQ-22) ---------- */
function nextDailyAction(ds){
  const st=dayState(ds);
  const day=buildDay(ds);
  const ew=effectiveWorkout(ds);
  const execution=normalizedWorkoutExecution(ds);
  const workoutOutcome=workoutOutcomeForState(st);
  const restDay=ew.workout&&ew.workout.id==="descanso";
  const safetyHold=trainingSafetyHold();
  const {doneMeals,totMeals,t,target}=dayTotals(ds);
  const pendingMeals=day.meals.filter(m=>!mealState(ds,m.id).done);
  const workoutPending=!restDay&&!safetyHold&&!st.workoutDone&&workoutOutcome==="pending";

  // 1. Sesión iniciada o pausada → continuar
  if(execution&&(workoutOutcome==="in_progress"||workoutOutcome==="paused")){
    const prog=WORKOUT_PLAYER.progress(execution);
    return{type:"workout_resume",
      eyebrow:"Sesión en curso",
      title:esc(ew.workout.name),
      detail:`${prog.completed} de ${prog.total} bloques completados`,
      cta:`<button class="btn btn-accent" style="width:100%;min-height:44px" onclick="setView('entreno')">Continuar sesión</button>`,
      reason:""};
  }

  // 2. Evaluación de seguridad pendiente con sesión de entrenamiento programada
  if(safetyHold&&workoutPending){
    return{type:"safety",
      eyebrow:"Entrenamiento en pausa",
      title:"Revisión de seguridad pendiente",
      detail:"Completa la evaluación en Perfil antes de retomar.",
      cta:`<button class="btn btn-accent" style="width:100%;min-height:44px" onclick="setView('perfil')">Completar evaluación</button>`,
      reason:""};
  }

  // 3. Comida pendiente
  if(pendingMeals.length>0){
    const nextMeal=pendingMeals[0];
    const ms=mealState(ds,nextMeal.id);
    const v=mealValue(nextMeal,ms);
    const kcalRem=Math.max(0,Math.round(target.kcal-t.kcal));
    const mealLabel=v.name?esc(v.name):esc(nextMeal.slot);
    const mealDetail=[
      nextMeal.slot+(nextMeal.time?" · ~"+nextMeal.time:""),
      v.kcal?v.kcal+" kcal":"",
      kcalRem>0&&doneMeals>0?kcalRem+" kcal restantes del día":""
    ].filter(Boolean).join(" · ");
    const trainBtn=workoutPending&&pendingMeals.length===1
      ?`<button class="btn btn-sm" onclick="setView('entreno')">Ver entreno</button>`:"";
    const reason=workoutPending&&pendingMeals.length===1
      ?`Después: ${esc(ew.workout.name)}`
      :pendingMeals.length>1?`${pendingMeals.length-1} comida${pendingMeals.length>2?"s":""} más en el día`
      :"Última comida del día";
    return{type:"meal",
      eyebrow:"Próxima comida",
      title:mealLabel,
      detail:mealDetail,
      cta:`<div class="row" style="gap:8px"><button class="btn btn-accent" style="flex:1;min-height:44px" onclick="toggleMeal('${ds}','${nextMeal.id}')">✓ Registrar</button><button class="btn btn-sm" onclick="setView('nutricion')">Ver detalle</button>${trainBtn}</div>`,
      reason};
  }

  // 4. Solo queda el entrenamiento
  if(workoutPending){
    return{type:"workout",
      eyebrow:"Entrenamiento de hoy",
      title:esc(ew.workout.name),
      detail:esc(ew.workout.detail||""),
      cta:isFreeActivityWorkout(ew.workout)
        ?`<button class="btn btn-accent" style="width:100%;min-height:44px" onclick="openManualActivity('${ds}')">Registrar mi actividad</button>`
        :`<div class="row" style="gap:8px"><button class="btn btn-accent" style="flex:1;min-height:44px" onclick="setView('entreno')">Iniciar sesión</button><button class="btn btn-sm" onclick="openWorkoutContingency('${ds}','tiempo')">Adaptar</button></div>`,
      reason:"Comidas del día registradas"};
  }

  // 5. Descanso planificado (REQ-206: con opción de registrar que entrenó igual)
  if(restDay){
    const acts=manualActivities(st);
    if(acts.length)return{type:"rest",
      eyebrow:"Descanso planificado · entrenaste igual",
      title:"Actividad registrada",
      detail:esc(acts.map(a=>`${activitySport(a.sport)[1]} · ${manualActivitySummary(a)}`).join(" / ")),
      cta:`<button class="btn" style="width:100%;min-height:44px" onclick="setView('progreso')">Ver mi progreso</button>`,
      reason:"Cuenta como día entrenado"};
    return{type:"rest",
      eyebrow:"Descanso planificado",
      title:"Día de recuperación",
      detail:esc(ew.workout.detail||"Movilidad suave y caminata opcional."),
      cta:`<div class="row" style="gap:8px"><button class="btn" style="flex:1;min-height:44px" onclick="setView('progreso')">Ver mi progreso</button><button class="btn" style="flex:1;min-height:44px" onclick="openManualActivity('${ds}')">Hoy entrené igual</button></div>`,
      reason:"El descanso es parte del plan"};
  }

  // 6. Día completado
  const wkLabel=workoutOutcome==="completed"?"completado":workoutOutcome==="partial"?"parcial":"—";
  return{type:"complete",
    eyebrow:"Día completado",
    title:"¡Buen trabajo hoy!",
    detail:`${doneMeals}/${totMeals} comidas · entrenamiento ${wkLabel}`,
    cta:`<button class="btn" style="width:100%;min-height:44px" onclick="setView('progreso')">Ver mi progreso</button>`,
    reason:""};
}

function homeAgendaData(ds){
  const st=dayState(ds);
  const day=buildDay(ds);
  const ew=effectiveWorkout(ds);
  const execution=normalizedWorkoutExecution(ds);
  const workoutOutcome=workoutOutcomeForState(st);
  const restDay=ew.workout&&ew.workout.id==="descanso";
  const safetyHold=trainingSafetyHold();
  const hasPreparedMeals=homeDayHasPreparedMeals(ds,day);
  // REQ-125: usa el orden visual del usuario (si lo definió) para decidir la próxima
  // comida pendiente, y excluye las comidas saltadas (no son una acción pendiente).
  const pendingMeals=hasPreparedMeals
    ?dayEffectiveOrder(ds).filter(it=>it.type==="meal").map(it=>it.base)
      .filter(m=>{const ms=mealState(ds,m.id);return!ms.done&&!ms.skipped;})
    :[];
  const workoutPending=!restDay&&!safetyHold&&!st.workoutDone&&workoutOutcome==="pending";
  const safetyPending=!restDay&&safetyHold&&workoutOutcome==="pending";
  const {doneMeals,totMeals}=dayTotals(ds);
  const items=[];

  if(!hasPreparedMeals){
    return {state:"setup",day,st,ew,workoutOutcome,doneMeals,totMeals,items};
  }

  if(execution&&(workoutOutcome==="in_progress"||workoutOutcome==="paused")){
    const prog=WORKOUT_PLAYER.progress(execution);
    items.push({
      kind:"resume",
      icon:"▶",
      label:"Sesión en curso",
      title:ew.workout&&ew.workout.name?ew.workout.name:"Entrenamiento",
      meta:`${prog.completed} de ${prog.total} bloques completados`,
      actions:`<button class="btn btn-accent" onclick="homeOpenWorkout('${ds}','workout_resume')">Continuar</button>`
    });
  }

  if(safetyPending){
    items.push({
      kind:"workout",
      icon:"!",
      label:"Entrenamiento en pausa",
      title:"Revisión de seguridad pendiente",
      meta:"Completa la evaluación antes de retomar.",
      actions:`<button class="btn btn-accent" onclick="setView('perfil')">Completar evaluación</button>`
    });
  }

  if(pendingMeals.length){
    const meal=pendingMeals[0];
    const ms=mealState(ds,meal.id);
    const v=mealValue(meal,ms);
    const remaining=pendingMeals.length-1;
    const title=v.name||meal.slot;
    const meta=[
      meal.slot+(meal.time?" · ~"+meal.time:""),
      v.kcal?`${Math.round(v.kcal)} kcal`:"",
      v.p?`P ${Math.round(v.p)} g`:"",
      remaining?`${remaining} comida${remaining>1?"s":""} más`:""
    ].filter(Boolean).join(" · ");
    items.push({
      kind:"meal",
      icon:"●",
      label:"Próxima comida",
      title,
      meta,
      actions:`<button class="btn btn-accent" onclick="homeRegisterMeal('${ds}','${meal.id}')">Registrar</button><button class="btn" onclick="setView('nutricion')">Ver detalle</button>`
    });
  }

  if(workoutPending){
    items.push({
      kind:"workout",
      icon:"◉",
      label:"Entrenamiento pendiente",
      title:ew.workout&&ew.workout.name?ew.workout.name:"Sesión de hoy",
      meta:ew.workout&&ew.workout.detail?ew.workout.detail:"Sigue la sesión guiada de hoy.",
      actions:isFreeActivityWorkout(ew.workout)
        ?`<button class="btn btn-accent" onclick="openManualActivity('${ds}')">Registrar</button><button class="btn" onclick="homeOpenWorkout('${ds}','workout_start')">Ver detalle</button>`
        :`<button class="btn btn-accent" onclick="homeOpenWorkout('${ds}','workout_start')">Iniciar</button><button class="btn" onclick="homeAdaptWorkout('${ds}')">Adaptar</button>`
    });
  }else if(restDay&&pendingMeals.length){
    items.push({
      kind:"rest",
      icon:"○",
      label:"Entreno",
      title:manualActivities(st).length?"Descanso · entrenaste igual":"Descanso planificado",
      meta:manualActivities(st).length?manualActivities(st).map(a=>`${activitySport(a.sport)[1]} · ${manualActivitySummary(a)}`).join(" / "):(ew.workout&&ew.workout.detail?ew.workout.detail:"El descanso también cuenta dentro del plan."),
      actions:manualActivities(st).length||!canLogManualActivity(ds)?"":`<button class="btn" onclick="openManualActivity('${ds}')">Entrené igual</button>`
    });
  }

  if(!items.length){
    return {state:"done",day,st,ew,workoutOutcome,doneMeals,totMeals,items};
  }
  // El descanso no es pendiente aunque ofrezca "Entrené igual" (REQ-206).
  const pendingCount=items.filter(i=>i.actions&&i.kind!=="rest").length;
  return {state:"agenda",day,st,ew,workoutOutcome,doneMeals,totMeals,items,pendingCount};
}

function buildContextualChips(ds){
  const day=buildDay(ds);
  const st=dayState(ds);
  const {t,target,doneMeals,totMeals}=dayTotals(ds);
  // Igual que homeAgendaData (REQ-125): una comida saltada no es una acción
  // pendiente, así que el coach no debe sugerirla (REQ-153).
  const pendingMeals=day.meals.filter(m=>{const ms=mealState(ds,m.id);return!ms.done&&!ms.skipped;});
  const ew=effectiveWorkout(ds);
  const restDay=ew.workout&&ew.workout.id==="descanso";
  const workoutOutcome=workoutOutcomeForState(st);
  // Con pausa por seguridad (trainingSafetyHold) el entreno no cuenta como
  // pendiente, igual que en homeAgendaData — el coach no debe ofrecerlo (REQ-153).
  const workoutPending=!restDay&&!trainingSafetyHold()&&!st.workoutDone&&workoutOutcome==="pending";
  const kcalRem=Math.max(0,Math.round(target.kcal-t.kcal));
  const chips=[];
  if(pendingMeals.length>0){
    chips.push(`¿Qué como para ${esc(pendingMeals[0].slot)}? Me quedan ${kcalRem} kcal`);
  }
  if(workoutPending){
    chips.push("¿Cómo hago el entrenamiento de hoy?");
    if(!isFreeActivityWorkout(ew.workout))chips.push("Adapta el entreno de hoy por falta de tiempo");
  }
  if(!workoutPending&&workoutOutcome==="missed"){
    chips.push("Perdí la sesión de hoy — ¿qué hago?");
  }
  if(doneMeals===totMeals&&totMeals>0){
    chips.push("¿Cómo estoy avanzando en la semana?");
  }
  const fallbacks=COACH_SUGGESTIONS.filter(s=>!chips.includes(s));
  while(chips.length<2&&fallbacks.length)chips.push(fallbacks.shift());
  return chips.slice(0,4);
}

/* ---- REQ-215: lista de compra semanal ----
   Cantidades sobre las comidas EFECTIVAS de cada día (cambios incluidos, sin
   las saltadas) y marcas "ya lo tengo" por semana en profiles.prefs. */
let shoppingScope="rest";
const SHOPPING_UNITS={"huevo entero":{grams:50,one:"huevo",many:"huevos"},"huevo":{grams:50,one:"huevo",many:"huevos"}};
function shoppingWeek(){
  const today=todayStr();
  return weekOf(today,planPrefsForDate(today))||weekOf(today)||null;
}
function shoppingKey(name){return String(name||"").trim().toLowerCase();}
// REQ-231: botón compacto de la fila de herramientas de Nutrición.
function shoppingToolInner(pending){
  return `${miniIcon("cart")}Lista de compra${pending?`<span class="nut-tool-count" aria-label="${pending} por comprar">${pending}</span>`:""}`;
}
function refreshShoppingTool(){

  if(btn)btn.innerHTML=shoppingToolInner(shoppingPendingCount());

// REQ-231: cuántos ingredientes quedan por comprar (lo que queda de semana).
function shoppingPendingCount(){
  try{
    const {week,items}=shoppingList("rest");
    if(!week)return 0;
    const {have}=shoppingChecksForWeek(week);
    return items.filter(i=>!have.has(i.key)).length;
  }catch(_){return 0;}
}
function shoppingList(scope){
  const w=shoppingWeek();
  if(!w)return {week:null,items:[]};
  const today=todayStr();
  const from=scope==="week"||today<w.start?w.start:today;
  const totals=new Map();
  const catByName=new Map((DB.ingredients||[]).map(i=>[shoppingKey(i.name),i.category||""]));
  for(let ds=from;ds<=w.end;ds=addDays(ds,1)){
    if(ds<START||ds>END)continue;
    const st=S.days[ds]||{};
    buildDay(ds).meals.forEach(b=>{
      const ms=(st.meals||{})[b.id]||{};
      if(ms.skipped)return;
      const recipe=mealRecipe(b,ms);
      (recipe&&recipe.lines||[]).forEach(line=>{
        const key=shoppingKey(line.name);if(!key||!(line.grams>0))return;
        const prev=totals.get(key)||{key,name:line.name,grams:0,category:catByName.get(key)||"Otros"};
        prev.grams+=line.grams;totals.set(key,prev);
      });
    });
  }
  const items=[...totals.values()].sort((a,b)=>a.category.localeCompare(b.category,"es")||a.name.localeCompare(b.name,"es"));
  return {week:w,from,items};
}
function shoppingQty(item){
  const unit=SHOPPING_UNITS[item.key];
  const g=item.grams<50?Math.round(item.grams/5)*5:Math.ceil(item.grams/10)*10;
  const weight=g>=1000?`${(g/1000).toFixed(g%1000?1:0)} kg`:`${Math.max(5,g)} g`;

// Normaliza la media disponible de un ejercicio a una forma consistente (REQ-15).
function exerciseMediaSources(exercise){
  // REQ-259: si la fila de Supabase no trae media, se usa la del catálogo local.
  const hasMedia=exercise&&(exercise.media_url||exercise.poster_url||exerciseArray(exercise.frames).length);
  if(exercise&&!hasMedia)exercise=LOCAL_EXERCISES.find(ex=>ex.slug===exercise.slug)||exercise;
  const mediaType=String(exercise&&exercise.media_type||"").toLowerCase();
  const frames=exerciseArray(exercise&&exercise.frames).map(f=>String(f||"").trim()).filter(Boolean);
  const url=String(exercise&&exercise.media_url||"").trim();
  const poster=String(exercise&&exercise.poster_url||"").trim();
  const isVideo=mediaType==="video"||/\.(mp4|webm|mov)(\?|#|$)/i.test(url);
  const isGif=mediaType==="gif"||/\.gif(\?|#|$)/i.test(url);
  const isImage=mediaType==="image"||/\.(png|jpe?g|webp|avif)(\?|#|$)/i.test(url);
  return {mediaType,frames,url,poster,isVideo,isGif,isImage};
}
// Cadena de degradación: video/gif → imagen → secuencia de 2 fotos → SVG procedimental.
function exerciseMediaHtml(exercise,opts){
  const autoplay=!opts||opts.autoplay!==false;

  }
  if(m.url&&(m.isGif||m.isImage)){

  if(m.poster||m.frames.length===1){

  }
  return exerciseDemoSvg(exercise);
}

/* ---------- Reproductor guiado de entrenamiento (REQ-16) ---------- */
function workoutPrescription(ds){
  const ew=effectiveWorkout(ds);
  const workout=ew.workout;
  const saved=S.days[ds]&&S.days[ds].workoutExecution;
  // La sesión conserva la prescripción con la que empezó, incluso cuando el
  // catálogo obliga a adaptar un plan antiguo antes de iniciarlo.
  if(saved&&saved.contentPrescription&&saved.workoutId===(workout&&workout.id)
    &&saved.contentPrescription.workoutId===saved.workoutId){
    return JSON.parse(JSON.stringify(saved.contentPrescription));
  }
  let prescribedIds=exerciseArray(workout&&workout.exerciseIds);
  // REQ-92: plan generado con exercises:[] → usar template estático del rol como respaldo
  if(workout&&workout.generated&&!prescribedIds.length&&workout.role){
    const template=workoutById(ds,workout.role,planPrefsForDate(ds));
    if(template&&template.exerciseIds&&template.exerciseIds.length)prescribedIds=exerciseArray(template.exerciseIds);
  }
  const exercises=prescribedIds.map(slug=>exerciseBySlug(slug,true)).filter(Boolean);
  return buildWorkoutPrescription(workout,exercises,workoutPlayerContext(ds));
}
function buildWorkoutPrescription(workout,exercises,context){
  const input=workout&&workout.cardioRole?{...workout,id:workout.cardioRole}:workout;
  const prescription=WORKOUT_PLAYER.buildPrescription({workout:input,exercises,context});
  if(workout&&workout.cardioRole)prescription.workoutId=workout.id;
  return prescription;
}
function workoutPlayerContext(ds){

    sessionMinutes:trainingPrefsFromPrefs(planPrefsForDate(ds)).sessionMinutes,

function workoutContentIssues(ds){

}
function normalizedWorkoutExecution(ds){
  const st=dayState(ds);

function workoutOutcomeForState(st){

function currentWorkoutStep(execution){

// REQ-260: lo siguiente es el primer bloque pendiente en orden (salvo `except`):

// REQ-260: con ejercicios hechos fuera de orden puede haber registrados

function reviewPreviousWorkoutStep(ds){

function reviewNextWorkoutStep(ds){

// REQ-235: la sesión no arranca en seco: 3, 2, 1 con pitido y vibración antes

let workoutCountdown=null;
function countdownBeep(final){

  try{
    const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime,len=final?.35:.12;
    osc.frequency.value=final?1320:880;

    osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+len);
  }catch(_){}

}

// REQ-185: series prescritas sin marcar (las extra sin hacer no cuentan).
function pendingPrescribedSets(execution,onlyStepIndex){
  const out=[];
  execution.steps.forEach((step,stepIndex)=>{
    if(step.type!=="strength"||step.status==="skipped")return;
    if(onlyStepIndex!=null&&stepIndex!==onlyStepIndex)return;
    const exercise=exerciseBySlug(step.exerciseSlug,true);
    step.sets.slice(0,step.prescribedSets).forEach((set,setIndex)=>{
      if(!set.done)out.push({stepIndex,setIndex,label:`${exercise?exercise.name:step.label} · Serie ${setIndex+1}`});
    });
  });
  return out;
}
function markWorkoutSetDone(step,set){
  set.done=true;
  if(set.reps==null)set.reps=step.defaultReps;
  if(set.rpe==null)set.rpe=step.targetRpe;
  set.completedAt=new Date().toISOString();

function seriesCount(n){return `${n} ${n===1?"serie":"series"}`;}
// mode: "fill" marca las series prescritas pendientes con la dosis objetivo;
// "advance" avanza sin registrarlas; sin mode pregunta si quedan pendientes.
function completeWorkoutStep(ds,mode){
  const execution=normalizedWorkoutExecution(ds);if(!execution)return;
  const step=currentWorkoutStep(execution);if(!step)return;
  if(step.type==="strength"){
    const pending=pendingPrescribedSets(execution,execution.steps.indexOf(step));
    if(pending.length&&mode==="fill")pending.forEach(item=>markWorkoutSetDone(step,step.sets[item.setIndex]));
    else if(pending.length&&mode!=="advance"){openPendingSetsPrompt(ds,step,pending);return;}
    const completed=step.sets.filter(set=>set.done).length;
    if(!completed){toast("Registra al menos una serie antes de avanzar");return;}
  }
  step.status="done";step.completedAt=new Date().toISOString();
  const next=nextWorkoutStepIndex(execution,execution.currentStep);
  // REQ-187: entre dos ejercicios de fuerza corre el descanso entre ejercicios;
  // si ya arrancó con la última serie, se conserva (no se reinicia).
  const toStrength=step.type==="strength"&&next>=0&&execution.steps[next].type==="strength";
  if(!toStrength)execution.timer=null;
  else if(!(execution.timer&&execution.timer.transition))execution.timer=betweenExerciseTimer();
  if(next>=0)execution.currentStep=next;
  persistWorkoutExecution(ds,execution,true);
  if(next<0)toast("Todos los bloques están registrados. Finaliza la sesión.");

function betweenExerciseRestSeconds(){return normalizedBetweenExerciseRest(trainingPrefs().betweenExerciseRestSeconds);}
function betweenExerciseTimer(){

function openPendingSetsPrompt(ds,step,pending){

    <button class="btn btn-accent" style="width:100%" onclick="closeModal();completeWorkoutStep('${ds}','fill')">Marcar ${pending.length===1?"la serie":`las ${pending.length}`} como ${pending.length===1?"hecha":"hechas"} y seguir</button>
    ${anyDone?`<button class="btn" style="width:100%;margin-top:8px" onclick="closeModal();completeWorkoutStep('${ds}','advance')">Seguir sin registrar${pending.length===1?"la":"las"}</button>`:""}
    <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">Volver al ejercicio</button>`);

function skipWorkoutStep(ds){
  const execution=normalizedWorkoutExecution(ds);if(!execution)return;

    const next=nextWorkoutStepIndex(execution,-1);

  }

// REQ-260 (feedback Sathya): pasar a un ejercicio posterior sin terminar el

function pendingStrengthStepIndexes(execution,except){

function workoutStepName(step){return workoutStepTitle(step,exerciseBySlug(step.exerciseSlug,true));}
function openWorkoutStepPicker(ds){

function jumpToWorkoutStep(ds,stepIndex){

// REQ-262 (feedback Sathya): añadir un ejercicio del catálogo a la sesión en

function removableAddedStep(step){return !!step&&step.added===true&&step.type==="strength"&&!step.sets.some(set=>set.done);}
function openAddWorkoutExercise(ds){

function addWorkoutExercise(ds,slug){

function saveWorkoutSetField(ds,stepIndex,setIndex,field,value){

function setWorkoutVariation(ds,variation){

function clearWorkoutVariation(ds){

// La progresión de algunos ejercicios es solo la carga: no hay otro ejercicio

function exerciseCompatibleForWorkout(exercise,ds){
  if(!exerciseSafeForLimits(exercise,ds))return false;
  const location=trainingPrefsFromPrefs(planPrefsForDate(ds)).locations[parseYmd(ds).getDay()];
  const places=exerciseArray(exercise.places);
  return !(location&&places.length&&!places.includes(location));

// REQ-261: lesiones, limitaciones y movimientos a evitar del perfil. El
// buscador solo aplica este filtro: el usuario elige el ejercicio aunque sea
// de otro lugar (se le indica dónde se hace).
function exerciseSafeForLimits(exercise,ds){
  if(!exercise||exercise.active===false)return false;
  const training=trainingPrefsFromPrefs(planPrefsForDate(ds));
  const blocked=[training.injuries,training.limitations,training.avoidMovements].filter(Boolean).join(" ").toLowerCase();
  if(!blocked)return true;
  const contraindications=exerciseArray(exercise.contraindications).join(" ").toLowerCase();
  const identity=[exercise.name,exercise.movement_pattern,contraindications].join(" ").toLowerCase();
  return !blocked.split(/[,.;]/).map(item=>item.trim()).filter(item=>item.length>3).some(item=>identity.includes(item));

// REQ-261 (feedback Sathya): buscar un ejercicio concreto en todo el catálogo.

function exerciseSearchResultsHtml(ds,mode,query){

function applyExerciseSubstitution(ds,slug){

function fillPendingWorkoutSets(ds){

function finishWorkoutExecution(ds,partialRequested){
  const pain=$("#finishPain").value,difficulty=$("#finishDifficulty").value;
  if(!pain||!difficulty){toast("Completa las dos preguntas de cierre");return;}
  const execution=normalizedWorkoutExecution(ds);if(!execution)return;
  captureWorkoutElapsed(execution);

  const safetyIssue=pain!=="none";

  execution.completedAt=new Date().toISOString();

// REQ-185: una sesión guardada parcial solo por series sin marcar se reabre

function resumePartialWorkout(ds,reviewed){
  const execution=reviewed||normalizedWorkoutExecution(ds);if(!execution||execution.status!=="partial"||execution.needsReview)return;
  execution.status="in_progress";execution.completedAt=null;execution.resumedAt=new Date().toISOString();
  execution.pain="";execution.difficulty="";
  const next=nextWorkoutStepIndex(execution,-1);
  execution.currentStep=next>=0?next:Math.max(0,execution.steps.length-1);
  persistWorkoutExecution(ds,execution,true);
}
function discardWorkoutExecution(ds){
  if(!confirm("¿Descartar esta sesión en curso? Se perderán las series y bloques registrados hoy."))return;
  const st=dayState(ds);delete st.workoutExecution;st.workoutDone=false;commitDay(ds);render();toast("Sesión descartada");
}
let workoutTimerCompleting=false;
// No re-renderizar por debajo de un modal ni mientras se escribe en un campo
// (perdería el foco); el siguiente tick lo reintenta.
function workoutRerenderSafe(){
  const active=document.activeElement;
  return !$("#overlay")&&!(active&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName));
}
function workoutTimerTick(){
  if(view!=="entreno")return;
  const execution=normalizedWorkoutExecution(current);
  const clock=document.querySelector(".player-clock");
  if(clock&&execution)clock.textContent=formatWorkoutTime(WORKOUT_PLAYER.elapsedSeconds(execution,Date.now()));
  const timer=document.querySelector(".workout-timer-value");
  if(!timer)return;
  // REQ-186: la pantalla muestra un descanso que el estado ya no tiene: re-renderizar
  // en vez de dejar un contador congelado con botones que no responden.
  if(!execution||!execution.timer){if(workoutRerenderSafe())render();return;}
  const remaining=WORKOUT_PLAYER.timerRemaining(execution.timer,Date.now());
  timer.textContent=formatWorkoutTime(remaining);
  if(remaining>0||!execution.timer.running||workoutTimerCompleting)return;
  workoutTimerCompleting=true;
  const kind=execution.timer.kind;
  if(kind==="step")finishTimedWorkoutStep(current,false);
  else if(kind==="move"){execution.timer=null;persistWorkoutExecution(current,execution,true);toast("Tiempo cumplido");}
  else{
    execution.timer=null;persistWorkoutExecution(current,execution,true);toast("Descanso terminado");
  }
  setTimeout(()=>{workoutTimerCompleting=false;},250);
}
// REQ-212: el calentamiento y la vuelta a la calma dicen qué hacer; el
// cronómetro es opcional (por movimiento) y "Ya calenté" marca el bloque.
function renderMovementStep(ds,execution,step,stepIndex){
  const moves=step.movements;
  const warm=step.phase==="warmup";
  const minutes=Math.max(1,Math.round((+step.durationSeconds||0)/60));
  const head=`<div class="player-phase">${workoutPhaseLabel(step.phase)} · bloque ${stepIndex+1} de ${execution.steps.length}</div>
    <h3>${esc(step.label)}</h3>
    <div class="muted small">Unos ${minutes} min · esfuerzo suave (${esc(step.intensity)})</div>
    ${step.coachNote?`<div class="alert violet" style="margin-top:10px">Indicación de tu coach: ${esc(step.coachNote)}</div>`:""}`;
  const doneLabel=warm?"Ya calenté":"Ya terminé";
  const guide=Number.isInteger(step.guideIndex)?Math.max(0,Math.min(moves.length-1,step.guideIndex)):null;
  if(guide==null){
    return `<div class="player-step">${head}
      <ol class="move-list">${moves.map(m=>`<li><span><b>${esc(m.name)}</b><span class="dose">${esc(m.dose)}</span></span></li>`).join("")}</ol>
      <div class="player-controls">
        <button class="btn btn-accent" onclick="startMovementGuide('${ds}')">Guíame</button>
        <button class="btn" onclick="completeWorkoutStep('${ds}')">${doneLabel}</button>
      </div>
      <button class="btn btn-sm" style="width:100%;margin-top:8px" onclick="skipWorkoutStep('${ds}')">Omitir bloque</button>
    </div>`;
  }
  const move=moves[guide],last=guide===moves.length-1;
  const moveTimer=execution.timer&&execution.timer.kind==="move"?renderWorkoutTimer(ds,execution,step):"";
  return `<div class="player-step">${head}
    <div class="move-now">
      <div class="muted small">Movimiento ${guide+1} de ${moves.length}</div>
      <h4>${esc(move.name)}</h4>
      <div>${esc(move.dose)}</div>
      ${moveTimer||(move.seconds?`<button class="btn btn-sm" style="width:100%;margin-top:10px" onclick="startMovementTimer('${ds}',${Math.round(move.seconds)})">Cronómetro de ${Math.round(move.seconds)} s (opcional)</button>`:"")}
    </div>
    <div class="player-controls">
      <button class="btn" ${guide===0?"disabled":""} onclick="moveMovementGuide('${ds}',-1)">Anterior</button>
      ${last?`<button class="btn btn-accent" onclick="completeWorkoutStep('${ds}')">${doneLabel}</button>`
        :`<button class="btn btn-accent" onclick="moveMovementGuide('${ds}',1)">Siguiente</button>`}
    </div>
    <button class="btn btn-sm" style="width:100%;margin-top:8px" onclick="completeWorkoutStep('${ds}')">${doneLabel} sin terminar la guía</button>
  </div>`;
}
// REQ-236: el calentamiento y la vuelta a la calma no se asignan por defecto:
// se ofrecen como opcionales y solo se muestran si el usuario los elige.
function renderOptionalStepOffer(ds,step){
  const warm=step.phase==="warmup";
  const minutes=Math.max(1,Math.round((+step.durationSeconds||0)/60));
  const moves=Array.isArray(step.movements)?step.movements.length:0;
  return `<div class="player-step optional-offer">
    <div class="player-phase">${workoutPhaseLabel(step.phase)} · opcional</div>
    <h3>${warm?"¿Quieres calentar antes de empezar?":"¿Quieres cerrar con unos minutos suaves?"}</h3>
    <p class="exercise-copy">${esc(step.label)}: unos ${minutes} min${moves?` · ${moves} movimientos`:""}, esfuerzo suave. Es opcional: ${warm?"si ya vienes en calor o vas justo de tiempo, empieza directo.":"puedes terminar la sesión sin hacerlo."}</p>
    <div class="player-controls">
      <button class="btn btn-accent" onclick="chooseOptionalWorkoutStep('${ds}',true)">${warm?"Sí, calentar":"Sí, hacerlo"}</button>
      <button class="btn" onclick="chooseOptionalWorkoutStep('${ds}',false)">Ahora no</button>
    </div>
  </div>`;
}
function chooseOptionalWorkoutStep(ds,yes){
  const execution=normalizedWorkoutExecution(ds);if(!execution||execution.status!=="in_progress")return;
  const step=currentWorkoutStep(execution);if(!step||!step.optional||step.status!=="pending")return;
  if(yes)step.optIn=true;
  else{
    step.status="declined";execution.timer=null;
    const next=nextWorkoutStepIndex(execution,execution.currentStep);
    if(next>=0)execution.currentStep=next;
  }
  persistWorkoutExecution(ds,execution,true);
}
function startMovementGuide(ds){
  const execution=normalizedWorkoutExecution(ds);if(!execution)return;
  const step=currentWorkoutStep(execution);if(!step||!Array.isArray(step.movements))return;
  step.guideIndex=0;execution.timer=null;
  persistWorkoutExecution(ds,execution,true);
}
function moveMovementGuide(ds,delta){
  const execution=normalizedWorkoutExecution(ds);if(!execution)return;
  const step=currentWorkoutStep(execution);if(!step||!Array.isArray(step.movements))return;
  step.guideIndex=Math.max(0,Math.min(step.movements.length-1,(Number(step.guideIndex)||0)+delta));
  if(execution.timer&&execution.timer.kind==="move")execution.timer=null;
  persistWorkoutExecution(ds,execution,true);
}
function startMovementTimer(ds,seconds){startWorkoutTimer(ds,seconds,"move");}
function renderWorkoutTimer(ds,execution,step){
  const timer=execution.timer;
  if(!timer)return `<button class="btn btn-accent" style="width:100%;min-height:48px" onclick="startCurrentWorkoutStep('${ds}')">Iniciar bloque</button>`;
  const remaining=WORKOUT_PLAYER.timerRemaining(timer,Date.now());
  return `<div class="player-timer">
    <div class="muted small">${timer.kind==="rest"?(timer.transition?"Descanso entre ejercicios":"Descanso"):timer.kind==="move"?"Tiempo del movimiento":"Tiempo del bloque"}</div>

      <button class="btn btn-sm" onclick="toggleWorkoutTimer('${ds}')">${timer.running?"Pausar":"Reanudar"}</button>
      <button class="btn btn-sm" onclick="addWorkoutTimer('${ds}',15)">+15 s</button>
      <button class="btn btn-sm" onclick="skipWorkoutTimer('${ds}')">Omitir</button>
    </div>
  </div>`;
}
function renderStrengthSet(ds,step,stepIndex,set,setIndex){

      <div><label>${step.unit==="seg"?"Segundos":"Repeticiones"}</label><input aria-label="${step.unit==="seg"?"Segundos":"Repeticiones"}, serie ${setIndex+1}" type="number" min="0" inputmode="decimal" value="${set.reps==null?"":esc(set.reps)}" placeholder="${esc(step.defaultReps)}" onchange="saveWorkoutSetField('${ds}',${stepIndex},${setIndex},'reps',this.value)"></div>

      <div><label>Esfuerzo (RPE)</label><input aria-label="Esfuerzo (RPE), serie ${setIndex+1}" type="number" min="1" max="10" inputmode="decimal" value="${set.rpe==null?"":esc(set.rpe)}" placeholder="${esc(step.targetRpe)}" onchange="saveWorkoutSetField('${ds}',${stepIndex},${setIndex},'rpe',this.value)"></div>

  </div>`;

function addWorkoutSet(ds,stepIndex){
  const execution=normalizedWorkoutExecution(ds);if(!execution||execution.status!=="in_progress")return;
  const step=execution.steps[stepIndex];if(!step||step.type!=="strength")return;
  if((step.extraSets||0)>=10){toast("Puedes añadir hasta 10 series extra");return;}
  step.extraSets=(step.extraSets||0)+1;
  step.sets.push({done:false,reps:null,load:"",rpe:null,completedAt:null});
  persistWorkoutExecution(ds,execution,true);
}
function removeWorkoutSet(ds,stepIndex){
  const execution=normalizedWorkoutExecution(ds);if(!execution||execution.status!=="in_progress")return;
  const step=execution.steps[stepIndex];if(!step||step.type!=="strength"||!(step.extraSets>0))return;
  const last=step.sets[step.sets.length-1];if(!last||last.done)return;
  step.sets.pop();step.extraSets-=1;
  persistWorkoutExecution(ds,execution,true);
}
function explainWorkoutEffort(){
  modal(`<h3>Esfuerzo: RPE y RIR</h3>
    <p class="exercise-copy"><b>RPE</b> es qué tan dura sentiste la serie, del 1 al 10. Un 10 significa que no podías hacer ni una repetición más.</p>
    <p class="exercise-copy"><b>RIR</b> son las repeticiones que te quedaban en reserva con buena técnica. RIR 2 equivale a un RPE 8: terminas la serie sintiendo que podrías hacer unas 2 más.</p>
    <p class="exercise-copy">Usa el objetivo para elegir la carga. Al terminar cada serie, anota el RPE que sentiste.</p>
    <button class="btn btn-accent" style="width:100%;margin-top:10px" onclick="closeModal()">Entendido</button>`);
}
// REQ-237: el tempo "3-1-1" son los segundos de cada fase de la repetición:
// bajar (o soltar el peso de vuelta) · pausa · subir (empujar o tirar).
function tempoPhases(tempo){
  const m=String(tempo||"").trim().match(/^(\d+)\s*-\s*(\d+)\s*-\s*(\d+)(?:\s*-\s*(\d+))?$/);
  return m?{down:+m[1],pause:+m[2],up:+m[3],top:m[4]==null?null:+m[4]}:null;
}
function explainWorkoutTempo(ds){
  const step=currentWorkoutStep(normalizedWorkoutExecution(ds));
  const tempo=step&&step.tempo;
  const t=tempoPhases(tempo);
  const sec=n=>`${n} s`;
  const body=t?`<p class="exercise-copy"><b>${esc(tempo)}</b> son los segundos que dura cada parte de una repetición:</p>
    <ul class="tempo-list">
      <li><b>${sec(t.down)}</b> bajando el peso, despacio y controlado. En remos y jalones, al dejar volver el peso.</li>
      <li><b>${t.pause?sec(t.pause):"Sin"}</b> ${t.pause?"de pausa abajo, sin rebotar.":"pausa: cambia de dirección sin rebotar."}</li>
      <li><b>${sec(t.up)}</b> subiendo: empuja o tira con fuerza.</li>
      ${t.top!=null?`<li><b>${t.top?sec(t.top):"Sin"}</b> ${t.top?"de pausa arriba antes de la siguiente.":"pausa arriba: sigue con la siguiente."}</li>`:""}
    </ul>
    <p class="exercise-copy">Cuenta mentalmente. Bajar lento hace el ejercicio más efectivo y cuida las articulaciones.</p>`
    :`<p class="exercise-copy"><b>${esc(tempo||"Controlado")}</b>: sube y baja sin rebotes ni impulso, con la bajada un poco más lenta que la subida.</p>`;
  modal(`<h3>Ritmo de cada repetición</h3>${body}
    <button class="btn btn-accent" style="width:100%;margin-top:10px" onclick="closeModal()">Entendido</button>`);
}

    ${lastPerformanceHtml(ds,step,exercise)}

    ${execution.timer&&execution.timer.kind==="rest"?renderWorkoutTimer(ds,execution,step):""}

// REQ-174: antes de empezar se ve qué se va a hacer: cada ejercicio con series

function formatRestShort(seconds){
  const s=Math.max(0,Math.round(+seconds||0));
  if(s<60)return `${s} s`;
  const m=Math.floor(s/60),r=s%60;
  return r?`${m} min ${r} s`:`${m} min`;
}
function workoutPlanSummaryHtml(prescription,ds){
  const steps=(prescription&&prescription.steps)||[];
  if(!steps.some(step=>step.type==="strength"))return"";
  let n=0;
  const rows=steps.map(step=>{
    if(step.type==="strength"){
      n++;
      const exercise=exerciseBySlug(step.exerciseSlug,true);
      const name=exercise?exercise.name:step.label;
      const lastLoad=ds?lastLoadLabel(ds,step.exerciseSlug):"";
      return `<li class="plan-row"><span class="plan-n">${n}</span><div class="plan-main"><b>${esc(name)}</b>
        <div class="plan-dose"><span>${step.prescribedSets} × ${esc(step.reps)}</span><span>Descanso ${esc(step.restLabel||formatRestShort(step.restSeconds))}</span><span>RPE ${esc(step.targetRpe)}/10</span>${lastLoad?`<span class="plan-last">Última vez ${esc(lastLoad)}</span>`:""}</div></div></li>`;
    }
    const minutes=Math.max(1,Math.round((+step.durationSeconds||0)/60));
    const moves=Array.isArray(step.movements)?step.movements.map(m=>m.name).join(" · "):"";
    const optional=step.phase==="warmup"||step.phase==="cooldown";
    return `<li class="plan-row plan-timed"><span class="plan-n">·</span><div class="plan-main"><b>${esc(step.label)}${optional?' <span class="plan-opt">opcional</span>':""}</b><div class="plan-dose"><span>${minutes} min</span></div>${moves?`<div class="muted small" style="margin-top:2px">${esc(moves)}</div>`:""}</div></li>`;
  }).join("");
  const sets=steps.filter(step=>step.type==="strength").reduce((sum,step)=>sum+(+step.prescribedSets||0),0);
  return `<div class="plan-summary"><div class="muted small">Qué vas a hacer hoy · ${n} ejercicios · ${sets} series${prescription.durationLabel?` · ${esc(prescription.durationLabel)}`:prescription.estimatedMinutes?` · ~${prescription.estimatedMinutes} min`:""}</div><ol class="plan-list">${rows}</ol>
    ${n>1?`<div class="muted small plan-between-rest">Entre ejercicios: ${formatRestShort(betweenExerciseRestSeconds())} de descanso</div>`:""}
    <button class="link-btn small" onclick="explainWorkoutEffort()">¿Qué es RPE?</button></div>`;
}

// Receta (ingredientes + gramos) de la comida, desde la DB, respetando override.
function mealRecipe(b,ms){
  const o=ms&&ms.ovr;
  // REQ-271: líneas reales que registró el usuario (gramos/ml); también alimentan la lista de compra.
  if(o&&Array.isArray(o.components)&&o.components.length){
    const lines=normalizeComponents(o.components).filter(c=>c.unit!=="portion")
      .map(c=>({name:c.name,grams:c.amount,label:componentAmountLabel(c)}));
    if(lines.length)return{dish:{name:o.name},lines,components:true};
  }
  // Una comida preparada por el coach trae sus propios ingredientes con gramos.
  if(o&&Array.isArray(o.ingredientes)&&o.ingredientes.length){
    const lines=o.ingredientes.map(x=>({name:x.nombre||x.name||"(ingrediente)",grams:+(x.gramos!=null?x.gramos:x.grams)})).filter(l=>l.grams>0);
    if(lines.length)return{dish:{name:o.name},lines,generated:true};
  }
  if(o&&o.kcal!=null&&o.dishName==null)return null;           // macros manuales: sin receta
  // Snapshot materializado del nutritionPlan (REQ-82): trae sus propios
  // ingredientes ya escalados al target del slot; tiene prioridad sobre la
  // receta BASE del catálogo (REQ-162, mismo criterio que mealValue()).
  if((!o||o.dishName==null)&&b.src==="nutritionPlan"&&Array.isArray(b.ingredientes)&&b.ingredientes.length){
    const lines=b.ingredientes.map(x=>({name:x.nombre||x.name||"(ingrediente)",grams:+(x.gramos!=null?x.gramos:x.grams)})).filter(l=>l.grams>0);
    if(lines.length)return{dish:{name:b.name},lines};
  }
  const dn=o&&o.dishName!=null?o.dishName:b.dishName;
  if(!dn||!DB.loaded)return null;
  const d=dishByName(dn);if(!d)return null;
  const lines=DB.dishIng.filter(x=>x.dish_id===d.id)
    .map(l=>{const i=ingById(+l.ingredient_id);return{name:i?i.name:"(ingrediente)",grams:+l.grams};})
    .filter(l=>l.grams>0);
  return lines.length?{dish:d,lines}:null;
}

function currentWeightWeek(){

  const today=todayStr();if(today<START)return 1;if(today>END)return last;
  const w=weekOf(today);return Math.min(last,Math.max(1,(w&&w.num)||1));

function weightRows(weeks){

// Resumen de composición corporal: masa grasa/magra de la última semana + cambios.
// Color de una variación (peso o grasa) según la dirección del objetivo del
// usuario, no siempre "bajar=bueno" (REQ-164): en volumen subir es la meta;
// en mantenimiento se tolera una variación pequeña sin alarmar (mismo umbral
// de 0.4 que ya usa el check-in semanal, REQ-160, para "deriva significativa").
function goalAwareDeltaColor(delta,goal){
  if(delta==null)return"var(--good)";
  if(goal==="volumen")return delta>=0?"var(--good)":"var(--warn)";
  if(goal==="mantenimiento")return Math.abs(delta)<=0.4?"var(--good)":"var(--warn)";
  return delta<=0?"var(--good)":"var(--warn)"; // deficit (y fallback)
}
function bodyComposition(){
  const last=lastWeighedWeek(); if(last==null)return "";
  const comp=composition(last);
  const goal=(profile&&profile.prefs&&profile.prefs.goal)||"deficit";
  // semana previa con datos para los deltas
  const prevWk=Object.keys(WEIGHT_RANGES).map(Number).filter(n=>n<last&&wkg(n)!=null).sort((a,b)=>b-a)[0];
  const dKg=prevWk!=null?(wkg(last)-wkg(prevWk)):null;
  const dBf=(prevWk!=null&&wbf(last)!=null&&wbf(prevWk)!=null)?(wbf(last)-wbf(prevWk)):null;
  const sign=v=>v>0?"+"+v.toFixed(1):v.toFixed(1);
  const cards=[];
  if(comp){
    cards.push(`<div class="scard"><div class="n">${comp.lean.toFixed(1)}</div><div class="l">masa magra kg</div></div>`);
    cards.push(`<div class="scard"><div class="n">${comp.fat.toFixed(1)}</div><div class="l">masa grasa kg</div></div>`);
  }
  if(dKg!=null) cards.push(`<div class="scard"><div class="n" style="color:${goalAwareDeltaColor(dKg,goal)}">${sign(dKg)}</div><div class="l">Δ peso (sem)</div></div>`);
  if(dBf!=null) cards.push(`<div class="scard"><div class="n" style="color:${goalAwareDeltaColor(dBf,goal)}">${sign(dBf)}</div><div class="l">Δ grasa %</div></div>`);
  if(!cards.length)return "";
  const cols=Math.min(cards.length,2);
  return `<div class="muted small" style="margin:0 4px 8px">Composición · semana ${last}${wbf(last)!=null?` · ${wbf(last)}% grasa`:""}</div>
    <div class="summary" style="grid-template-columns:repeat(${cols},1fr);margin-bottom:14px">${cards.join("")}</div>`;
}

const SESSION_REJECTED_MEALS=new Map();
function rememberRejectedMeal(ds,name){
  const clean=String(name||"").trim();
  if(!ds||!clean)return;
  const dish=DB.loaded?dishByName(clean):null;
  const key=dish?dishBlockKey(dish):coachKey(clean);
  if(!key)return;
  if(!SESSION_REJECTED_MEALS.has(ds))SESSION_REJECTED_MEALS.set(ds,new Map());
  SESSION_REJECTED_MEALS.get(ds).set(key,clean);

// Prefs con los descartes de la sesión sumados a blockedDishes: así el catálogo

function prefsWithSessionRejections(prefs,ds){
  const extra=sessionRejectedMeals(ds);

// Antes la referencia eran los 12 platos más cercanos en kcal: idéntica para todo
// usuario con metas parecidas (y casi la mitad mexicana en almuerzo), así que el
// coach proponía lo mismo a todos. Ahora toma los 24 más cercanos, rota el orden
// por usuario+fecha y limita a 3 los platos de cada cocina que el usuario no eligió.
function slotDishReferenceLines(slotTargets,prefs,ds){
  if(!DB.loaded)return"(base de datos no conectada)";
  const nd=window.FITBUD_NUTRITION_DOMAIN;
  const preferred=nd&&nd.preferredCuisineTags?nd.preferredCuisineTags(prefs):[];
  const seed=(uid()||"")+"|"+(ds||"");
  return (slotTargets||[]).map(slot=>{
    const targetKcal=Number(slot&&slot.target&&slot.target.kcal)||0;
    const kcalGap=item=>Math.abs((item.m.kcal||0)-targetKcal);
    const near=promptCompatibleDishesForSlot(slot.id,prefs)
      .map(d=>({d,m:dishMacros(d.id)}))
      .sort((a,b)=>kcalGap(a)-kcalGap(b))
      .slice(0,24)
      .map(item=>({...item,rot:hashText(seed+"|"+slot.id+"|"+item.d.id)}))
      .sort((a,b)=>a.rot<b.rot?-1:a.rot>b.rot?1:0);
    const perCuisine=new Map(),picked=[];
    near.forEach(item=>{
      if(picked.length>=12)return;
      const tags=nd&&nd.cuisineTagsForDish?nd.cuisineTagsForDish(item.d):[];
      if(tags.some(tag=>!preferred.includes(tag)&&(perCuisine.get(tag)||0)>=3))return;
      tags.forEach(tag=>perCuisine.set(tag,(perCuisine.get(tag)||0)+1));
      picked.push(item);
    });
    const candidates=picked
      .sort((a,b)=>kcalGap(a)-kcalGap(b))
      .map(({d,m})=>`${d.name} [${dishSlotMeta(d)}] ${m.kcal}kcal P${m.p}/C${m.c}/G${m.f}`);
    return `${slot.id}: ${candidates.length?candidates.join("; "):"(sin platos de referencia para este slot; crea una opción simple compatible)"}`;
  }).join("\n");
}

function normalizeCoachAction(raw){
  if(!raw||typeof raw!=="object"||Array.isArray(raw))return null;
  const rawTipo=coachKey(raw.tipo||raw.type||raw.action||"");
  const tipo=COACH_ACTION_ALIASES[rawTipo]||rawTipo;
  if(!COACH_ACTION_TYPES.has(tipo))return null;
  const action={tipo,descripcion:coachCopy(raw.descripcion||raw.description||COACH_ACTION_LABELS[tipo]||"Aplicar")};
  const ds=String(raw.ds||raw.fecha||raw.date||"").trim();
  if(ds)action.ds=ds;
  if(tipo==="registrar_comida"||tipo==="cambiar_plato"){
    const slot=raw.slot||raw.meal_id||raw.comida||raw.meal||raw.id;
    if(slot!=null)action.slot=String(slot).trim();
  }
  if(tipo==="cambiar_plato"){
    const dishName=raw.dishName||raw.dish_name||raw.plato||raw.nombre_plato||raw.dish||raw.nombre;
    if(dishName!=null)action.dishName=coachCopy(String(dishName).trim());
  }
  if(tipo==="adaptar_entreno"){
    const reasonKey=coachKey(raw.reason||raw.motivo||raw.option||raw.opcion||"");
    action.reason=COACH_WORKOUT_REASON_ALIASES[reasonKey]||reasonKey;
  }
  if(tipo==="registrar_peso"){
    const kg=raw.kg!=null?raw.kg:(raw.peso!=null?raw.peso:raw.weight_kg);
    const bf=raw.bf_pct!=null?raw.bf_pct:(raw.grasa_pct!=null?raw.grasa_pct:raw.body_fat_pct);
    action.kg=Number(kg);
    if(bf!=null&&bf!=="")action.bf_pct=Number(bf);
  }
  if(DOMAIN_CONTRACTS.validateCoachAction){
    const v=DOMAIN_CONTRACTS.validateCoachAction(action);
    if(!v.ok)return null;
  }
  return action;
}
function coachFindMeal(ds,action){
  const key=coachKey(action&&action.slot);
  if(!key)return null;
  return buildDay(ds).meals.find(m=>[m.id,m.slot,m.name].some(v=>coachKey(v)===key))||null;
}

function coachApplicationEntitlement(){
  if(profile&&profile.is_admin)return {ok:true};
  if(effectiveSettings&&effectiveSettings().apiKey)return {ok:true};
  if(!entitlementChecked)return {ok:false,reason:"Espera a que se valide tu plan antes de aplicar esta acción."};
  return (entitlement||hasActivePremiumTrial())?{ok:true}:{ok:false,reason:"Activa tu plan para aplicar acciones del coach."};
}
function canApplyCoachAction(raw){
  const action=normalizeCoachAction(raw);
  if(!action)return {ok:false,reason:"La propuesta no tiene una acción segura para aplicar."};
  if(!session&&!effectiveSettings().apiKey)return {ok:false,action,reason:"Vuelve a iniciar sesión para aplicar esta acción."};
  if(!isActive())return {ok:false,action,reason:"Tu cuenta no está activa."};
  if(!hasRequiredConsents()||!hasCurrentScreening())return {ok:false,action,reason:"Revisa privacidad y seguridad antes de aplicar acciones."};
  const ent=coachApplicationEntitlement();
  if(!ent.ok)return {ok:false,action,reason:ent.reason};

  const today=todayStr();
  const ds=action.ds||today;
  const mutatesDay=action.tipo!=="registrar_peso";
  if(mutatesDay&&ds!==today)return {ok:false,action,reason:"El coach solo puede aplicar cambios sobre el día de hoy."};
  if(mutatesDay&&!inRange(ds))return {ok:false,action,reason:"El día está fuera del ciclo activo."};
  if(mutatesDay&&!hasCompleteOnboarding((profile&&profile.prefs)||{}))return {ok:false,action,reason:"Completa tu perfil antes de aplicar cambios."};
  if(mutatesDay&&coachActionDayClosed(ds))return {ok:false,action,reason:"El día ya está cerrado; no lo modifico desde el coach."};

  if(action.tipo==="marcar_descanso"){
    const st=dayState(ds);const ew=effectiveWorkout(ds);
    if(ew.workout&&ew.workout.id==="descanso")return {ok:false,action,reason:"Hoy ya es un descanso planificado."};
    if(st.workoutDone||workoutHasRecordedActivity(st))return {ok:false,action,reason:"La sesión ya tiene registro; no la reescribo."};
    return {ok:true,action,ds};
  }
  if(action.tipo==="registrar_comida"){
    const meal=coachFindMeal(ds,action);
    if(!meal)return {ok:false,action,reason:"No encontré esa comida en el día de hoy."};
    const ms=mealState(ds,meal.id);const v=mealValue(meal,ms);
    if(ms.done)return {ok:false,action,reason:"Esa comida ya está registrada."};
    if(!homeDayHasPreparedMeals(ds,buildDay(ds))||!(v.name||v.kcal))return {ok:false,action,reason:"Primero prepara una comida válida para ese espacio."};
    return {ok:true,action,ds,meal};
  }
  if(action.tipo==="cambiar_plato"){
    const meal=coachFindMeal(ds,action);
    if(!meal)return {ok:false,action,reason:"No encontré ese espacio de comida en el día de hoy."};
    if(mealState(ds,meal.id).done)return {ok:false,action,reason:"La comida ya está registrada; no cambio su historial."};
    if(!DB.loaded)return {ok:false,action,reason:"Actualiza el catálogo antes de cambiar platos desde el coach."};
    const dish=coachFindDish(action);
    if(!dish)return {ok:false,action,reason:"El plato propuesto no existe en el catálogo."};
    if(!dishSupportsSlot(dish,meal.id))return {ok:false,action,reason:"El plato propuesto no corresponde a ese espacio de comida."};
    const blocked=coachDishBlockedByProfile(dish);
    if(blocked.blocked)return {ok:false,action,reason:"El plato propuesto choca con una restricción o preferencia del perfil."};
    const macros=dishMacros(dish.id);
    if(!macros||!(macros.kcal>0))return {ok:false,action,reason:"El plato no tiene macros calculables desde receta."};
    if(macros.kcal>buildDay(ds).target.kcal)return {ok:false,action,reason:"El plato excede la meta diaria completa."};
    return {ok:true,action,ds,meal,dish,macros};
  }
  if(action.tipo==="adaptar_entreno"){
    const st=dayState(ds);const ew=effectiveWorkout(ds);
    if(trainingSafetyHold())return {ok:false,action,reason:"El entrenamiento está pausado por seguridad."};
    if(ew.workout&&ew.workout.id==="descanso")return {ok:false,action,reason:"Hoy ya es descanso planificado."};
    if(st.workoutDone||normalizedWorkoutExecution(ds))return {ok:false,action,reason:"La sesión ya tiene registro; no la reescribo."};
    return {ok:true,action,ds};
  }
  if(action.tipo==="registrar_peso"){
    return {ok:true,action,ds:today,week:coachActionCurrentWeek(today)};
  }
  return {ok:false,action,reason:"Esta acción no está disponible."};
}

// Parsea la respuesta JSON del coach; si falla devuelve texto libre como educativo.
function parseCoachReply(raw){
  const cleaned=raw.trim().replace(/^```json?\s*/i,"").replace(/```\s*$/,"").trim();
  const a=cleaned.indexOf("{"); const b=cleaned.lastIndexOf("}");
  if(a>=0&&b>a){
    try{
      const j=JSON.parse(cleaned.slice(a,b+1));
      if(j&&j.respuesta){
        const type=["educativo","propuesta"].includes(j.type)?j.type:"educativo";
        const accion=type==="propuesta"?normalizeCoachAction(j.accion):null;
        return{type:accion?"propuesta":"educativo",text:String(j.respuesta),accion};
      }
    }catch(e){}
  }
  return{type:"educativo",text:raw,accion:null};
}

// Aplica la acción propuesta por el coach tras confirmación del usuario.
function applyCoachAction(msgId){
  const msgs=loadCoachChat();

    toast("Comida registrada");
  }else if(a.tipo==="cambiar_plato"){
    const ms=mealState(ds,decision.meal.id);
    const prev=ms.ovr?ms.ovr.name:null;
    ms.ovr={name:decision.dish.name,dishName:decision.dish.name,userSet:true};
    addContingencyEntry(ds,{type:"coach_meal_change",id:decision.meal.id,reason:"coach_action",chosen:decision.dish.name,prev});
    commitDay(ds);
    toast("Comida actualizada");
  }else if(a.tipo==="adaptar_entreno"){
    msg._applied=true;
    msg.type="aplicado";
    saveCoachChat(msgs);
    renderCoach();
    if(a.reason==="sesion_perdida")openMissedSession(ds);
    else openWorkoutContingency(ds,a.reason);
    toast("Elige la adaptación");
    return;
  }else if(a.tipo==="registrar_peso"){
    const patch={kg:a.kg};
    if(a.bf_pct!=null)patch.bf=a.bf_pct;
    setWeightEntry(decision.week,patch);
    toast("Peso registrado");
  }
  msg._applied=true;
  msg.type="aplicado";
  saveCoachChat(msgs);
  renderCoach();
}

const CHAT_TURNS_KEY="evolv_chat_turns_v1";
function labsConversationalEnabled(){const l=(profile&&profile.prefs&&profile.prefs.labs)||{};return l.conversational===true;}
function chatModeActive(){return !!(session&&labsConversationalEnabled()&&profile.prefs.uiMode==="chat");}
async function applyLabsParam(){
  let flag;
  try{flag=new URLSearchParams(location.search).get("labs");}catch(e){return;}
  if(flag!=="conversacion"&&flag!=="off")return;
  try{const url=new URL(location.href);url.searchParams.delete("labs");history.replaceState(null,"",url.pathname+url.search+url.hash);}catch(e){}
  if(!profile)return;
  const on=flag==="conversacion";
  const prefs={...(profile.prefs||{}),labs:{...((profile.prefs&&profile.prefs.labs)||{}),conversational:on},...(on?{}:{uiMode:"normal"})};
  profile.prefs=prefs;render();
