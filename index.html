  return btn?+btn.dataset.v:null;
}

// Motor determinista: analiza las respuestas y propone un ajuste dentro de límites documentados.
// Límites: ±200 kcal/día máximo por semana · mínimo absoluto 1200 kcal/día.
// Señal de alerta (dolor) → bloquea recomendaciones de entrenamiento.
function analyzeCheckinAnswers(answers,prefs){
  const details=[];
  let calorieAdjust=0,intensityAdj=null,safetyFlag=false;
  const goal=prefs.goal||"deficit";
  const kcal=+prefs.calorieTarget||2000;

  // 1. Señales de alerta de seguridad
  if(answers.injuries&&answers.injuries.trim()){
    safetyFlag=true;
    details.push("Mencionas dolor o molestias: consulta con un profesional antes de ajustar el entrenamiento.");
  }

  // 2. Análisis de peso (si hay datos de semana anterior y actual)
  const w=answers.weight,pw=answers.prevWeight;
  if(w&&pw){
    const delta=w-pw;
    if(goal==="volumen"){
      if(delta<0.15){calorieAdjust+=100;details.push("Ganancia de peso menor a lo esperado: añadir calorías.");}
      else if(delta>0.6){calorieAdjust-=100;details.push("Ganancia rápida: reducir un poco para cuidar la composición.");}
    }else if(goal==="mantenimiento"){
      if(delta>0.4){calorieAdjust-=100;details.push("Peso subiendo en mantenimiento: ajustar calorías.");}
      else if(delta<-0.4){calorieAdjust+=100;details.push("Peso bajando más de lo esperado: añadir calorías.");}
    }else{// deficit
      if(delta>0.3){calorieAdjust-=100;details.push("El peso subió esta semana: ajustar calorías.");}
      else if(delta<-0.8){calorieAdjust+=100;details.push("Pérdida muy rápida: añadir calorías para proteger músculo.");}
    }
  }

  // 3. Hambre y energía. Las 7 escalas del check-in son opcionales: una sin
  // responder (readCiScale→null) se neutraliza con ||3 (punto medio), igual
  // que ya hacían nutrición/dificultad/recuperación más abajo — si no, null<=2
  // es true y una escala nunca respondida se lee como "energía/sueño bajos"
  // y dispara mensajes/ajustes sobre un dato que el usuario nunca dio (REQ-165).
  if(answers.hunger>=4&&(answers.energy||3)<=2){
    if(calorieAdjust===0){calorieAdjust+=100;details.push("Hambre alta y energía baja: añadir calorías.");}
    else details.push("Hambre alta y energía baja: revisa la distribución de comidas.");
  }else if(answers.hunger>=4&&calorieAdjust<=0){
    calorieAdjust+=Math.min(100,Math.abs(calorieAdjust)+50);
    details.push("Sensación de hambre elevada durante la semana.");
  }else if((answers.energy||3)<=2&&(answers.sleep||3)<=2){
    details.push("Energía y sueño bajos: prioriza el descanso y revisa la distribución de macros.");
  }

  // 4. Adherencia nutricional baja → no cambiar calorías, pedir consistencia
  if((answers.nutrition||3)<=2&&calorieAdjust===0){
    details.push("Adherencia al plan baja: la prioridad de la próxima semana es la consistencia.");
  }

  // 5. Recuperación y dificultad de entrenamiento (solo sin señal de alerta)
  if(!safetyFlag){
    if((answers.difficulty||3)>=5||(answers.soreness||3)<=1){
      intensityAdj="reduce";
      details.push("Alta fatiga o recuperación lenta: reduce la intensidad o añade un descanso activo.");
    }else if((answers.difficulty||3)<=2&&(answers.soreness||3)>=4){
      intensityAdj="increase";
      details.push("Carga percibida baja y buena recuperación: puedes subir el desafío progresivamente.");
    }
  }

  // 6. Aplicar límites de seguridad documentados
  calorieAdjust=Math.max(-CHECKIN_MAX_KCAL_ADJUST,Math.min(CHECKIN_MAX_KCAL_ADJUST,calorieAdjust));
  if(kcal+calorieAdjust<CHECKIN_MIN_KCAL)calorieAdjust=CHECKIN_MIN_KCAL-kcal;

  const keep=calorieAdjust===0&&!intensityAdj&&!safetyFlag;
  const reason=details.length?details.join(" "):(keep?"Tu progreso esta semana está dentro de lo esperado.":"Ajuste sugerido según tu seguimiento.");
  return{keep,calorieAdjust,intensityAdj,reason,safetyFlag,details};
}

// Lee el formulario, corre el análisis y muestra la propuesta en el mismo modal.
function submitWeeklyCheckin(){
  const due=window._ciDue;if(!due)return;
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const stats=weeklyCheckinStats(due.start,due.end,due.num);
  const answers={
    weight:+$("#ci_kg").value||null,
    bodyFat:+$("#ci_bf").value||null,
    hunger:readCiScale("hunger"),
    energy:readCiScale("energy"),
    sleep:readCiScale("sleep"),
    stress:readCiScale("stress"),
    soreness:readCiScale("soreness"),
    difficulty:readCiScale("difficulty"),
    nutrition:readCiScale("nutrition"),
    sessionsDone:+$("#ci_done").value||0,
    sessionsPlanned:stats.sessionsPlanned,
    injuries:($("#ci_injuries").value||"").trim(),
    prevWeight:stats.prevWeight,
  };
  const proposal=analyzeCheckinAnswers(answers,prefs);
  // Calcular nuevos macros: proteína fija, carbs y grasas escalan proporcionalmente.
  const kcal=+prefs.calorieTarget||2000;
  const newKcal=kcal+proposal.calorieAdjust;
  const protKcal=(+prefs.proteinTarget||0)*4;
  const oldRem=Math.max(0,kcal-protKcal);
  const newRem=Math.max(0,newKcal-protKcal);
  const ratio=oldRem>0?newRem/oldRem:1;
  const newCarb=Math.round((+prefs.carbTarget||0)*ratio);
  const newFat=Math.round((+prefs.fatTarget||0)*ratio);
  const prot=+prefs.proteinTarget||0;
  window._ciData={due,answers,proposal,newKcal,newCarb,newFat,prot};

  const ds=n=>n>0?"+"+n:""+n;
  const safeNote=proposal.safetyFlag
    ?`<div class="alert" style="margin-top:10px">⚠️ Tienes una señal de alerta. Consulta con un profesional antes de aumentar la intensidad.</div>`:"";
  const keepBlock=proposal.keep
    ?`<div class="ai-box" style="margin-top:10px">✓ Tu plan está bien calibrado. Sigue igual la próxima semana.</div>`:"";
  const calorieBlock=proposal.calorieAdjust!==0
    ?`<div class="ci-delta">
        <div class="ci-dlab">Calorías diarias</div>
        <div class="ci-drow"><span>${kcal} kcal → <b>${newKcal} kcal</b></span>
          <span class="${proposal.calorieAdjust>0?"ci-dpos":"ci-dneg"}">${ds(proposal.calorieAdjust)} kcal/día</span></div>
        <div class="ci-drow muted small"><span>Prot ${prot} g (sin cambio) · Carb ${Math.round(+prefs.carbTarget||0)} → ${newCarb} g · Grasa ${Math.round(+prefs.fatTarget||0)} → ${newFat} g</span></div>
      </div>`:"";
  const intensityNote=proposal.intensityAdj
    ?`<div class="ai-box" style="margin-top:10px;border-color:${proposal.intensityAdj==="reduce"?"var(--warn)":"var(--border-acc)"}">${proposal.intensityAdj==="reduce"
      ?"Recomendación: esta semana prioriza el descanso y reduce la carga. Puedes usar las opciones de adaptación en Entreno."
      :"Recomendación: tu cuerpo responde bien. Añade carga progresiva en tus series principales."}</div>`:"";

  const el=document.querySelector(".sheet");
  if(el)el.innerHTML=`<div class="closebar"><button onclick="closeModal()" aria-label="Cerrar">✕</button></div>
    <h3 id="sheet-title">Ajuste · Semana ${due.num+1}</h3>
    <p class="muted small">${esc(proposal.reason)}</p>
    ${safeNote}${keepBlock}${calorieBlock}${intensityNote}
    <div class="muted small" style="margin-top:12px">Ajuste máximo: ±${CHECKIN_MAX_KCAL_ADJUST} kcal/día. Empieza con tu próxima semana; no cambia la meta de esta semana ni de lo ya registrado.</div>
    <div class="row" style="gap:8px;margin-top:16px;flex-wrap:wrap">
      ${!proposal.keep?`<button class="btn btn-accent" style="flex:1" onclick="applyWeeklyCheckinProposal('${due.key}')">Aplicar ajuste</button>`:""}
      <button class="btn${proposal.keep?" btn-accent":""}" style="${proposal.keep?"flex:1":""}" onclick="declineWeeklyCheckinProposal('${due.key}')">${proposal.keep?"Entendido":"Mantener el plan actual"}</button>
    </div>`;
}

// REQ-234: fecha en que empieza la próxima semana del plan que todavía no
// arrancó (no la semana en curso), para que el ajuste del check-in no
// reescriba la meta de días ya prescritos/ejecutados.
function nextCheckinEffectiveDate(){
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const calendar=planCalendarForPrefs(prefs);
  const today=todayStr();
  const currentWeek=calendar.weeks.find(w=>today>=w.start&&today<=w.end);
  return currentWeek?addDays(currentWeek.end,1):addDays(today,1);
}
// Aplica el ajuste de macros al perfil (en diferido) y guarda el check-in.
async function applyWeeklyCheckinProposal(weekKey){
  const d=window._ciData;if(!d)return;
  const prefs=migrateProfilePrefs({...((profile&&profile.prefs)||{})});
  if(d.proposal.calorieAdjust!==0){
    // No se mutan calorieTarget/carbTarget/fatTarget al instante (eso
    // reescribiría de inmediato la meta de hoy y de días ya prescritos).
    // Queda pendiente y applyDueCheckinAdjustment() lo aplica a las prefs
    // vivas recién cuando empiece la semana aún no iniciada.
    prefs.pendingCheckinAdjustment={kcal:d.newKcal,carb:d.newCarb,fat:d.newFat,wk:weekKey,effectiveFrom:nextCheckinEffectiveDate()};
  }
  const checkin={wk:weekKey,num:d.due.num,start:d.due.start,end:d.due.end,
    at:new Date().toISOString(),answers:d.answers,proposal:d.proposal,accepted:true,skipped:false};
  if(!Array.isArray(prefs.weeklyCheckins))prefs.weeklyCheckins=[];
  prefs.weeklyCheckins.push(checkin);
  window._ciData=null;
  const result=await saveProfilePrefs(prefs,{source:"checkin",reason:"check-in semanal "+weekKey});
  closeModal();
  if(result&&result.error){toast("No se pudo guardar el ajuste");return;}
  render();toast("Ajuste guardado: se aplicará cuando empiece tu próxima semana");
}
// REQ-234: aplica a las prefs vivas el ajuste de check-in diferido, solo
// cuando ya llegó su fecha efectiva. Antes de eso, calorieTarget/carbTarget/
// fatTarget siguen igual y ningún día (pasado, hoy o ya prescrito) cambia de meta.
async function applyDueCheckinAdjustment(){
  const pending=profile&&profile.prefs&&profile.prefs.pendingCheckinAdjustment;
  if(!pending||!pending.effectiveFrom||todayStr()<pending.effectiveFrom)return;
  const prefs={...profile.prefs,calorieTarget:pending.kcal,carbTarget:pending.carb,fatTarget:pending.fat};
  delete prefs.pendingCheckinAdjustment;
  profile.prefs=prefs; // refleja ya mismo en memoria; evita relanzar el guardado en el próximo render
  try{await saveProfilePrefs(prefs,{source:"checkin",reason:"check-in diferido "+(pending.wk||"")});}catch(e){/* best-effort; se reintenta en el próximo render */}
}

// Guarda el check-in sin aplicar cambios de macros.
async function declineWeeklyCheckinProposal(weekKey){
  const d=window._ciData;
  const prefs=migrateProfilePrefs({...((profile&&profile.prefs)||{})});
  const checkin={wk:weekKey,num:d?d.due.num:0,start:d?d.due.start:"",end:d?d.due.end:"",
    at:new Date().toISOString(),answers:d?d.answers:{},proposal:d?d.proposal:{},accepted:false,skipped:false};
  if(!Array.isArray(prefs.weeklyCheckins))prefs.weeklyCheckins=[];
  prefs.weeklyCheckins.push(checkin);
  window._ciData=null;
  await saveProfilePrefs(prefs,{source:"checkin",reason:"check-in mantenido "+weekKey});
  closeModal();render();toast("Plan sin cambios para la próxima semana");
}

// Registra el check-in como omitido (no vuelve a aparecer esta semana).
async function skipWeeklyCheckin(weekKey){
  const prefs=migrateProfilePrefs({...((profile&&profile.prefs)||{})});
  if(!Array.isArray(prefs.weeklyCheckins))prefs.weeklyCheckins=[];
  if(!prefs.weeklyCheckins.find(c=>c.wk===weekKey)){
    const due=weeklyCheckinDue()||{num:0,start:"",end:""};
    prefs.weeklyCheckins.push({wk:weekKey,num:due.num,start:due.start,end:due.end,
      at:new Date().toISOString(),answers:{},proposal:{},accepted:false,skipped:true});
  }
  await saveProfilePrefs(prefs,{source:"checkin",reason:"check-in omitido "+weekKey});
  closeModal();render();toast("Check-in omitido para esta semana");
}

// Historial de check-ins completados para mostrar en Progreso.
function weeklyCheckinHistory(){
  const checkins=getWeeklyCheckins().filter(c=>!c.skipped&&c.answers&&Object.keys(c.answers).length>0);
  if(!checkins.length)return"";
  const rows=[...checkins].reverse().slice(0,5).map(c=>{

    const status=c.accepted
      ?`<span class="badge b-PESAS">Aplicado · ${adjStr}</span>`

  return`<div class="section-h" style="margin:18px 4px 8px">Check-ins realizados</div>${rows}`;
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// REQ-150: la instalación de un SW nuevo es atómica (mismo cache versionado
// para HTML+JS), pero recargar puede interrumpir una acción en curso.
// REQ-213: sin botón flotante; la app se recarga sola al volver de segundo
// plano si no hay nada a medias, y si en 24 h no hubo ese momento lo ofrece en
// Perfil → Cuenta.
function registerServiceWorker(){
  announceAppUpdated();
  if(!CONFIG.pwa.registerServiceWorker||!("serviceWorker" in navigator))return;
  const host=location.hostname;
  const secure=location.protocol==="https:"||host==="localhost"||host==="127.0.0.1"||host==="::1";
  if(!secure)return;
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js")
      .then(reg=>{
        window._swRegistration=reg;
        reg.addEventListener("updatefound",()=>{
          const installing=reg.installing;
          if(!installing)return;
          installing.addEventListener("statechange",()=>{
            // "installed" con un controller ya activo = actualización real,
            // no la primera instalación (ahí todavía no hay controller).
            if(installing.state==="installed"&&navigator.serviceWorker.controller)notifyAppUpdateAvailable();
          });
        });
      })
      .catch(e=>console.warn("No se pudo registrar el service worker",e));
  });
}

// Escucha cambios de sesión (login en otra pestaña, refresh de token, logout).
function setupAuthListener(){
  if(!supa||window._authSub)return;
  window._authSub=supa.auth.onAuthStateChange((event,sess)=>{
    // REQ-156: capturar el uid ANTES de reasignar session — si no, un cierre
    // de sesión por evento (token vencido, logout remoto, otra pestaña) deja
    // uid()===null y clearSignedOutState() no puede aislar/purgar la cola
    // offline del usuario saliente.
    const prevUid=event==="SIGNED_OUT"?uid():null;
    session=sess||null;
    if(event==="PASSWORD_RECOVERY"){passwordRecovery=true;passwordRecoveryError="";passwordRecoveryMode="recovery";authReady=true;render();}
    else if(event==="SIGNED_OUT")clearSignedOutState(prevUid);
    else if(event==="SIGNED_IN"){
      const redirectMode=passwordRedirectMode();
      if(redirectMode){passwordRecovery=true;passwordRecoveryError="";passwordRecoveryMode=redirectMode;authReady=true;render();return;}
      if(!profile||profile.id!==uid())onAuth();

  });
}

function hasStoredAuthSession(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(/^sb-.+-auth-token$/.test(k||"")&&localStorage.getItem(k))return true;

  // esperar a /api/config ni a Supabase; al resolver la sesión se confirma.

  // Si la portada ya se pintó sin catálogo, se actualizan solo los planes al
  // resolver (REQ-151) para no perder el scroll ni la FAQ abierta.
  loadCatalog().then(()=>{if(!session)refreshLandingPlans();});

  if(captureInviteCode()&&!hasStoredAuthSession()){window._showAuth=true;window._authMode="up";}

    $("#tabs").innerHTML="";$("#app").classList.add("landing-host");

  // Producción: las credenciales de Supabase llegan de /api/config (Vercel).

  // en vez del login. Si ya hay override local, no hace falta esperar.
  const hasLocalCreds=!!(S.settings&&S.settings.supaUrl&&S.settings.supaKey);
  if(!hasLocalCreds)await loadRemoteConfig();

  const recoveryMode=passwordRedirectMode();

  setupAuthListener();
  await refreshAuth();         // resuelve sesión (authReady=true)
  if(legacyHostMigration())return;
  if(recoveryRedirect){
    passwordRecovery=true;
    passwordRecoveryMode=recoveryMode;
    passwordRecoveryError=session?"":(passwordRecoveryRedirectError()||(recoveryMode==="invite"?"El enlace de invitación ya expiró o no se pudo validar. Pide una nueva invitación.":"El enlace de recuperación ya expiró o no se pudo validar. Pide uno nuevo desde el inicio de sesión."));
    render();
    return;
  }
  if(session)await onAuth();
  // La portada optimista ya está pintada con los mismos planes: no repintar
  // (conserva el scroll y la pregunta abierta de la FAQ).
  else if(window._showAuth||!document.querySelector("#app .landing"))render();

}

    {sel:'[data-tab="progreso"]',title:"Progreso",body:"Registra tu peso semanal y mira tu evolución, racha y adherencia.",placement:"top"},
    {sel:'[data-tab="perfil"]',title:"Perfil",body:"Ajusta metas, comidas, entrenamiento y privacidad. Cada 4 semanas te proponemos revisar.",placement:"top"}
  ];
}
function tourEnsureStyle(){
  if(document.getElementById("tourStyle"))return;
  const s=document.createElement("style");s.id="tourStyle";
  s.textContent=`
  .tour-spot{position:fixed;z-index:9998;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,10,10,.76);pointer-events:none;transition:all .25s cubic-bezier(.4,0,.2,1)}
  .tour-tip{position:fixed;z-index:9999;max-width:300px;width:calc(100vw - 32px);background:var(--surf2);color:var(--txt);border:1px solid var(--border-2);border-radius:16px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .tour-tip h4{margin:0 0 6px;font-family:var(--font-display,inherit);font-size:16px;letter-spacing:-.02em}
  .tour-tip p{margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--muted)}
  .tour-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tour-dots{font-size:12px;color:var(--muted2)}
  .tour-actions{display:flex;gap:8px}
  .tour-btn{min-height:44px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--border-2);background:var(--surf3);color:var(--txt);cursor:pointer}
  .tour-btn.primary{background:var(--accent,#d6ff3a);border-color:transparent;color:var(--on-accent,#101010)}
  .tour-skip{background:none;border:none;color:var(--muted,#a8a8a0);font-size:12px;cursor:pointer;min-height:44px;padding:0 4px}
  @media(prefers-reduced-motion:reduce){.tour-spot{transition:none}}`;
  document.head.appendChild(s);
}
function maybeStartFitbrosTour(){
  if(_tour||tourSeen())return;
  if(!session||onboardingActive||view!=="hoy")return;
  if(!hasCompleteOnboarding((profile&&profile.prefs)||{}))return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>startFitbrosTour(false)));
}
function startFitbrosTour(manual){
  if(_tour)tourCleanup();
  if(view!=="hoy"){setView("hoy");}
  const steps=tourSteps().filter(s=>document.querySelector(s.sel));
  if(!steps.length){if(manual)toast("Abre la pestaña Hoy para ver la guía.");return;}
  tourEnsureStyle();
  const spot=document.createElement("div");spot.className="tour-spot";
  const tip=document.createElement("div");tip.className="tour-tip";
  tip.setAttribute("role","dialog");tip.setAttribute("aria-live","polite");tip.setAttribute("aria-modal","true");
  document.body.appendChild(spot);document.body.appendChild(tip);
  _tour={i:0,steps,spot,tip,manual:!!manual};
  window.addEventListener("resize",tourRender);
  window.addEventListener("scroll",tourRender,true);
  window.addEventListener("keydown",tourKey,true);
  if(typeof trackEvent==="function")try{trackEvent("tour_start",{manual:!!manual,steps:steps.length});}catch(e){}
  tourRender();
}
function tourKey(e){
  if(!_tour)return;
  if(e.key==="Escape"){e.preventDefault();tourFinish("skipped");}
  else if(e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();tourNext();}
  else if(e.key==="ArrowLeft"){e.preventDefault();tourPrev();}
}
function tourNext(){if(!_tour)return;if(_tour.i>=_tour.steps.length-1){tourFinish("done");}else{_tour.i++;tourRender();}}
function tourPrev(){if(!_tour||_tour.i===0)return;_tour.i--;tourRender();}
function tourRender(){
  if(!_tour)return;
  const step=_tour.steps[_tour.i];
  const el=document.querySelector(step.sel);
  if(!el){tourNext();return;}
  const r=el.getBoundingClientRect();
  const pad=8,vw=window.innerWidth,vh=window.innerHeight;
  const sx=Math.max(8,r.left-pad),sy=Math.max(8,r.top-pad);
  const sw=Math.min(vw-16,r.width+pad*2),sh=r.height+pad*2;
  Object.assign(_tour.spot.style,{left:sx+"px",top:sy+"px",width:sw+"px",height:sh+"px"});
  const last=_tour.i===_tour.steps.length-1,first=_tour.i===0;
  _tour.tip.innerHTML=`
    <h4>${esc(step.title)}</h4>
    <p>${esc(step.body)}</p>
    <div class="tour-row">
      <button class="tour-skip" onclick="tourFinish('skipped')">${last?"Cerrar":"Saltar"}</button>
      <div class="tour-row" style="gap:8px">
        <span class="tour-dots">${_tour.i+1}/${_tour.steps.length}</span>
        <div class="tour-actions">
          ${first?"":`<button class="tour-btn" onclick="tourPrev()">Atrás</button>`}
          <button class="tour-btn primary" onclick="tourNext()">${last?"¡Entendido!":"Siguiente"}</button>
        </div>
      </div>
    </div>`;
  const tr=_tour.tip.getBoundingClientRect();
  const placeTop=step.placement==="top";
  let top=placeTop?(r.top-tr.height-14):(r.bottom+14);
  if(top<8)top=r.bottom+14;
  if(top+tr.height>vh-8)top=Math.max(8,r.top-tr.height-14);
  let left=Math.min(Math.max(8,r.left+r.width/2-tr.width/2),vw-tr.width-8);
  Object.assign(_tour.tip.style,{top:top+"px",left:left+"px"});
}
function tourCleanup(){
  if(!_tour)return;
  window.removeEventListener("resize",tourRender);
  window.removeEventListener("scroll",tourRender,true);
  window.removeEventListener("keydown",tourKey,true);
  if(_tour.spot)_tour.spot.remove();
  if(_tour.tip)_tour.tip.remove();
  _tour=null;
}
function tourFinish(reason){
  if(!_tour)return;
  if(typeof trackEvent==="function")try{trackEvent("tour_finish",{reason,step:_tour.i+1});}catch(e){}
  tourCleanup();
  tourMarkSeen(reason||"done");
}
registerServiceWorker();
setInterval(workoutTimerTick,1000);
// Captura el evento de instalación (Android/Chrome) y oculta la sugerencia si ya se instaló.
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallPrompt();});
window.addEventListener("appinstalled",()=>{UI.installDismissed=true;uiSave();removeInstallPrompt();});
// Cola offline: drenar al recuperar red; actualizar badge al perderla (REQ-28).
window.addEventListener("online",()=>{_updateSyncBadge();if(supa&&session)drainSyncQueue();});
window.addEventListener("offline",()=>_updateSyncBadge());
// REQ-244 (reemplaza la pausa implícita de REQ-155): la duración del entreno
// corre de inicio a fin, también con la app en segundo plano. Al salir se
// anota awayAt; al volver, una ausencia de más de una hora (sesión olvidada)
// deja la sesión en pausa en el momento en que se salió.
function markWorkoutsAway(){
  Object.keys(S.days||{}).forEach(ds=>{
    const execution=S.days[ds]&&S.days[ds].workoutExecution;
    if(execution&&execution.status==="in_progress"&&!execution.awayAt){
      execution.awayAt=new Date().toISOString();
      commitDay(ds);
    }
  });
}
function reconcileAwayWorkouts(){
  let paused=false;
  Object.keys(S.days||{}).forEach(ds=>{
    const execution=S.days[ds]&&S.days[ds].workoutExecution;
    if(!execution||!execution.awayAt)return;
    const result=WORKOUT_PLAYER.returnFromAway(execution,Date.now());
    if(result==="paused"){paused=true;execution.updatedAt=new Date().toISOString();}
    commitDay(ds);
  });
  if(paused)toast("Tu sesión quedó en pausa desde que saliste de la app");
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)markWorkoutsAway();else{reconcileAwayWorkouts();resyncWorkoutView();}});
window.addEventListener("pagehide",markWorkoutsAway);
// REQ-186: al volver a primer plano (iOS puede suspender los intervalos de la
// PWA), recalcular ya el reproductor en vez de esperar al próximo tick.
function resyncWorkoutView(){if(view==="entreno"&&session&&workoutRerenderSafe()){render();workoutTimerTick();}}
window.addEventListener("pageshow",e=>{if(e.persisted){reconcileAwayWorkouts();resyncWorkoutView();}});
render();                      // splash mientras resolvemos la sesión
boot();                        // carga config (Vercel) → conecta Supabase → resuelve sesión
// Inicializar badge de sincronización (vive fuera de #app para sobrevivir render()).
_updateSyncBadge();
</script>
