<title>Evolv — Tu mejor versión, un día a la vez</title>
<style>
  /* ════════════════════════════════════════════
     EVOLV — Mobile design tokens
     Dark · Púrpura primario · Terracota secundario
  ═══════════════════════════════════════════════ */
  :root{
    /* Marca Evolv · dirección "Escala" (REQ-180). Los nombres --purple-* / --terra-*
       se conservan por compatibilidad con las reglas existentes: hoy --purple-* es la
       escala lima (acción, progreso) y --terra-* la escala azul señal (datos, fases). */
    --purple-200:#ecffb0; --purple-300:#e2ff73; --purple-400:#d6ff3a; --purple-500:#bde81c; --purple-600:#8fb000;
    --terra-200:#c2d6ff; --terra-300:#8fb4ff; --terra-400:#3a7bff; --terra-500:#2f66db;
    /* Superficies */
    --black:#101010; --surf1:#161616; --surf2:#1e1e1e; --surf3:#262626; --surf4:#303030;
    /* Líneas */
    --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.13); --border-acc:rgba(214,255,58,.24);
    /* Acentos */
    --accent:var(--purple-400); --accent2:var(--terra-400); --on-accent:#101010;
    --accent-dim:rgba(214,255,58,.12); --accent-glow:rgba(214,255,58,.22);
    --terra-dim:rgba(58,123,255,.16); --terra-glow:rgba(58,123,255,.30);
    /* Semántica */
    --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --good-dim:rgba(34,197,94,.14); --warn-dim:rgba(245,158,11,.14); --bad-dim:rgba(239,68,68,.14);
    /* Aliases compat. con la app */
    --bg:var(--black); --card:var(--surf1); --card2:var(--surf2); --line:var(--border);
    --txt:#f2f2ee; --muted:#a8a8a0; --muted2:#8f8f87; /* REQ-192: ≥4.5:1 sobre bg/surf1/surf2 */
    /* Tipos de día */
    --pesas:var(--purple-400); --bajo:var(--terra-400); --refeed:var(--warn); --dietbreak:var(--purple-300); --libre:#5f5f58;
    /* Tipografía */
    --font-display:'Unbounded',system-ui,sans-serif;
    --font-body:'Manrope',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --r-sm:12px; --r-md:16px; --r-lg:22px;
    /* Bordes seguros para iPhone en modo PWA/standalone. */
    --safe-top:env(safe-area-inset-top,0px);
    --safe-right:env(safe-area-inset-right,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
  }
  *{box-sizing:border-box}
  /* REQ-221: nada puede arrastrar la página de lado (iOS ignora overflow-x en body) */
  html{height:100%;background:var(--black);overflow-x:clip}
  body{
    font-family:var(--font-body);background:var(--black);color:var(--txt);margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;
    -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 12% 8%,rgba(214,255,58,.04),transparent 40%),
                     radial-gradient(circle at 90% 96%,rgba(58,123,255,.05),transparent 46%);
    background-attachment:fixed;
  }
  #app{
    flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    width:100%;max-width:560px;margin:0 auto;
    padding:calc(14px + var(--safe-top))
            max(14px,var(--safe-right))
            calc(20px + var(--safe-bottom))
            max(14px,var(--safe-left));
  }
  /* REQ-221: en escritorio con barras clásicas, la barra de la columna es fina y discreta */
  #app{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
  #app.landing-host{max-width:none;padding:0}
  h1,h2{margin:0;font-family:var(--font-display);letter-spacing:-.02em}
  h3{margin:0;font-family:var(--font-body);letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--r-sm);color:var(--txt)}
  .btn{background:var(--surf2);padding:9px 14px;font-size:14px;font-weight:500;border:1px solid var(--border-2);border-radius:999px;transition:.15s}
  .btn:active{transform:scale(.97)}
  .btn-accent{background:var(--accent);color:var(--on-accent);font-weight:700;font-family:var(--font-body);border:none;box-shadow:0 1px 2px rgba(0,0,0,.35)}
  .btn-sm{padding:7px 13px;font-size:13px}
  /* Touch targets accesibles en pantallas táctiles (auditoría UX 23 jun 2026): mínimo 44px */
  @media(pointer:coarse){
    .btn-sm{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
    .chip-check{min-height:44px}
    .csec-h{min-height:44px}
    table input[type="number"],table input[type="text"]{min-height:44px}
  }
  .row{display:flex;gap:8px;align-items:center}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .center{text-align:center}

  /* Header */
  header{padding:6px 2px 14px}
  header h1,header h2{font-size:26px;font-weight:800;letter-spacing:-.03em}
  header h1 .muted,header h1 .small,h1 .muted,h1 .small,header h2 .muted,header h2 .small,h2 .muted,h2 .small{font-family:var(--font-body);font-weight:400;letter-spacing:0}
  .daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .daynav button{background:var(--surf2);border:1px solid var(--border-2);width:44px;height:44px;border-radius:14px;font-size:20px;color:var(--txt);display:flex;align-items:center;justify-content:center;transition:.15s}
  .daynav button:active{transform:scale(.94)}
  .dtitle{flex:1;text-align:center}
  .dtitle .date{font-family:var(--font-body);font-size:19px;font-weight:700;letter-spacing:-.02em}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
  .b-PESAS{background:var(--accent-dim);color:var(--purple-200)}
  .b-BAJO{background:var(--terra-dim);color:var(--terra-300)}
  .b-REFEED{background:var(--warn-dim);color:var(--warn)}
  .b-DIETBREAK{background:var(--accent-dim);color:var(--purple-300)}
  .b-Libre{background:var(--surf3);color:var(--muted)}
  .weeknote{font-size:12px;color:var(--muted);margin-top:2px}
  .alert{background:var(--warn-dim);border:1px solid rgba(245,158,11,.32);color:#fcd34d;border-radius:var(--r-md);padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.4}
  .alert.violet{background:var(--accent-dim);border-color:var(--border-acc);color:var(--purple-200)}

  /* Macro dashboard */
  .dash{background:linear-gradient(160deg,var(--surf2),var(--surf1));border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .kcal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .kcal-big{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.03em}
  .bar{height:8px;background:var(--surf3);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .fill-kcal{background:var(--accent2)}
  .macros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}
  .macro{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px}
  .macro .lab{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .macro .val{font-family:var(--font-body);font-size:15px;font-weight:700;margin:3px 0 8px}
  .macro.prot{grid-column:1 / -1;border-color:var(--border-acc)}
  .macro.prot .lab{font-size:12px}
  .macro.prot .val{font-size:18px}
  .fill-good{background:var(--good)} .fill-warn{background:var(--warn)} .fill-bad{background:var(--bad)}
  .fill-prot{background:var(--accent)} .fill-carb{background:var(--terra-400)} .fill-fat{background:var(--warn)}

  /* Hero: anillo de progreso + medidores de macros (jerarquía Ring + Meter) */
  .hero{display:flex;gap:18px;align-items:center}
  .ring{position:relative;flex:0 0 auto}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring-n{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1;letter-spacing:-.02em}
  .ring-l{font-size:11px;color:var(--muted);margin-top:3px}
  .hero-macros{flex:1;display:flex;flex-direction:column;gap:13px;min-width:0}
  .mm-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:12px;margin-bottom:5px}
  .mm-top .mm-lab{color:var(--txt);font-weight:500}
  .mm-top .mm-num{color:var(--muted2);font-family:var(--font-mono)}
  .kcal-line{margin-top:16px}
  .mini-macro-dash{padding:12px 14px;margin-bottom:12px}
  .mini-macro-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
  .mini-macro-kicker{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:2px}
  .mini-macro-main{font-size:13px;color:var(--muted2)}
  .mini-macro-main b{font-family:var(--font-body);font-size:20px;color:var(--txt);letter-spacing:0}
  .mini-macro-pill{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:4px 8px;font-size:11px;color:var(--muted2);white-space:nowrap}
  .mini-macro-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}
  .mini-macro-grid>[role="button"]{cursor:pointer;border-radius:var(--r-sm,6px)}
  .mini-macro-grid>[role="button"]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  .mini-macro-label{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:10px;color:var(--muted2);margin-bottom:4px}
  .mini-macro-label span{white-space:nowrap}
  .mini-macro-label b{color:var(--txt);font-weight:700;font-size:11px}
  .mini-macro-dash .bar{height:6px}
  .mm[role="button"]{cursor:pointer}
  .mm[role="button"]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:6px}
  .ring[role="button"]{cursor:pointer}
  .ring[role="button"]:focus-visible{outline:2px solid var(--accent2);outline-offset:3px;border-radius:999px}

  /* Screen header (eyebrow + título grande + chip de ícono) */
  .shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .shead-sub{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
  .shead-ic{width:40px;height:40px;border-radius:13px;background:var(--surf2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto}

  /* Meal cards */
  .section-h{font-size:11px;color:var(--terra-300);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin:18px 4px 10px}
  /* Secciones colapsables (REQ-04) */
  .csec{margin-top:14px}
  .csec-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:none;padding:8px 4px;margin:0;cursor:pointer;font-size:11px;color:var(--terra-300);text-transform:uppercase;letter-spacing:.12em;font-weight:700;text-align:left}
  .csec-h .csec-sub{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;margin-left:8px}
  .csec-h .chev{flex:0 0 auto;color:var(--muted);transition:transform .2s}
  .csec:not(.collapsed) .csec-h .chev{transform:rotate(90deg)}
  .csec.collapsed .csec-body{display:none}
  .meal{background:var(--surf1);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px;transition:.2s}
  .meal.done{border-color:var(--border-acc);background:var(--accent-dim)}
  /* REQ-235: cuenta atrás antes de empezar la sesión */
  .countdown{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px calc(24px + var(--safe-bottom,0px));background:rgba(5,5,9,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center}
  .countdown-label{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .countdown-n{font-family:var(--font-display);font-size:136px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
  .countdown-n.tick{animation:countdownTick .9s ease-out}
  @keyframes countdownTick{from{transform:scale(1.25);opacity:.4}to{transform:scale(1);opacity:1}}
  @media(prefers-reduced-motion:reduce){.countdown-n.tick{animation:none}}
  .countdown-next{font-size:15px;color:var(--txt);max-width:320px;overflow-wrap:anywhere}
  .countdown-actions{display:flex;gap:10px;margin-top:18px}
  .countdown-actions .btn{min-height:48px;min-width:132px}
  .meal-tap{cursor:pointer}
  .meal.skipped{opacity:.6;border-style:dashed}
  .meal .slot{font-family:var(--font-body);font-size:10px;color:var(--terra-300);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
  .meal .name{font-family:var(--font-body);font-weight:600;font-size:16px;margin:3px 0 5px;line-height:1.25}
  /* REQ-221: nombres largos (platos o ejercicios del coach) se cortan en vez de desbordar */
  #app{overflow-wrap:break-word}
  #app h1,#app h2,#app h3,#app h4,.meal .name,.agenda-name,.agenda-meta,.plan-main b,.cl-title,.shop-item .n,.chat-bubble{overflow-wrap:anywhere}
  .meal .nums{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
  .meal .nums b{color:var(--txt);font-weight:500}
  .meal-empty-hint{font-size:13px;color:var(--muted);line-height:1.4}
  .meal-actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .activity-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--surf2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:12px;margin-bottom:8px}
  .activity-main{min-width:0}
  .activity-notes{font-size:13px;color:var(--txt);margin-top:4px;overflow-wrap:anywhere}
  .activity-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .activity-estimate{background:var(--surf3);border:1px solid var(--border-2);border-radius:var(--r-md);padding:12px;margin:4px 0 8px;font-size:14px}
  .activity-estimate .n{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent)}
  .chk{width:32px;height:32px;border-radius:999px;border:2px solid var(--surf4);background:transparent;flex:0 0 auto;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s}
  .chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .meal-head{display:flex;gap:13px}
  .meal-head .chk{margin-top:2px}
  .meal-head > div{flex:1;min-width:0}
  .recipe{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--border)}
  .recipe.open{display:block}
  .recipe .r-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;color:var(--txt)}
  .recipe .r-row .g{font-family:var(--font-mono);color:var(--muted);white-space:nowrap}
  .recipe .r-foot{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:7px}

  .workout{background:linear-gradient(160deg,rgba(58,123,255,.16),var(--surf1));border:1px solid var(--terra-dim);border-radius:var(--r-lg);padding:16px}
  .workout .name{font-family:var(--font-body);font-size:17px}
  .workout .detail{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}
  .exercise-list{display:grid;gap:12px}
  .exercise-card{background:var(--surf1);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
  .exercise-card.inactive{opacity:.62}
  .exercise-demo{position:relative;background:linear-gradient(145deg,var(--surf3),var(--surf2));border-bottom:1px solid var(--border);min-height:164px;display:flex;align-items:center;justify-content:center}
  .exercise-demo svg{display:block;width:100%;height:164px;color:var(--purple-200)}
  .demo-media{display:block;width:100%;height:164px;object-fit:contain;background:var(--surf3)}
  .demo-frames{position:relative;width:100%;height:164px}
  .demo-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .demo-frame.demo-frame-1{opacity:0;animation:demoFrame 1.6s steps(1,end) infinite}
  @keyframes demoFrame{0%,49.9%{opacity:0}50%,100%{opacity:1}}
  .demo-expand{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:999px;border:1px solid var(--border-2);background:rgba(7,7,15,.55);color:var(--txt);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .demo-floor{stroke:var(--border-2);stroke-width:3}
  .demo-athlete{transform-box:fill-box;transform-origin:center}
  .demo-body{stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .demo-head{fill:var(--terra-300)}
  .demo-prop{stroke:var(--muted2);stroke-width:5;fill:none}
  .demo-squat .demo-athlete{animation:demoSquat 2.2s ease-in-out infinite}
  .demo-hinge .demo-athlete{animation:demoHinge 2.2s ease-in-out infinite}
  .demo-push .demo-athlete{animation:demoPush 1.8s ease-in-out infinite}
  .demo-pull .demo-athlete{animation:demoPull 2s ease-in-out infinite}
  .demo-lunge .demo-athlete{animation:demoLunge 2.4s ease-in-out infinite}
  .demo-bridge .demo-athlete{animation:demoBridge 2.2s ease-in-out infinite}
  .demo-core .demo-athlete{animation:demoCore 2.6s ease-in-out infinite}
  .demo-calf .demo-athlete{animation:demoCalf 1.8s ease-in-out infinite}
  .demo-isolation .demo-athlete{animation:demoIsolation 1.8s ease-in-out infinite}
  .demo-run .demo-athlete{animation:demoRun 1.2s ease-in-out infinite}
  .demo-cycle .demo-crank{transform-box:fill-box;transform-origin:center;animation:demoCycle .9s linear infinite}
  .demo-swim .demo-athlete{animation:demoSwim 2s ease-in-out infinite}
  .exercise-card.paused .demo-athlete,.exercise-card.paused .demo-crank,.exercise-card.paused .demo-frame-1{animation-play-state:paused}
  @keyframes demoSquat{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(22px) scaleY(.82)}}
  @keyframes demoHinge{0%,100%{transform:rotate(0)}50%{transform:rotate(28deg) translate(8px,10px)}}
  @keyframes demoPush{0%,100%{transform:translateY(-9px)}50%{transform:translateY(12px)}}
  @keyframes demoPull{0%,100%{transform:translateX(12px)}50%{transform:translateX(-12px)}}
  @keyframes demoLunge{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,18px) scaleY(.88)}}
  @keyframes demoBridge{0%,100%{transform:rotate(0) translateY(8px)}50%{transform:rotate(-10deg) translateY(-10px)}}

  .closebar{display:flex;justify-content:flex-end;margin-bottom:4px}
  .closebar button{background:var(--surf3);width:36px;height:36px;border-radius:999px;font-size:16px;color:var(--muted)}
  .ai-box{background:var(--accent-dim);border:1px solid var(--border-acc);border-radius:var(--r-md);padding:12px;font-size:14px;margin-top:10px;white-space:pre-wrap;line-height:1.5}
  .meal-photo-preview{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:var(--r-md);margin-top:10px}
  .meal-photo-preview[hidden]{display:none} /* REQ-238: sin foto no se ve una caja rota */
  .photo-questions{display:grid;gap:8px;margin-top:10px}
  .mic{background:var(--surf3);border:1px solid var(--border-2);width:48px;height:48px;border-radius:var(--r-sm);font-size:20px}
  .mic.live{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .pill{display:inline-block;background:var(--surf3);border:1px solid var(--border-2);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:500;margin:0 4px 4px 0}

  /* Weight */
  table.wt{width:100%;border-collapse:collapse;font-size:13px}
  table.wt th,table.wt td{padding:9px 6px;border-bottom:1px solid var(--border);text-align:center}
  table.wt th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  table.wt td{font-family:var(--font-mono)}
  table.wt input{width:72px;background:var(--surf3);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--txt);padding:7px;text-align:center;font-size:14px;font-family:var(--font-mono)}
  @media(max-width:480px){
    table.wt thead{display:none}
    table.wt,table.wt tbody{display:block;width:100%}
    table.wt tr{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-areas:"week range range" ". peso grasa";background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px;padding:10px 12px;gap:4px 8px}
    table.wt td{border-bottom:none;padding:0;text-align:left;font-family:var(--font-body)}
    table.wt td:nth-child(1){grid-area:week;font-family:var(--font-body);font-weight:700;font-size:14px;align-self:center}
    table.wt td:nth-child(2){grid-area:range;font-size:12px;color:var(--muted);align-self:center}
    table.wt td:nth-child(3){grid-area:peso}
    table.wt td:nth-child(4){grid-area:grasa}
    table.wt td:nth-child(3)::before,table.wt td:nth-child(4)::before{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    table.wt td:nth-child(3)::before{content:"Peso kg"}
    table.wt td:nth-child(4)::before{content:"% grasa"}
    table.wt input{width:100%;min-height:44px;font-size:16px;border-radius:var(--r-md);padding:0 8px;box-sizing:border-box}
  }
  .wt-later{margin-top:6px}
  .wt-later summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;min-height:44px;display:flex;align-items:center}
  .wt-later summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-4px 0 0 10px;transition:transform .15s}
  .wt-later[open] summary::after{transform:rotate(-135deg);margin-top:4px}
  table.wt tr.wt-current td:first-child{color:var(--accent)}
  .chart{background:var(--surf1);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin:14px 0}

  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .scard{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center}
  .scard .n{font-family:var(--font-body);font-size:24px;font-weight:800;letter-spacing:-.02em}
  .scard .l{font-size:11px;color:var(--muted);margin-top:3px}
  .toast{position:fixed;bottom:calc(82px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--surf3);border:1px solid var(--border-2);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{opacity:1}

  /* Sugerencia "agregar a pantalla de inicio" (solo móvil) */
  .a2hs{position:fixed;left:10px;right:10px;bottom:calc(82px + var(--safe-bottom,0px));max-width:540px;margin:0 auto;z-index:60;
    background:linear-gradient(160deg,var(--surf2),var(--surf1));border:1px solid var(--border-acc);border-radius:var(--r-lg);
    padding:14px 40px 14px 14px;box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;gap:12px;align-items:flex-start;animation:a2hsIn .25s ease}
  .a2hs .a2hs-ic{font-size:22px;flex:0 0 auto;line-height:1.1}
  .a2hs .a2hs-body{flex:1;min-width:0}
  .a2hs .a2hs-title{font-family:var(--font-body);font-weight:700;font-size:15px}
  .a2hs .a2hs-txt{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .a2hs .a2hs-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .a2hs .a2hs-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;background:var(--surf3);color:var(--muted);font-size:15px;border:none}
  @keyframes a2hsIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* Card-link: tarjeta que lleva a otra vista (Home → Nutrición/Entreno) */
  .card-link{display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
  .card-link:not(.workout){background:var(--surf1);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
  .card-link:active{transform:scale(.99)}
  .cl-title{font-family:var(--font-body);font-weight:700;font-size:16px}
  .chev{color:var(--muted2);flex:0 0 auto}
  .avatar{width:40px;height:40px;border-radius:999px;background:var(--surf3);border:1px solid var(--border-acc);display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-weight:800;color:var(--accent);font-size:15px;flex:0 0 auto}
  .shead-sub .badge{font-size:10px;padding:2px 8px}
  .splash{display:flex;align-items:center;justify-content:center;min-height:70vh}

  /* Auth / login */
  .auth{max-width:380px;margin:0 auto;padding-top:7vh}
  .auth-brand{font-family:var(--font-display);font-weight:800;font-size:32px;letter-spacing:-.03em;text-align:center;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:12px}
  .auth-invite{margin:0 0 16px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-dim);border:1px solid var(--accent-glow);font-size:14px;line-height:1.5;color:var(--txt)}

  /* Chips de preferencias (Perfil) */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip-check{display:inline-flex;align-items:center;gap:7px;background:var(--surf3);border:1px solid var(--border-2);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;user-select:none}
  .chip-check input{accent-color:var(--accent);width:15px;height:15px}
  .availability{display:grid;gap:8px;margin-top:9px}
  .availability-day{display:grid;grid-template-columns:minmax(108px,1fr) minmax(126px,1.2fr);gap:10px;align-items:center;background:var(--surf3);border:1px solid var(--border-2);border-radius:var(--r-md);padding:10px 11px}
  .availability-day label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
  .availability-day input[type="checkbox"]{accent-color:var(--accent);width:17px;height:17px}
  .availability-day select{width:100%;min-width:0;background:var(--surf2);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--txt);padding:9px;font-family:inherit}
  .availability-day select:disabled{opacity:.45}
  .field-note{color:var(--muted);font-size:11px;line-height:1.4;margin-top:5px}

  /* Onboarding y revisión periódica del perfil */
  .onboarding{max-width:560px;margin:0 auto;padding:24px 14px 50px}
  .onboarding-brand{font-family:var(--font-body);font-size:14px;font-weight:800;color:var(--purple-200);margin-bottom:22px}
  .onboarding h1{font-size:30px;line-height:1.08;margin-bottom:8px}
  .onboarding-copy{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:18px}
  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:24px}
  .step{height:5px;background:var(--surf3);border-radius:999px;overflow:hidden}
  .step.on{background:var(--accent)}
  .setup-steps{display:grid;gap:10px;margin-top:18px}
  .setup-step{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surf2);color:var(--muted)}
  .setup-step span{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--surf3);font-weight:800;color:var(--txt)}
  .setup-step.on{border-color:var(--accent);color:var(--txt)}
  .setup-step.done span{background:var(--good);color:#06130d}
  .setup-step.bad span{background:var(--bad);color:#fff}
  .onboarding-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  @media(max-width:430px){.training-choice-grid{grid-template-columns:1fr}}
  .onboarding-actions{display:flex;gap:10px;margin-top:18px}
  .onboarding-actions .btn{min-height:44px}
  .privacy-control{min-height:44px}
  .onboarding-actions .btn-accent{flex:1}
  .macro-preview{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}
  .macro-preview .scard{text-align:left}
  .macro-preview .scard .n{font-size:20px}
  .review-meta{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:7px}
  .adv-settings summary{cursor:pointer;color:var(--muted);font-size:13px;margin:8px 0;list-style:none}
  .adv-settings summary::-webkit-details-marker{display:none}
  .adv-settings[open] summary::before{content:"▾ "}.adv-settings:not([open]) summary::before{content:"▸ "}
  .recap{max-width:560px;margin:0 auto}
  .recap-hero{padding:10px 2px 8px}
  .recap-hero h1{font-size:34px;line-height:1.02}
  .recap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0}
  .recap-grid .scard{text-align:left}
  .recap-grid .scard .n{font-size:22px}
  .challenge-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .challenge{background:var(--surf2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:14px;text-align:left;min-height:116px}
  .challenge.selected{border-color:var(--accent);background:var(--accent-dim)}
  .challenge b{display:block;font-family:var(--font-body);font-size:15px;margin:7px 0 4px}
  .challenge span{display:block;color:var(--muted);font-size:12px;line-height:1.35}
  .photo-picker{border:1px dashed var(--border-2);border-radius:var(--r-md);padding:14px;text-align:center}
  .photo-preview{display:block;width:100%;max-height:360px;object-fit:contain;background:var(--black);border-radius:var(--r-md);margin-bottom:12px}
  .journey-photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r-md);background:var(--surf2)}
  @media(max-width:380px){
    .onboarding-grid{grid-template-columns:1fr}
    .availability-day{grid-template-columns:1fr}
    .onboarding h1{font-size:26px}
    .challenge-grid{grid-template-columns:1fr}
    .exercise-filters{grid-template-columns:1fr}
    .player-dose{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  /* Check-in semanal (REQ-20) */
  .ci-banner{background:linear-gradient(135deg,var(--accent-dim),rgba(58,123,255,.10));border:1px solid var(--border-acc);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
  .ci-scale{display:flex;gap:6px;margin-top:7px}
  .ci-scale button{flex:1;height:38px;border-radius:var(--r-sm);background:var(--surf3);border:1px solid var(--border-2);color:var(--muted);font-size:13px;font-weight:600;transition:.15s;line-height:1}
  .ci-scale button.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .ci-scale-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-top:3px}
  .ci-delta{background:var(--surf3);border-radius:var(--r-md);padding:12px 14px;margin:10px 0}
  .ci-delta .ci-dlab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  .ci-delta .ci-drow{display:flex;justify-content:space-between;font-size:14px;margin:3px 0}
  .ci-dpos{color:var(--good);font-family:var(--font-mono);font-size:12px}
  .ci-dneg{color:var(--warn);font-family:var(--font-mono);font-size:12px}

  /* Home agenda diaria (REQ-22) */
  .prio-card{border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
  .prio-eyebrow{font-size:10px;color:var(--terra-300);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:6px}
  .prio-name{font-family:var(--font-body);font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0 0 5px;line-height:1.2}
  .prio-detail{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.4}
  .prio-reason{font-size:11px;color:var(--muted);margin-top:10px}
  .agenda-card{background:var(--surf1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin:14px 0}
  .agenda-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  .agenda-kicker{font-size:11px;color:var(--terra-300);text-transform:uppercase;font-weight:800;margin-bottom:4px}
  .agenda-title{font-family:var(--font-body);font-size:21px;font-weight:800;margin:0;line-height:1.18;letter-spacing:0}
  .agenda-sub{font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}
  .agenda-count{background:var(--surf2);border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px;font-weight:700;padding:5px 8px;white-space:nowrap}
  .agenda-note{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-md);color:var(--muted);font-size:12px;line-height:1.35;padding:10px 12px;margin:8px 0 10px}
  .agenda-list{display:flex;flex-direction:column}
  .agenda-item{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
  .agenda-item:first-child{border-top:0;padding-top:4px}
  .agenda-icon{width:38px;height:38px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--surf2);border:1px solid var(--border);font-size:18px;line-height:1}
  .agenda-item.kind-meal .agenda-icon{background:rgba(58,123,255,.12);border-color:var(--terra-dim)}
  .agenda-item.kind-workout .agenda-icon,.agenda-item.kind-resume .agenda-icon{background:var(--accent-dim);border-color:var(--border-acc)}
  .agenda-item.kind-done .agenda-icon{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.28)}
  .agenda-label{font-size:11px;color:var(--muted2);font-weight:700;text-transform:uppercase;margin-bottom:2px}
  .agenda-name{font-size:15px;font-weight:800;color:var(--txt);line-height:1.25}
  .agenda-meta{font-size:12px;color:var(--muted);line-height:1.38;margin-top:3px}
  .agenda-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .agenda-actions .btn{min-height:44px;flex:1 1 128px}
  .agenda-state{background:linear-gradient(160deg,var(--accent-dim),var(--surf1));border-color:var(--border-acc)}
  .agenda-state.done{background:linear-gradient(160deg,rgba(16,185,129,.09),var(--surf1));border-color:rgba(16,185,129,.28)}
  .agenda-state.setup{background:linear-gradient(160deg,rgba(58,123,255,.13),var(--surf1));border-color:var(--terra-dim)}
  .agenda-next{margin-top:12px}
  .agenda-next-head{font-size:11px;color:var(--muted2);font-weight:700;text-transform:uppercase}
  @media(max-width:380px){
    .agenda-head{flex-direction:column}
    .agenda-count{align-self:flex-start}
    .agenda-actions .btn{flex-basis:100%}
  }
  .home-quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .hq-btn{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 8px;text-align:center;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:5px}
  .hq-btn:active{transform:scale(.96)}
  .hq-icon{font-size:20px;line-height:1}
  .hq-label{font-size:11px;font-weight:600;color:var(--txt)}
  .hq-sub{font-size:10px;color:var(--muted)}

  /* Rachas e hitos (REQ-23) */
  .streak-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .streak-card{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;text-align:center}
  .streak-card.main{grid-column:1 / -1;background:linear-gradient(160deg,var(--accent-dim),var(--surf1));border-color:var(--border-acc)}
  .streak-n{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .streak-card.main .streak-n{font-size:38px}
  .streak-lbl{font-size:11px;color:var(--muted);margin-top:4px}
  .streak-best{font-size:10px;color:var(--muted2);margin-top:2px;font-family:var(--font-mono)}
  .week-consist{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
  .week-consist-bar{height:6px;background:var(--surf3);border-radius:999px;overflow:hidden;margin:7px 0 4px}
  .week-consist-bar > i{display:block;height:100%;border-radius:999px;background:var(--terra-400);transition:width .5s}
  .milestones{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .milestone{display:flex;align-items:center;gap:10px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;font-size:13px}
  .milestone .ms-ic{font-size:18px;flex:0 0 auto}
  .milestone .ms-lbl{font-weight:600}
  .milestone .ms-date{font-size:11px;color:var(--muted);margin-top:2px}
  .streak-recovery{background:var(--warn-dim);border:1px solid rgba(245,158,11,.32);border-radius:var(--r-md);padding:10px 12px;font-size:13px;color:#fcd34d;margin-bottom:10px}

  /* Coach conversacional (REQ-21) */
  .coach-wrap{display:flex;flex-direction:column;height:calc(100dvh - 102px - var(--safe-top) - var(--safe-bottom));padding-bottom:0}
  .coach-wrap>.shead,.coach-wrap>.ai-box{flex:0 0 auto}
  .coach-msgs{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:10px}
  .coach-msg{display:flex;flex-direction:column;max-width:88%}
  .coach-msg.user{align-self:flex-end;align-items:flex-end}
  .coach-msg.coach{align-self:flex-start;align-items:flex-start}
  .coach-msg.summary{align-self:center;max-width:100%}
  .chat-bubble{padding:11px 14px;border-radius:var(--r-lg);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .coach-msg.user .chat-bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
  .coach-msg.coach .chat-bubble{background:var(--surf1);border:1px solid var(--border);border-bottom-left-radius:4px}
  .coach-msg.summary .chat-bubble{background:var(--surf3);border:1px dashed var(--border-2);font-size:12px;color:var(--muted);text-align:center;border-radius:var(--r-md)}
  .coach-msg .chat-meta{font-size:11px;color:var(--muted2);margin-top:3px;display:flex;gap:6px;align-items:center}
  .chat-type{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .chat-type.educativo{background:var(--accent-dim);color:var(--accent)}
  .chat-type.propuesta{background:rgba(200,100,50,.15);color:var(--terra-300,#c87855)}
  .chat-type.aplicado{background:rgba(34,197,94,.15);color:#4ade80}
  .chat-type.fallback{background:var(--surf3);color:var(--muted)}
  .coach-action-bar{margin-top:8px;display:flex;gap:8px}
  .coach-action-note{margin-top:8px;padding:9px 10px;border-radius:var(--r-sm);background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.24);color:#fcd34d;font-size:12px;line-height:1.4}
  .coach-chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 0 10px}
  .coach-chip{background:var(--surf1);border:1px solid var(--border-acc);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--purple-200);cursor:pointer;transition:.15s;text-align:left}
  .coach-chip:active{transform:scale(.97)}
  .coach-home-sep{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--muted2);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .coach-home-sep::before,.coach-home-sep::after{content:"";flex:1;height:1px;background:var(--border)}
  .coach-msgs-home{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  /* REQ-216: modo conversacional (beta oculta) */
  .chat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .chat-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .chat-card{align-self:stretch;max-width:none;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surf1);padding:12px}
  .chat-card .chat-card-h{font-size:12px;color:var(--muted);margin-bottom:6px}
  .chat-chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
  .coach-input-row{display:flex;gap:8px;padding:10px 14px 12px;background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}
  .coach-input-row textarea{flex:1;resize:none;background:var(--surf1);border:1px solid var(--border-2);border-radius:var(--r-md);color:var(--txt);padding:10px 12px;font-size:14px;font-family:inherit;min-height:44px;max-height:120px;line-height:1.4}
  .coach-input-row textarea:focus{outline:none;border-color:var(--accent)}
  .coach-input-row button{height:44px;width:44px;flex-shrink:0;border-radius:var(--r-sm);background:var(--accent);color:var(--on-accent);font-size:18px;align-self:flex-end;display:flex;align-items:center;justify-content:center}
  .coach-input-row button:disabled{opacity:.4}
  .coach-typing{display:flex;gap:4px;padding:4px 2px;align-items:center}
  .coach-typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1.1s infinite}
  .coach-typing span:nth-child(2){animation-delay:.18s}
  .coach-typing span:nth-child(3){animation-delay:.36s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
  .coach-empty{text-align:center;padding:24px 16px 10px;color:var(--muted)}
  .coach-empty .ce-icon{font-size:36px;margin-bottom:8px}

  /* Spinner / loading-row (REQ-47) */
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:18px;height:18px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
  .loading-row{display:flex;align-items:center;gap:10px;padding:14px 0;color:var(--muted);font-size:14px}
  @media(prefers-reduced-motion:reduce){
    .spinner{animation:none;opacity:.6}
    /* REQ-192: sin movimiento, el estado se sigue leyendo por color/opacidad */
    .mic.live{animation:none}
    .coach-typing span{animation:none;opacity:.55}
    .coach-typing span:nth-child(2){opacity:.75}
    .coach-typing span:nth-child(3){opacity:.95}
    .a2hs{animation:none}
  }

  /* ── Portada pública: "Escalera de días" (REQ-198) ──────────────────────
     Marca Escala (REQ-180): carbón + lima sólida, Unbounded + Manrope. La
     firma es una escalera de 5 peldaños que sube a medida que se baja por la
     página; sin brillos, sin degradados de acento y sin emoji. */
  body:has(#app.landing-host){background-image:none}
  .landing{--l-max:1180px;--l-pad:max(16px,var(--safe-left));width:100%;margin:0;padding:0 0 var(--safe-bottom);overflow-x:clip;background:var(--black);font-variant-numeric:tabular-nums}
  .landing ::selection{background:var(--accent);color:var(--on-accent)}
  .landing :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  .landing .btn-accent{box-shadow:none}
  .l-wrap{width:100%;max-width:var(--l-max);margin:0 auto;padding:0 var(--l-pad)}
  .brand-v{color:var(--accent)}

  /* Barra superior */
  .landing-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:max(16px,calc(10px + var(--safe-top)));padding-bottom:12px}
  .landing-brand{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--txt);display:inline-flex;align-items:center;gap:10px}
  .landing-nav-actions{display:flex;gap:6px;align-items:center}
  .l-btn{min-height:44px;padding:0 18px;border-radius:999px;font-family:var(--font-body);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;transition:background .15s,color .15s,transform .1s}
  .l-btn:active{transform:scale(.98)}
  .l-btn-lime{background:var(--accent);color:var(--on-accent);border:none}
  .l-btn-lime:hover{background:var(--purple-300)}
  .l-btn-ghost{background:transparent;color:var(--txt);border:1px solid var(--border-2)}
  .l-btn-ghost:hover{border-color:var(--txt)}
  .l-btn-text{background:none;border:none;color:var(--txt);padding:0 12px}
  .l-btn-text:hover{color:var(--accent)}
  .l-btn-ink{background:var(--black);color:var(--accent);border:none}
  .l-btn-ink:hover{background:#262626}
  .l-btn-lg{min-height:56px;padding:0 26px;font-size:16px}

  /* Hero */
  .l-hero{padding-top:28px;padding-bottom:56px;display:grid;gap:32px}
  .l-hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(44px,12.4vw,96px);line-height:.94;letter-spacing:-.035em;margin:0;text-wrap:balance}
  .l-hero h1 .l-lime{color:var(--accent);display:block}
  .l-hero-body{display:grid;gap:32px;align-items:start}
  .l-hero-sub{font-size:17px;line-height:1.55;color:var(--muted);margin:0 0 24px;max-width:46ch}
  .l-hero-sub b{color:var(--txt);font-weight:700}
  .l-hero-ctas{display:flex;flex-wrap:wrap;gap:10px}
  .l-hero-note{font-size:13px;color:var(--muted);margin-top:14px}

  /* Demo del día (contenido de ejemplo, marcado como tal) */
  .l-demo{background:var(--surf1);border:1px solid var(--surf3);border-radius:var(--r-lg);padding:18px;max-width:460px;width:100%}
  .l-demo-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .l-demo-day{font-weight:700;font-size:14px}
  .l-tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border-2);border-radius:999px;padding:3px 10px}
  .l-demo-kcal{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .l-demo-kcal b{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.03em}
  .l-demo-kcal span{color:var(--muted);font-size:14px}
  .l-demo-bar{height:6px;background:var(--surf3);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .l-demo-bar i{display:block;height:100%;width:86%;background:var(--accent);border-radius:99px}
  .l-demo-list{display:grid;gap:8px}
  .l-demo-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surf2);border-radius:var(--r-sm);padding:12px 14px;transition:opacity .25s cubic-bezier(.16,1,.3,1),transform .25s cubic-bezier(.16,1,.3,1)}
  .l-demo-row.swap{opacity:0;transform:translateY(6px)}
  .l-demo-slot{font-size:12px;font-weight:700;color:var(--terra-300);width:64px}
  .l-demo-name{font-size:14px;font-weight:600;line-height:1.3}
  .l-demo-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .l-demo-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--surf4);display:flex;align-items:center;justify-content:center}
  .l-demo-chk.on{background:var(--accent);border-color:var(--accent)}
  .l-demo-row.train{background:var(--terra-dim)}
  .l-demo-row.train .l-demo-slot{color:var(--terra-200)}
  .l-demo-ask{font-size:13px;font-weight:700;margin:18px 0 8px}
  .l-demo-chips{display:flex;flex-wrap:wrap;gap:8px}
  .l-chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border-2);background:transparent;color:var(--txt);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  .l-chip:hover{border-color:var(--accent)}
  .l-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .l-demo-note{font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}
  .l-demo-note b{color:var(--accent);font-weight:700}

  /* La escalera */
  .l-climb{padding-top:72px;padding-bottom:40px;border-top:1px solid var(--border)}
  .l-climb-head h2,.l-sec-h{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,7.6vw,56px);line-height:1;letter-spacing:-.03em;margin:0 0 14px;text-wrap:balance}
  .l-climb-head p,.l-sec-sub{font-size:17px;color:var(--muted);line-height:1.55;margin:0;max-width:52ch}
  .l-climb-grid{display:grid;gap:0;margin-top:40px}
  .l-stair-rail{display:none}
  .l-step{display:grid;gap:16px;padding:36px 0;border-top:1px solid var(--border);scroll-margin-top:24px}
  .l-step:first-child{border-top:none}
  .l-step-when{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,7vw,44px);letter-spacing:-.03em;line-height:1;color:var(--accent);margin:0}
  .l-step-when .l-mini-stair{flex:0 0 auto}
  .l-step-lead{font-family:var(--font-body);font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:0}
  .l-step-body{font-size:16px;color:var(--muted);line-height:1.6;margin:0;max-width:56ch}
  .l-step-demo{background:var(--surf1);border:1px solid var(--surf3);border-radius:var(--r-md);padding:16px;max-width:460px}
  .l-step-demo .l-tag{float:right;margin:-2px 0 6px 10px}
  .l-ing{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .l-ing:last-of-type{border-bottom:none}
  .l-ing span:last-child{color:var(--muted)}
  .l-ex-name{font-weight:700;font-size:15px;margin-bottom:2px}
  .l-ex-meta{font-size:13px;color:var(--muted);margin-bottom:12px}
  .l-sets{display:flex;gap:8px;flex-wrap:wrap}
  .l-set{min-width:56px;height:40px;border-radius:12px;border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
  .l-set.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .l-rest{display:flex;align-items:baseline;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
  .l-rest b{font-family:var(--font-display);font-size:24px;color:var(--txt);letter-spacing:-.02em}
  .l-outs{display:flex;flex-wrap:wrap;gap:8px}
  .l-out{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border-2);display:inline-flex;align-items:center;font-size:13px;font-weight:600}
  .l-out.pick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .l-prop{font-size:14px;line-height:1.5}
  .l-prop b{color:var(--txt)}
  .l-prop-change{display:block;font-family:var(--font-display);font-size:20px;letter-spacing:-.02em;color:var(--accent);margin:10px 0 12px}
  .l-prop-actions{display:flex;gap:8px}
  .l-prop-actions span{min-height:40px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;font-size:13px;font-weight:700;border:1px solid var(--border-2)}
  .l-prop-actions span:first-child{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .l-recap{width:100%;border-collapse:collapse;font-size:14px}
  .l-recap th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:0 0 8px}
  .l-recap td{padding:9px 0;border-top:1px solid var(--border)}
  .l-recap td:not(:first-child),.l-recap th:not(:first-child){text-align:right}
  .l-recap tr:last-child td{color:var(--accent);font-weight:700}
  .l-mini-stair .tr{stroke:var(--surf4)}
  .l-mini-stair .tr.lit{stroke:var(--accent)}

  /* Planes */
  .l-pricing{padding-top:72px;padding-bottom:24px;border-top:1px solid var(--border)}
  .l-plans{display:grid;gap:14px;margin-top:32px}
  .l-plan{background:var(--surf1);border:1px solid var(--surf3);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column}
  .l-plan.highlight{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .l-plan-badge{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;margin-bottom:12px;background:var(--on-accent);color:var(--accent)}
  .l-plan-name{font-size:18px;font-weight:800;margin-bottom:10px}
  .l-plan-price{font-family:var(--font-display);font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-bottom:6px}
  .l-plan-cur{font-size:18px;letter-spacing:0;margin-right:4px;vertical-align:.9em}
  .l-plan-period{font-family:var(--font-body);font-size:15px;font-weight:600;letter-spacing:0;opacity:.7}
  .l-plan-desc{font-size:14px;line-height:1.5;margin:10px 0 18px;opacity:.8}
  .l-plan-items{display:grid;gap:9px;margin-bottom:22px}
  .l-plan-item{display:flex;gap:10px;font-size:14px;line-height:1.4}
  .l-plan-item svg{flex:0 0 auto;margin-top:2px}
  .l-plan .l-btn{margin-top:auto;width:100%}
  .l-plan:not(.highlight) .l-plan-item svg{color:var(--accent)}

  /* FAQ */
  .l-faq-sec{padding-top:72px;padding-bottom:24px;border-top:1px solid var(--border)}
  .l-faq{margin-top:24px;max-width:780px}
  .l-faq-item{border-top:1px solid var(--border)}
  .l-faq-item:last-child{border-bottom:1px solid var(--border)}
  .l-faq-q{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:60px;padding:14px 0;font-size:16px;font-weight:700}
  .l-faq-q::-webkit-details-marker{display:none}
  .l-faq-q::after{content:"";flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);margin:-6px 4px 0 0;transition:transform .2s cubic-bezier(.16,1,.3,1)}
  .l-faq-item[open] .l-faq-q::after{transform:rotate(-135deg);margin-top:4px}
  .l-faq-a{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 18px;max-width:64ch}

  /* Cierre: campo lima a sangre completa */
  .l-cta-final{margin-top:72px;background:var(--accent);color:var(--on-accent)}
  .l-cta-final .l-wrap{padding-top:64px;padding-bottom:64px;display:grid;gap:20px;justify-items:start}
  .l-cta-final h2{font-family:var(--font-display);font-weight:800;font-size:clamp(44px,12vw,104px);line-height:.92;letter-spacing:-.04em;margin:0}
  .l-cta-final p{font-size:17px;line-height:1.5;margin:0;max-width:46ch;font-weight:600}
  .l-cta-note{font-size:13px;font-weight:600;opacity:.75}
  .l-cta-final :focus-visible{outline-color:var(--on-accent)}

  .l-footer{padding-top:24px;padding-bottom:calc(28px + var(--safe-bottom));display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
  .l-footer nav{display:flex;flex-wrap:wrap;gap:4px}
  .l-footer a{color:var(--muted);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 8px}
  .l-footer a:hover{color:var(--txt)}

  @media(min-width:760px){
    .landing{--l-pad:40px}
    .l-hero{padding-top:56px;padding-bottom:88px;gap:48px}
    .l-hero-body{grid-template-columns:minmax(0,1fr) minmax(380px,460px);gap:56px}
    .l-hero-sub{font-size:19px}
    .l-step{grid-template-columns:minmax(0,1fr) minmax(300px,440px);gap:24px 48px;align-items:start;padding:56px 0}
    .l-step-text{display:grid;gap:14px;align-content:start}
    .l-plans{grid-template-columns:repeat(2,minmax(0,1fr));max-width:860px}
  }
  /* Escritorio: la escalera grande queda fija y se enciende peldaño a peldaño */
  @media(min-width:1080px){
    .l-climb-grid{grid-template-columns:260px minmax(0,1fr);gap:48px}
    .l-step{grid-template-columns:minmax(0,1fr) 360px;gap:20px 40px}
    .l-step-when{font-size:40px}
    .l-stair-rail{display:block;position:sticky;top:48px;align-self:start;width:260px;height:260px;margin-top:64px}
    .l-stair-rail svg{position:absolute;inset:0;overflow:visible}
    .l-stair-rail .tr{stroke:var(--surf4);transition:stroke .35s cubic-bezier(.16,1,.3,1)}
    .l-stair-rail .tr.lit{stroke:var(--accent)}
    .l-stair-label{position:absolute;min-height:44px;min-width:44px;display:flex;align-items:center;padding:0 6px;background:none;border:none;font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .35s}
    .l-stair-label[aria-current="step"]{color:var(--txt)}
    .l-stair-label:hover{color:var(--accent)}
    .l-step .l-mini-stair{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    .l-demo-row,.l-demo-row.swap{transition:none;transform:none;opacity:1}
    .l-stair-rail .tr,.l-stair-label,.l-faq-q::after{transition:none}
  }
  /* ---- Paywall (REQ-25) ---- */
  .paywall-expired{background:var(--surf3);border:1px solid var(--bad);color:var(--bad);padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:14px;line-height:1.4}
  .paywall-msg{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:16px}
  .paywall-plans{display:flex;flex-direction:column;gap:12px}
  .paywall-plan{background:var(--surf1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
  .paywall-plan-hi{border-color:var(--accent);background:linear-gradient(160deg,var(--accent-dim),var(--surf1))}
  .paywall-badge{font-size:10px;color:var(--purple-200);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:4px}
  .paywall-plan-name{font-family:var(--font-body);font-size:16px;font-weight:800;margin-bottom:4px}
  .paywall-plan-price{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
  .paywall-cur{font-size:13px;vertical-align:top;margin-top:3px;display:inline-block}
  .paywall-period{font-size:12px;color:var(--muted);font-family:var(--font-body);font-weight:400}
  .paywall-plan-desc{font-size:12px;color:var(--muted);margin:6px 0 10px;line-height:1.4}
  .paywall-features{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:4px}
  .paywall-features li{font-size:12px;color:var(--txt);display:flex;gap:6px;align-items:flex-start}
  .paywall-features li:before{content:'✓';color:var(--good);font-weight:700;flex:0 0 auto}
  .l-footer-legal{font-size:11px;color:var(--muted);line-height:1.7}
  .l-footer-legal a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border)}
  /* Cola offline y badge de sincronización (REQ-28) */
  .sync-badge{position:fixed;bottom:calc(70px + var(--safe-bottom));right:max(12px,calc((100vw - 560px) / 2 + 12px));z-index:150;font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid transparent;transition:opacity .2s;cursor:default;pointer-events:none}
  .sync-badge.offline{background:rgba(220,60,60,.14);border-color:rgba(220,60,60,.35);color:#f87171}
  .sync-badge.pending{background:rgba(180,140,30,.14);border-color:rgba(180,140,30,.35);color:#e8c95a}

function buildWeightRanges(prefs){
  const p=prefs||{};

  if(!Number.isFinite(startWeight)||startWeight<=0)return Object.fromEntries(Array.from({length:PLAN_DURATION_WEEKS},(_,i)=>[i+1,"—"]));
  const rate=p.goal==="deficit"?-.004:p.goal==="volumen"?.002:0;
  const ranges={};
  for(let week=1;week<=PLAN_DURATION_WEEKS;week++){
    const center=startWeight*Math.pow(1+rate,week-1);
    ranges[week]=`${(center-.3).toFixed(1)}–${(center+.3).toFixed(1)}`;
  }
  return ranges;
}

function planVersionForDate(ds){
  if(!validYmd(ds)||!Array.isArray(PLAN_VERSIONS)||!PLAN_VERSIONS.length)return null;
  const storedId=S&&S.days&&S.days[ds]&&S.days[ds].planVersionId;
  const stored=storedId&&PLAN_VERSIONS.find(version=>String(version.id)===String(storedId));
  if(stored)return stored;
  const matches=PLAN_VERSIONS.filter(v=>validYmd(v.valid_from)&&ds>=v.valid_from&&(!validYmd(v.valid_to)||ds<=v.valid_to));
  // REQ-224: una versión reemplazada nunca le gana a una vigente para el mismo
  // día. Antes el orden por valid_from dejaba que un borrador archivado (que
  // empezaba un día después) tomara los días nuevos en lugar del plan activo.
  const live=matches.filter(v=>v.status!=="superseded");
  const pool=live.length?live:matches;
  if(!pool.length)return null;
  const rank=status=>status==="active"?3:status==="draft"?2:status==="completed"?1:0;
  return pool.slice().sort((a,b)=>
    (b.valid_from||"").localeCompare(a.valid_from||"")||
    rank(b.status)-rank(a.status)||
    (Number(b.version_number)||0)-(Number(a.version_number)||0)||
    (b.updated_at||b.created_at||"").localeCompare(a.updated_at||a.created_at||"")
  )[0]||null;
}
function planPrefsForDate(ds){
  const version=planVersionForDate(ds);
  const source=version&&version.snapshot&&version.snapshot.prefs?version.snapshot.prefs:((profile&&profile.prefs)||{});
  return migrateProfilePrefs(source);
}
// Devuelve el día prescrito del nutritionPlan activo para una fecha, o null.
function activeNutritionPlanDay(ds){
  if(!validYmd(ds)||!Array.isArray(PLAN_VERSIONS)||!PLAN_VERSIONS.length)return null;
  const rank=s=>s==="active"?2:s==="draft"?1:0;
  const matches=PLAN_VERSIONS.filter(v=>
    v.snapshot&&v.snapshot.nutritionPlan&&
    (v.status==="active"||v.status==="draft")&&
    validYmd(v.valid_from)&&ds>=v.valid_from&&(!validYmd(v.valid_to)||ds<=v.valid_to)
  );
  if(!matches.length)return null;
  const version=matches.sort((a,b)=>
    rank(b.status)-rank(a.status)||
    (b.valid_from||"").localeCompare(a.valid_from||"")||
    (Number(b.version_number)||0)-(Number(a.version_number)||0)
  )[0];
  const np=version.snapshot.nutritionPlan;
  return(np.days||[]).find(d=>d.date===ds)||null;
}

// Guarda un nutritionPlan como plan_versions activo. No-op silencioso si Supabase no está disponible.
async function saveNutritionPlanVersion(draft){
  if(!supa||!uid())return null;
  if(!PLAN_VERSIONS_LOADED)await pullPlanVersions();
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const cycleNo=cycleNumber();
  const dates=(draft.daysData||[]).map(d=>d.ds).filter(Boolean).sort();
  if(!dates.length)return null;
  const validFrom=dates[0],validTo=dates[dates.length-1];
  const shopping=draft.shoppingList&&draft.shoppingList.length?draft.shoppingList:buildShoppingList(draft.daysData);
  const nutritionPlan=buildNutritionPlanSnapshot(draft.daysData,shopping);
  const digest=hashText(stableJson(nutritionPlan));
  const versionKey=`${cycleNo}:${validFrom}:nutrition:${digest.slice(0,12)}`;
  const existing=PLAN_VERSIONS.find(row=>row.version_key===versionKey&&row.status==="active");
  if(existing)return existing;
  const now=new Date().toISOString();
  const row={
    user_id:uid(),cycle_number:cycleNo,version_number:planVersionVersionNumber(cycleNo),
    version_key:versionKey,source:"nutrition",status:"active",
    valid_from:validFrom,valid_to:validTo,reason:"Plan nutricional preparado",
    prompt:null,model:null,snapshot_hash:digest,
    snapshot:{prefs:planSnapshotFields(prefs),nutritionPlan},
    activated_at:now,superseded_at:null,updated_at:now,
  };
  try{
    const result=await supa.from("plan_versions").upsert(row,{onConflict:"user_id,version_key"})
      .select("id,user_id,cycle_number,version_number,version_key,source,status,valid_from,valid_to,reason,prompt,model,snapshot_hash,snapshot,activated_at,superseded_at,created_at,updated_at")
      .maybeSingle();
    if(result.error)throw result.error;
    await pullPlanVersions();
    return result.data;
  }catch(e){
    if(String((e&&e.message)||e).match(/plan_versions|relation|column|constraint/i)){
      console.warn("No se pudo versionar el plan nutricional; compatibilidad local activa.",e);
      return null;
    }
    throw e;
  }
}
function planContextForDate(ds,prefsOverride){

  const p=(profile&&profile.prefs)||{};

    PLAN_DURATION_WEEKS=resolvedPlanDuration(p);
    START=p.planStartDate;
    END=planEndFor(START,PLAN_DURATION_WEEKS);
    WEEKS=buildCycleWeeks(START,PLAN_DURATION_WEEKS);
    REFEED_DATES=new Set([2,4,8,10].filter(n=>n<=PLAN_DURATION_WEEKS).map(n=>weekdayInWeek(WEEKS[n-1],6)));
    WEIGHT_RANGES=buildWeightRanges(p);
  }else{
    PLAN_DURATION_WEEKS=10;
    START=DEFAULT_START;END=DEFAULT_END;
    WEEKS=DEFAULT_WEEKS.map(w=>({...w}));
    REFEED_DATES=new Set(DEFAULT_REFEED_DATES);
    WEIGHT_RANGES={...DEFAULT_WEIGHT_RANGES};
  }

function buildDay(ds,prefsOverride){

      return{
        id:m.slot||m.id,slot:m.slot||m.id,time:meta.time||null,
        kcal:(m.macros&&m.macros.kcal)||0,
        p:(m.macros&&m.macros.p)||0,

function _syncBaseFor(entity,entityKey){
  const meta=_getSyncMeta()[_syncMetaKey(entity,entityKey)];
  return meta&&typeof meta==="object"?meta:{updatedAt:null,payload:null};
}
function _rememberRemoteVersion(entity,entityKey,updatedAt,payload){
  if(!uid())return;
  const meta=_getSyncMeta();
  meta[_syncMetaKey(entity,entityKey)]={updatedAt:updatedAt||null,payload:payload||null,seenAt:new Date().toISOString()};
  _setSyncMeta(meta);
}
function _syncExtraId(index,item){
  const raw=JSON.stringify({i:index,name:item&&item.name,kcal:item&&item.kcal,p:item&&item.p,c:item&&item.c,f:item&&item.f,done:item&&item.done});
  let h=0;for(let i=0;i<raw.length;i++)h=((h<<5)-h+raw.charCodeAt(i))|0;
  return "x_"+index+"_"+Math.abs(h).toString(36);
}
function prepareDayStateForSync(state){
  if(!SYNC_ENGINE.normalizeDayStateForSync)return state;
  const normalized=SYNC_ENGINE.normalizeDayStateForSync(state||{},(index,item)=>_syncExtraId(index,item));
  Object.keys(state||{}).forEach(k=>delete state[k]);
  Object.assign(state,normalized);
  return state;
}
function appendSyncResolutionLogToPayload(payload,kind,details){
  if(!payload||payload.entity==="weight_log")return payload;
  const p={...payload,state:{...((payload&&payload.state)||{})}};
  const log=Array.isArray(p.state.syncResolutionLog)?p.state.syncResolutionLog.slice(-20):[];
  log.push(Object.assign({type:kind,at:new Date().toISOString(),clientId:syncClientId()},details||{}));
  p.state.syncResolutionLog=log;
  return p;
}
// Agrega o actualiza una mutación pendiente en la cola (deduplica por entidad+clave).
function enqueueMutation(entity,entityKey,payload){
  if(!uid())return;
  const q=_getSyncQ();
  const i=q.findIndex(x=>x.uid===uid()&&x.entity===entity&&x.entityKey===entityKey&&x.status==="pending");
  const base=_syncBaseFor(entity,entityKey);
  const newEntry={
    id:Math.random().toString(36).slice(2),
    uid:uid(),
    entity,
    entityKey,
    payload,
    ts:new Date().toISOString(),
    retries:0,
    status:"pending",
    clientId:syncClientId(),
    baseRemoteUpdatedAt:base.updatedAt||null,
    basePayload:base.payload||null,
  };
  if(DOMAIN_CONTRACTS.validateSyncEntry){
    const v=DOMAIN_CONTRACTS.validateSyncEntry(newEntry);
    if(!v.ok)console.warn("[domain] syncEntry inválido:",v.errors);
  }
  if(i!==-1){q[i].payload=payload;q[i].ts=newEntry.ts;q[i].clientId=q[i].clientId||newEntry.clientId;}
  else q.push(newEntry);
  _setSyncQ(q);_updateSyncBadge();
}
// Elimina una mutación de la cola al confirmar que el servidor la recibió.
function _dequeueMutation(entity,entityKey){
  _setSyncQ(_getSyncQ().filter(x=>!(x.uid===uid()&&x.entity===entity&&x.entityKey===entityKey)));
  _updateSyncBadge();
}
// Descarta toda la cola del usuario al cerrar sesión (aislamiento entre usuarios en el dispositivo).
function clearSyncQueueForUser(userId){
  _setSyncQ(_getSyncQ().filter(x=>x.uid!==userId));
  _updateSyncBadge();
}
// True si el día tiene mutaciones de day_log pendientes, fallidas o en conflicto.
function _hasPendingDay(ds){
  return _getSyncQ().some(x=>x.uid===uid()&&x.entity==="day_log"&&x.entityKey===ds&&["pending","failed","conflict"].includes(x.status));
}
function _hasPendingWeight(week){
  return _getSyncQ().some(x=>x.uid===uid()&&x.entity==="weight_log"&&x.entityKey==="w"+week&&["pending","failed","conflict"].includes(x.status));
}
// REQ-242: lo que todavía no subió solo vive en la cola. Al vaciar la caché
// local (inicio de sesión) se repone desde ahí: si no, el día queda vacío
// hasta que la subida funcione y, si el usuario lo vuelve a editar, esa copia
// vacía pisa en la cola y en el servidor lo que había registrado.
function restorePendingFromQueue(){
  _getSyncQ().filter(x=>x.uid===uid()&&x.payload&&["pending","failed","conflict"].includes(x.status)).forEach(x=>{
    if(x.entity==="day_log"&&x.payload.state)S.days[x.entityKey]=JSON.parse(JSON.stringify(x.payload.state));
    else if(x.entity==="weight_log"&&x.payload.kg!=null)S.weights[x.payload.week]={kg:Number(x.payload.kg),bf:(x.payload.bf_pct==null?null:Number(x.payload.bf_pct))};
  });
}
function _markSyncConflict(item,remotePayload,conflicts){
  const q=_getSyncQ();const i=q.findIndex(x=>x.id===item.id);
  if(i===-1)return;
  q[i].status="conflict";
  q[i].retries=0;
  q[i].conflict={
    detectedAt:new Date().toISOString(),
    remoteUpdatedAt:remotePayload&&remotePayload.updated_at||null,
    remotePayload,
    conflicts:Array.isArray(conflicts)?conflicts.map(String):["cambio remoto"],
  };
  _setSyncQ(q);_updateSyncBadge();
}
function _resetConflictAsPending(id,payload,basePayload,baseRemoteUpdatedAt){
  const q=_getSyncQ();const i=q.findIndex(x=>x.id===id&&x.uid===uid());
  if(i===-1)return false;
  q[i].status="pending";q[i].retries=0;q[i].payload=payload||q[i].payload;
  q[i].basePayload=basePayload||q[i].basePayload||null;
  q[i].baseRemoteUpdatedAt=baseRemoteUpdatedAt||q[i].baseRemoteUpdatedAt||null;
  q[i].ts=new Date().toISOString();
  _setSyncQ(q);_updateSyncBadge();return true;
}
// Actualiza el badge de sincronización en la UI (sin reescribir el DOM de tabs/app).
function _updateSyncBadge(){
  const el=document.getElementById("sync-badge");if(!el)return;
  if(!session){el.hidden=true;return;}
  const q=_getSyncQ().filter(x=>x.uid===uid());
  const conflicts=q.filter(x=>x.status==="conflict").length;
  const pending=q.filter(x=>x.status==="pending").length;
  const failed=q.filter(x=>x.status==="failed").length;
  if(!navigator.onLine){
    el.textContent="Sin red";el.className="sync-badge offline";el.hidden=false;el.onclick=null;
  }else if(conflicts>0){
    el.textContent="Revisar";el.className="sync-badge conflict";el.hidden=false;
    el.onclick=()=>openSyncConflicts();
  }else if(failed>0){
    el.textContent="⚠ Atención";el.className="sync-badge attention";el.hidden=false;
    el.onclick=()=>toast("Cambios sin sincronizar ("+failed+"): vuelve a conectarte para reintentarlo.");
  }else if(pending>0){
    el.textContent="↑ "+pending;el.className="sync-badge pending";el.hidden=false;el.onclick=null;
  }else{
    el.textContent="✓";el.className="sync-badge synced";el.hidden=false;el.onclick=null;
    setTimeout(()=>{if(el&&el.className.includes("synced"))el.hidden=true;},2000);
  }
}
async function _fetchRemoteSyncPayload(item){
  if(item.entity==="day_log"){
    let r=await supa.from("day_log").select("state,plan_version_id,updated_at").eq("user_id",uid()).eq("log_date",item.entityKey).maybeSingle();
    if(r.error&&String((r.error&&r.error.message)||r.error).match(/plan_version_id|column/i))r=await supa.from("day_log").select("state,updated_at").eq("user_id",uid()).eq("log_date",item.entityKey).maybeSingle();
    if(r.error)throw r.error;
    if(!r.data)return null;
    return {user_id:uid(),log_date:item.entityKey,state:r.data.state||{},plan_version_id:r.data.plan_version_id||null,updated_at:r.data.updated_at||null};
  }
  if(item.entity==="weight_log"){
    const week=Number(String(item.entityKey).replace(/^w/,""));
    let r=await supa.from("weight_log").select("week,kg,bf_pct,updated_at,cycle_start").eq("user_id",uid()).eq("cycle_start",START).eq("week",week).maybeSingle();
    if(r.error&&cycleNumber()===1)r=await supa.from("weight_log").select("week,kg,bf_pct,updated_at").eq("user_id",uid()).eq("week",week).maybeSingle();
    if(r.error)throw r.error;
    if(!r.data)return null;
    return {user_id:uid(),cycle_start:r.data.cycle_start||START,week:r.data.week,kg:r.data.kg,bf_pct:r.data.bf_pct,updated_at:r.data.updated_at||null};
  }
  return null;
}
function _payloadSameEnough(entity,a,b){
  if(!a||!b||!SYNC_ENGINE.same)return false;
  if(entity==="day_log")return SYNC_ENGINE.same((a.state||{}),(b.state||{}));
  if(entity==="weight_log")return SYNC_ENGINE.same({kg:a.kg==null?null:Number(a.kg),bf_pct:a.bf_pct==null?null:Number(a.bf_pct)},{kg:b.kg==null?null:Number(b.kg),bf_pct:b.bf_pct==null?null:Number(b.bf_pct)});
  return false;
}
function _resolveQueuedConflictPayload(item,remotePayload){
  if(!remotePayload||!SYNC_ENGINE.remoteChangedSince||!SYNC_ENGINE.remoteChangedSince(item.baseRemoteUpdatedAt,remotePayload.updated_at))return {ok:true,payload:item.payload,remotePayload};
  if(_payloadSameEnough(item.entity,item.payload,remotePayload))return {ok:true,payload:item.payload,remotePayload,dequeueOnly:true};
  if(item.entity==="day_log"&&SYNC_ENGINE.mergeDayLogStates){
    const merged=SYNC_ENGINE.mergeDayLogStates(item.basePayload&&item.basePayload.state,item.payload&&item.payload.state,remotePayload.state);
    if(merged.ok){
      const payload={...item.payload,state:merged.merged,updated_at:new Date().toISOString()};
      return {ok:true,payload:appendSyncResolutionLogToPayload(payload,"auto_merge",{remoteUpdatedAt:remotePayload.updated_at}),remotePayload};
    }
    return {ok:false,remotePayload,conflicts:merged.conflicts};
  }
  if(item.entity==="weight_log"&&SYNC_ENGINE.mergeWeightPayload){
    const merged=SYNC_ENGINE.mergeWeightPayload(item.basePayload,item.payload,remotePayload);
    if(merged.ok){
      const payload={...item.payload,...merged.merged,updated_at:new Date().toISOString()};
      return {ok:true,payload,remotePayload};
    }
    return {ok:false,remotePayload,conflicts:merged.conflicts};
  }
  return {ok:false,remotePayload,conflicts:["cambio remoto"]};
}
// Procesa la cola: reintenta cada mutación pendiente en orden. Máximo 3 intentos por ítem.
let _drainBusy=false;
async function drainSyncQueue(){
  if(_drainBusy||!supa||!uid()||!navigator.onLine)return;
  _drainBusy=true;
  try{
    const q=_getSyncQ();
    // REQ-242: lo que agotó sus intentos también se reintenta al reconectar o
    // abrir la app; si no, queda sin subir para siempre.
    const pending=q.filter(x=>x.uid===uid()&&(x.status==="pending"||x.status==="failed"));
    for(const item of pending){
      try{
        if(!session||!session.access_token){await refreshAuth();if(!session)break;}
        const remotePayload=await _fetchRemoteSyncPayload(item);
        const resolved=_resolveQueuedConflictPayload(item,remotePayload);
        if(!resolved.ok){_markSyncConflict(item,remotePayload,resolved.conflicts);continue;}
        if(resolved.dequeueOnly){
          _rememberRemoteVersion(item.entity,item.entityKey,remotePayload&&remotePayload.updated_at,item.payload);
          _dequeueMutation(item.entity,item.entityKey);
          continue;
        }
        const payload=resolved.payload||item.payload;
        if(item.entity==="day_log"){
          let r=await supa.from("day_log").upsert(payload,{onConflict:"user_id,log_date"});
          if(r.error&&String((r.error&&r.error.message)||r.error).match(/plan_version_id|column/i)){
            const{plan_version_id:_,...compat}=payload;
            r=await supa.from("day_log").upsert(compat,{onConflict:"user_id,log_date"});
          }
          if(r.error)throw r.error;
          if(payload&&payload.state)S.days[item.entityKey]=payload.state;
        }else if(item.entity==="weight_log"){
          const p=payload;
          const r=await supa.from("weight_log").upsert(p,{onConflict:"user_id,cycle_start,week"});
          if(r.error&&cycleNumber()===1){
            await supa.from("weight_log").upsert({user_id:p.user_id,week:p.week,kg:p.kg,bf_pct:p.bf_pct,updated_at:p.updated_at},{onConflict:"user_id,week"});
          }else if(r.error)throw r.error;
          S.weights[p.week]={kg:Number(p.kg),bf:(p.bf_pct==null?null:Number(p.bf_pct))};
        }
        _rememberRemoteVersion(item.entity,item.entityKey,payload.updated_at||new Date().toISOString(),payload);
        save();
        _dequeueMutation(item.entity,item.entityKey);
      }catch(e){
        const q2=_getSyncQ();const i2=q2.findIndex(x=>x.id===item.id);
        if(i2!==-1){q2[i2].retries=(q2[i2].retries||0)+1;if(q2[i2].retries>=3)q2[i2].status="failed";_setSyncQ(q2);}
      }
    }
  }finally{_drainBusy=false;_updateSyncBadge();}
}

function _syncConflictLabel(item){
  if(item.entity==="day_log")return "Día "+prettyDate(item.entityKey);
  if(item.entity==="weight_log")return "Peso · semana "+String(item.entityKey).replace(/^w/,"");
  return "Cambio pendiente";
}
function _syncConflictDetail(item){
  const fields=(item.conflict&&Array.isArray(item.conflict.conflicts))?item.conflict.conflicts:[];
  if(item.entity==="day_log"){
    if(fields.some(f=>String(f).startsWith("meals.")))return "Hay cambios distintos en comidas del mismo día.";
    if(fields.some(f=>String(f).startsWith("extras.")))return "Hay cambios distintos en comidas extra.";
    if(fields.some(f=>String(f).includes("workout")))return "La sesión fue modificada en dos lugares.";
    return "El día fue actualizado en otro dispositivo.";
  }
  if(item.entity==="weight_log")return "El peso o porcentaje de grasa cambió en otro dispositivo.";
  return "Hay cambios guardados en otro dispositivo.";
}
function openSyncConflicts(){
  const items=_getSyncQ().filter(x=>x.uid===uid()&&x.status==="conflict");
  if(!items.length){toast("No hay conflictos pendientes");_updateSyncBadge();return;}
  const rows=items.map(item=>{
    const hasMerge=!!(item.conflict&&item.conflict.autoMergedPayload);
    return `<div class="dash" style="margin-bottom:10px">
      <b>${esc(_syncConflictLabel(item))}</b>
      <p class="muted small" style="margin:6px 0 10px">${esc(_syncConflictDetail(item))}</p>
      <div class="row wrap" style="gap:8px">
        <button class="btn btn-sm" onclick="resolveSyncConflict('${esc(item.id)}','local')">Conservar este dispositivo</button>
        <button class="btn btn-sm" onclick="resolveSyncConflict('${esc(item.id)}','remote')">Usar versión guardada</button>
        ${hasMerge?`<button class="btn btn-sm btn-accent" onclick="resolveSyncConflict('${esc(item.id)}','merge')">Combinar seguro</button>`:""}
      </div>
    </div>`;
  }).join("");
  modal(`<h3>Revisar sincronización</h3>
    <p class="muted small">Encontramos cambios hechos en otro dispositivo antes de guardar lo pendiente de este. Elige qué versión conservar.</p>
    ${rows}
    <button class="btn" style="width:100%;margin-top:4px" onclick="closeModal()">Cerrar</button>`);
}
function _applyRemoteSyncPayload(item,remotePayload){
  if(!remotePayload)return;
  if(item.entity==="day_log"){
    const state={...(remotePayload.state||{})};
    prepareDayStateForSync(state);
    S.days[item.entityKey]=state;
    _rememberRemoteVersion("day_log",item.entityKey,remotePayload.updated_at,remotePayload);
  }else if(item.entity==="weight_log"){
    const week=Number(String(item.entityKey).replace(/^w/,""));
    if(remotePayload.kg!=null)S.weights[week]={kg:Number(remotePayload.kg),bf:(remotePayload.bf_pct==null?null:Number(remotePayload.bf_pct))};
    _rememberRemoteVersion("weight_log",item.entityKey,remotePayload.updated_at,remotePayload);
  }
  save();
}
function _refreshAfterSyncResolution(item){
  if(item.entity==="day_log"&&(view==="hoy"||view==="nutricion"||view==="entreno")&&current===item.entityKey)render();
  else if(item.entity==="weight_log"&&view==="progreso")renderProgress();
}
function resolveSyncConflict(id,action){
  const item=_getSyncQ().find(x=>x.id===id&&x.uid===uid()&&x.status==="conflict");
  if(!item){toast("Ese conflicto ya fue resuelto");openSyncConflicts();return;}
  const remote=item.conflict&&item.conflict.remotePayload;
  if(action==="remote"){
    _applyRemoteSyncPayload(item,remote);
    _dequeueMutation(item.entity,item.entityKey);
    closeModal();_refreshAfterSyncResolution(item);toast("Versión guardada aplicada");
    return;
  }
  if(action==="merge"&&item.conflict&&item.conflict.autoMergedPayload){
    const payload=item.conflict.autoMergedPayload;
    _resetConflictAsPending(item.id,payload,remote,item.conflict.remoteUpdatedAt);
    closeModal();toast("Combinación lista para guardar");drainSyncQueue();return;
  }
  if(action==="local"){
    let payload={...item.payload,updated_at:new Date().toISOString()};
    if(item.entity==="day_log"){
      payload=appendSyncResolutionLogToPayload(payload,"manual_local",{remoteUpdatedAt:item.conflict&&item.conflict.remoteUpdatedAt});
      if(payload.state)S.days[item.entityKey]=payload.state;
    }else if(item.entity==="weight_log"){
      const week=Number(String(item.entityKey).replace(/^w/,""));
      if(payload.kg!=null)S.weights[week]={kg:Number(payload.kg),bf:(payload.bf_pct==null?null:Number(payload.bf_pct))};
    }
    save();
    _resetConflictAsPending(item.id,payload,remote,item.conflict&&item.conflict.remoteUpdatedAt);
    closeModal();_refreshAfterSyncResolution(item);toast("Cambio listo para guardar");drainSyncQueue();return;
  }
  toast("Elige una opción válida");
}
/* --- entitlement (REQ-25) ------------------------------------------------- */
let entitlement=null;        // {plan_id,status,starts_at,expires_at,origin} o null
let entitlementExpired=null; // último vencido para mostrar en UI
let premiumTrial=null;       // {status,starts_at,expires_at,days_left} o null
let entitlementChecked=false;// true cuando /api/entitlement respondió con éxito
let billingHistory=[];       // proyección segura de billing_events para el usuario actual
let billingHistoryChecked=false;
let billingHistoryLoading=false;
let billingHistoryError="";
async function loadEntitlement(){
  if(!session)return;
  const token=session&&session.access_token;if(!token)return;
  try{
    const r=await fetch("/api/entitlement",{headers:{Authorization:"Bearer "+token}});
    if(!r.ok){
      // 404=endpoint no existe aún; >=500=config faltante → no bloquear (permisivo)
      if(r.status===404||r.status>=500)return;

    }

    }
    entitlement=rawEnt;
