/* ============================================================
   REQ-08 — Generador de días de dieta con Claude.
   Usa contexto real del usuario (prefs, metas, platos de la DB, historial),
   valida la respuesta y deja revisar antes de aplicar. Solo autenticados
   (callClaude exige sesión).
   ============================================================ */
// Nombres de comidas de los últimos N días (para evitar repetir).
function recentMealNames(ds,n){
  const names=[];
  for(let i=1;i<=n;i++){
    const prev=addDays(ds,-i); const st=S.days&&S.days[prev]; if(!st)continue;
    const day=buildDay(prev);
    day.meals.forEach(b=>{const ms=st.meals&&st.meals[b.id];const v=mealValue(b,ms);if(v&&v.name)names.push(v.name);});
    (st.extras||[]).forEach(e=>{if(e.name)names.push(e.name);});
  }
  return names;
}
// Valida la respuesta de Claude contra metas, restricciones y repetición.
function validateGeneratedDay(j,day,target){
  const issues=[], warns=[];
  if(!j||!Array.isArray(j.comidas)||!j.comidas.length){return{ok:false,issues:["La respuesta no trae comidas."]};}
  const slotIds=day.meals.map(m=>m.id);
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const isTrainingDay=day&&day.ds&&!!plannedWorkoutId(day.ds,null)&&plannedWorkoutId(day.ds,null)!=="descanso";
  const ndCoach=window.FITBUD_NUTRITION_DOMAIN;
  const slotTargets=nutritionSlotTargetsForDay(day,target,prefs,isTrainingDay);
  const slotTargetById=new Map(slotTargets.map(slot=>[slot.id,slot]));
  const recent=recentMealNames(day.ds,5).map(s=>s.toLowerCase());
  const knownIng=new Set((DB.ingredients||[]).map(i=>i.name.toLowerCase()));
  // REQ-130: includeSoft=true para que dislikedIngredients también bloquee (no solo advierta).
  const hardTerms=coachFoodBlockTerms(true);
  const profileConflict=text=>ndCoach&&ndCoach.foodTextConflictForProfile
    ?ndCoach.foodTextConflictForProfile(text,prefs,{includeSoft:true})
    :coachTextHasTerms(text,hardTerms);
  let tot={kcal:0,p:0,c:0,f:0}; const comidas=[];
  j.comidas.forEach((c,idx)=>{
    const slot_id=c.slot_id||c.slot||slotIds[idx]||("slot"+idx);
    const nombre=coachCopy((c.nombre||c.name||"").trim());
    const ings=Array.isArray(c.ingredientes)?c.ingredientes.map(x=>({nombre:coachCopy((x.nombre||x.name||"").trim()),gramos:+(x.gramos!=null?x.gramos:x.grams)})):[];
    if(!nombre)issues.push(`Comida ${idx+1} sin nombre.`);
    if(!ings.length)issues.push(`"${nombre||("Comida "+(idx+1))}" sin ingredientes.`);
    ings.forEach(g=>{if(!(g.gramos>0))issues.push(`"${nombre}": gramos inválidos en "${g.nombre}".`);});
    // REQ-85: rechazar nombres de plato o ingrediente ficticios/placeholder
    const placeholderRe=/\b(práctica|práctico|genéric[oa]|compatible|relleno|placeholder|fictici[oa]|completar el día)\b/i;
    if(nombre&&placeholderRe.test(nombre))issues.push(`"${nombre}" parece un nombre ficticio, no una comida real.`);
    if(ings.length===1&&ings[0].nombre&&placeholderRe.test(ings[0].nombre))issues.push(`"${nombre}": ingrediente "${ings[0].nombre}" parece ficticio.`);
    // REQ-84: macros declarados por el coach son informativos. El motor recalcula desde ingredientes del catálogo.
    let macro;
    if(ndCoach&&ndCoach.recalcCoachMealMacros&&DB.loaded){
      const calc=ndCoach.recalcCoachMealMacros({ingredientes:ings},DB);
      macro=calc.macros;
      if(calc.unknownCount>0)warns.push(`"${nombre}": ingredientes no reconocidos (${calc.unknownNames.join(", ")}). Macros calculados desde ingredientes conocidos.`);
    }else{
      macro={kcal:+c.kcal||0,p:+c.proteina_g||+c.p||0,c:+c.carbohidratos_g||+c.c||0,f:+c.grasa_g||+c.f||0};
    }
    const matchedDish=DB.loaded&&ndCoach&&ndCoach.findDishForMeal
      ?ndCoach.findDishForMeal({slot_id,nombre,dishSlug:c.dishSlug||c.dish_slug,slug:c.slug,dishId:c.dishId||c.dish_id},DB)
      :DB.loaded?dishByName(nombre):null;
    if(matchedDish){
      const compatibleSlots=ndCoach&&ndCoach.compatibleSlotsForDish
        ?ndCoach.compatibleSlotsForDish(matchedDish)
        :dishCompatibleSlots(matchedDish);
      // REQ-131: dish_slot_incompatible bloquea guisos/platos de almuerzo en desayuno.
      if(!compatibleSlots.includes(slot_id)){
        issues.push(`"${nombre}" no corresponde a ${slot_id}; en el catálogo corresponde a ${compatibleSlots.join(", ")||"otro momento"}.`);
      }
      if(ndCoach&&ndCoach.dishAllowedForSlotMoment&&!ndCoach.dishAllowedForSlotMoment(matchedDish,slot_id,prefs)){
        issues.push(`"${nombre}" es demasiado contundente para ${slot_id} según su metadata de momento del día.`);
      }
    }
    const slotTarget=slotTargetById.get(slot_id);
    const slotCeiling=ndCoach&&ndCoach.slotKcalCeiling
      ?ndCoach.slotKcalCeiling(slotTarget,prefs)
      :slotTarget&&slotTarget.target&&slotTarget.target.kcal?Math.round(slotTarget.target.kcal*1.15):0;
    if(slotCeiling>0&&macro.kcal>slotCeiling){
      issues.push(`"${nombre}" es demasiado contundente para ${slot_id}: ${Math.round(macro.kcal)} kcal sobre el techo de ${slotCeiling} kcal.`);
    }
    tot.kcal+=macro.kcal;tot.p+=macro.p;tot.c+=macro.c;tot.f+=macro.f;
    // Restricciones duras del perfil: patrón alimentario, alergias, sin lácteos, sin gluten y
    // dislikedIngredients (REQ-130: ahora bloquea igual que una restricción dura).
    const hay=(nombre+" "+ings.map(g=>g.nombre).join(" ")).toLowerCase();
    const conflict=profileConflict(hay);
    if(conflict)issues.push(`"${nombre}" incluye "${conflict}" (restricción obligatoria).`);
    // ingredientes nuevos: solo cuando el catálogo no está disponible para recalcular
    if(!(ndCoach&&ndCoach.recalcCoachMealMacros&&DB.loaded)){
      const nuevos=ings.filter(g=>g.nombre&&!knownIng.has(g.nombre.toLowerCase())).map(g=>g.nombre);
      if(nuevos.length&&DB.loaded)warns.push(`"${nombre}": ingredientes nuevos (${nuevos.join(", ")}).`);
    }
    if(recent.includes(nombre.toLowerCase()))warns.push(`"${nombre}" se repite respecto a días recientes.`);
    // REQ-169/170: el cierre del día (finalizeNutritionDay) reemplaza estas comidas;
    // aquí solo se explica el cambio al usuario.
    const rejectedKeys=new Set(sessionRejectedMeals(day.ds).map(r=>r.key));
    const rejectedByUser=(matchedDish&&(dishBlockedBySavedList(matchedDish)||rejectedKeys.has(dishBlockKey(matchedDish))))
      ||(!matchedDish&&ndCoach&&ndCoach.mealNameBlockedByProfile&&ndCoach.mealNameBlockedByProfile({nombre},prefsWithSessionRejections(prefs,day.ds)));
    if(rejectedByUser)warns.push(`"${nombre}" ya lo descartaste; lo cambiamos por otra opción.`);
    else if(!matchedDish&&ndCoach&&ndCoach.slotMomentTextConflict&&ndCoach.slotMomentTextConflict(nombre,slot_id,prefs)){
      warns.push(`"${nombre}" no es una opción típica para ${slot_id}; la cambiamos por una que sí lo es.`);
    }
    comidas.push({slot_id,nombre,ingredientes:ings,kcal:Math.round(macro.kcal),proteina_g:Math.round(macro.p),carbohidratos_g:Math.round(macro.c),grasa_g:Math.round(macro.f)});
  });
  // REQ-138: los totales que el modelo propone ya no son autoridad final — el
  // cierre real de macros lo hace finalizeNutritionDay() aguas abajo. Estos
  // desvíos quedan como aviso informativo, no bloquean la composición propuesta.
  const off=(v,t,tol)=>t>0&&Math.abs(v-t)>t*tol;
  if(off(tot.kcal,target.kcal,0.15))warns.push(`kcal del día ${Math.round(tot.kcal)} fuera de ±15% de ${target.kcal}; se ajustará automáticamente.`);
  if(tot.p<target.p*0.85)warns.push(`Proteína ${Math.round(tot.p)} g por debajo del 85% de la meta (${target.p} g); se ajustará automáticamente.`);
  if(off(tot.c,target.c,0.3))warns.push(`Carbohidratos ${Math.round(tot.c)} g lejos de la meta (${target.c} g).`);
  const omnivoreAnimal=ndCoach&&ndCoach.validateOmnivoreAnimalProtein
    ?ndCoach.validateOmnivoreAnimalProtein(comidas,prefs,DB)
    :{ok:true,required:false,warns:[]};
  (omnivoreAnimal.warns||[]).forEach(warn=>warns.push(warn.message||String(warn)));
  return{ok:issues.length===0,issues,warns,comidas,totals:{kcal:Math.round(tot.kcal),p:Math.round(tot.p),c:Math.round(tot.c),f:Math.round(tot.f)},explicacion:coachCopy((j.explicacion||j.explicación||"").trim()),omnivoreAnimalProtein:omnivoreAnimal};
}
// REQ-89: busca un snack/shake del catálogo para cerrar un déficit de kcal/proteína.
function findGapSnack(totals,target){
  if(!DB.loaded||!DB.dishes||!DB.dishIng)return null;
  const kcalGap=target.kcal-totals.kcal;
  const protGap=target.p-totals.p;
  if(kcalGap<80&&protGap<8)return null;
  if(kcalGap>700)return null;
  const snackSlots=new Set(["snack","batido","media_manana","merienda"]);
  const candidates=DB.dishes.filter(d=>{
    if(coachDishBlockedByProfile(d).blocked)return false;
    const slots=dishCompatibleSlots(d);
    return slots.some(s=>snackSlots.has(s));
  });
  if(!candidates.length)return null;
  let best=null, bestScore=Infinity;
  for(const d of candidates){
    const m=dishMacros(d.id);
    if(m.kcal<10)continue;
    const protDominant=protGap*4>kcalGap;
    const scale=protDominant&&m.p>0?Math.max(0.5,Math.min(2.5,protGap/m.p)):m.kcal>0?Math.max(0.5,Math.min(2.5,kcalGap/m.kcal)):1;
    const sKcal=m.kcal*scale, sP=m.p*scale;
    const newKcal=totals.kcal+sKcal, newP=totals.p+sP;
    if(newKcal>target.kcal*1.15)continue;
    const kcalOff=Math.abs(newKcal-target.kcal)/target.kcal;
    const pOff=newP<target.p*0.85?target.p*0.85-newP:0;
    const score=kcalOff*100+pOff*4+(protDominant&&m.p<5?200:0);
    if(score<bestScore){bestScore=score;best={dish:d,scale,macros:m};}
  }
  if(!best)return null;
  const {dish,scale,macros}=best;
  const lines=DB.dishIng.filter(x=>x.dish_id===dish.id);
  const ings=lines.map(l=>{const ing=ingById(+l.ingredient_id);return{nombre:ing?ing.name:"Ingrediente",gramos:Math.round((+l.grams)*scale)};}).filter(g=>g.gramos>0);
  const sM={kcal:Math.round(macros.kcal*scale),p:Math.round(macros.p*scale),c:Math.round(macros.c*scale),f:Math.round(macros.f*scale)};
  return{slot_id:"snack_extra",nombre:dish.name,ingredientes:ings,kcal:sM.kcal,proteina_g:sM.p,carbohidratos_g:sM.c,grasa_g:sM.f};
}

// --- Plan semanal personalizado (se guarda como overrides por día, por usuario) ---
function weekDays(w){const days=[];let d=w.start;while(d<=w.end){if(d>=START&&d<=END)days.push(d);d=addDays(d,1);}return days;}
function weekHasGeneratedPlan(w){return weekDays(w).some(ds=>{const st=S.days&&S.days[ds];return st&&st.meals&&Object.values(st.meals).some(m=>m&&m.ovr&&m.ovr.gen);});}
// Modo determinista: genera semana con planNutritionWeek sin llamada externa.
function generateDeterministicWeek(w,days){
  const nd=window.FITBUD_NUTRITION_DOMAIN;
  if(!nd||!nd.planNutritionWeek||!DB.loaded)return null;
  const target=effectiveDayTarget();
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const result=nd.planNutritionWeek({prefs,dayTarget:target,catalog:DB,numDays:days.length,startDate:days[0],varietySeed:uid()||""});
  if(!result||!result.days||!result.days.length)return null;
  // Mapear días del plan a fechas reales de la semana y cerrar cada día por
  // finalizeNutritionDay() (REQ-138) para aplicar el cierre global de macros.
  const daysData=days.map((ds,i)=>{
    const planDay=result.days[i]||result.days[result.days.length-1];
    const day=buildDay(ds);
    const finalized=finalizeDayWithGate(ds,day,target,prefs,planDay.comidas||[]);
    return{ds,comidas:(finalized&&finalized.comidas)||planDay.comidas||[]};
  });
  const label=w.num?("Semana "+w.num):"Semana de arranque";
  return{
    week:w,label,daysData,problems:[],

    variety:result.variety,
    shoppingList:result.shoppingList,
  };
}

// Fallback desde el modal del coach: conserva los días ya generados y completa
// los faltantes de la semana por ruta determinista.
function deterministicWeekFromModal(){
  const draft=window._genWeek;
  if(!draft){toast("No pudimos preparar tu semana ahora. Inténtalo otra vez en unos minutos.");closeModal();return;}
  const pending=weekPendingDays(weekDays(draft.week));
  const doneIds=new Set(draft.daysData.map(d=>d.ds));
  const missing=pending.filter(ds=>!doneIds.has(ds));
  if(missing.length){
    const det=generateDeterministicWeek(draft.week,missing);
    if(det&&det.daysData&&det.daysData.length){
      draft.daysData=draft.daysData.concat(det.daysData).sort((a,b)=>a.ds<b.ds?-1:a.ds>b.ds?1:0);
      if(!draft.weekSummary&&det.weekSummary)draft.weekSummary=det.weekSummary;
      if(!draft.variety&&det.variety)draft.variety=det.variety;
      const nd=window.FITBUD_NUTRITION_DOMAIN;
      draft.shoppingList=(nd&&nd.buildShoppingListFromNutritionPlan)?nd.buildShoppingListFromNutritionPlan(draft.daysData):buildShoppingList(draft.daysData);
    }
  }
  if(!draft.daysData.length){toast("No pudimos preparar tu semana ahora. Inténtalo otra vez en unos minutos.");closeModal();return;}
  const el=$("#genwOut");if(el)el.innerHTML=genWeekReviewHtml();
}

// Aplica las comidas generadas como override por slot (plan del usuario, vía day_log).
// REQ-121: nunca reescribe una comida ya registrada (done=true) — solo el futuro cambia.
// REQ-256: tampoco reescribe una comida que el usuario eligió o editó a mano
// (ms.ovr.userSet, de saveEditor/applyChangeMeal) aunque no esté marcada hecha.
// Devuelve cuántas comidas se preservaron (hechas o elegidas por el usuario),
// para poder avisar al usuario.
function applyDayComidas(ds,comidas){
  let preserved=0;
  (comidas||[]).forEach(c=>{
    const ms=mealState(ds,c.slot_id); if(!ms)return;
    if(ms.done||(ms.ovr&&ms.ovr.userSet)){preserved++;return;}
    ms.ovr={name:c.nombre,kcal:c.kcal,p:c.proteina_g,c:c.carbohidratos_g,f:c.grasa_g,ingredientes:c.ingredientes,gen:true,...(c.dishSlug?{dishSlug:c.dishSlug}:{})};
  });
  commitDay(ds);
  return preserved;
}

// Regenera una sola comida del borrador del día sin afectar las demás.
async function regenerateGenMeal(slotId){
  const draft=window._genDay;if(!draft)return;
  const actionKey="diet_meal_"+slotId;
  const requestId=beginCoachAction(actionKey);if(!requestId)return;
  if(!consumeMealOptionReroll()){
    endCoachAction(actionKey);
    toast("Ya usaste tus cambios de opciones por hoy");
    return;
  }
  const day=buildDay(draft.ds);const target=effectiveDayTarget();
  const slot=day.meals.find(m=>m.id===slotId);if(!slot){endCoachAction(actionKey);return;}
  // REQ-169: pedir otra opción descarta la actual para el resto de la sesión.
  rememberRejectedMeal(draft.ds,(draft.comidas.find(c=>c.slot_id===slotId)||{}).nombre);
  const others=draft.comidas.filter(c=>c.slot_id!==slotId);
  const usedKcal=others.reduce((s,c)=>s+Number(c.kcal||0),0);
  const usedP=others.reduce((s,c)=>s+Number(c.proteina_g||0),0);
  const usedC=others.reduce((s,c)=>s+Number(c.carbohidratos_g||0),0);
  const usedF=others.reduce((s,c)=>s+Number(c.grasa_g||0),0);
  const remKcal=Math.max(50,target.kcal-usedKcal);
  const remP=Math.max(5,target.p-usedP);
  const remC=Math.max(5,target.c-usedC);
  const remF=Math.max(2,target.f-usedF);
  const profilePrefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const prefs=prefsWithSessionRejections(profilePrefs,draft.ds);
  const draftNames=new Set(others.map(c=>coachKey(c.nombre)));
  const slotDishes=promptCompatibleDishesForSlot(slotId,prefs).filter(d=>!draftNames.has(coachKey(d.name)));
  const dishList=slotDishes.length?slotDishes.slice(0,40).map(d=>{const m=dishMacros(d.id);return `${d.name} [${dishSlotMeta(d)}] ${m.kcal}kcal P${m.p}/C${m.c}/G${m.f}`;}).join("; "):"(sin platos compatibles en la base)";
  const likesLine=coachLikesLine(prefs);
  const blockedLine=coachBlockedDishesLine(profilePrefs)+coachRejectedMealsLine(draft.ds);
  // REQ-130: mismas restricciones duras (incl. dislikedIngredients) y aviso de patrón
  // alimentario que usa generateOneDay, para que un "cambiar comida" individual no
  // reintroduzca ingredientes no gustados ni sesgue a vegetariano por defecto.
  const hardTerms=coachFoodBlockTerms(true);
  const hardResLine=hardTerms.length?`\nNUNCA incluyas en ninguna comida o ingrediente, bajo ninguna circunstancia: ${hardTerms.join(", ")}.`:"";
  const dietList=Array.isArray(prefs.diet)?prefs.diet:[];
  const vegLine=dietList.includes("vegano")?`\nPatrón VEGANO: no incluyas carne, aves, pescado, mariscos, lácteos, huevo ni miel; usa solo ingredientes de origen vegetal.`:dietList.includes("vegetariano")?`\nPatrón VEGETARIANO: no incluyas carne, aves, pescado ni mariscos.`:`\nPatrón OMNÍVORO: el usuario NO es vegetariano ni vegano, así que NO generes una opción vegetariana por defecto. Incluye proteína animal cuando encaje con sus gustos y metas.`;
  const animalLine=omnivoreAnimalProteinPromptLine(prefs);
  const slotMomentLine=`\nMomento del día: ${slotArchetypePromptLine(slotId)}.`;
  const out=$("#genOut");if(out)out.innerHTML=`<div class="ai-box">Buscando otra opción para ${esc(slot.slot)}…</div>`;
  try{
    const prompt=`Sugiere UNA comida diferente para el slot "${slot.slot}" (id: ${slotId}) del ${prettyDate(draft.ds)}.
Macros disponibles para este slot: ${remKcal} kcal, ${remP} g proteína, ${remC} g carbos, ${remF} g grasa.
Tiempo: ≤${prefs.cookingMinutes||30} min. No repitas: ${draft.comidas.map(c=>c.nombre).join(", ")}.${hardResLine}${vegLine}${animalLine}${slotMomentLine}${likesLine}${blockedLine}
Platos de referencia: ${dishList.slice(0,400)}.
PROHIBIDO inventar nombres genéricos o ficticios. Usa un nombre descriptivo real y ingredientes reales.
Responde SOLO JSON (formato de un día con un slot): {"explicacion":"breve","comidas":[{"slot_id":"${slotId}","nombre":"...","ingredientes":[{"nombre":"...","gramos":0}],"kcal":0,"proteina_g":0,"carbohidratos_g":0,"grasa_g":0}]}`;
    // REQ-85: fallback usa el plato real más cercano del catálogo, no un placeholder ficticio
    const fbDish=slotDishes.map(d=>{const m=dishMacros(d.id);return{name:d.name,id:d.id,...m,dist:Math.abs(m.kcal-remKcal)+Math.abs(m.p-remP)*4};}).sort((a,b)=>a.dist-b.dist)[0];
    const fbIngs=fbDish?DB.dishIng.filter(di=>di.dish_id===fbDish.id).map(di=>{const ing=(DB.ingredients||[]).find(i=>i.id===di.ingredient_id);return{nombre:ing?ing.name:"Ingrediente",gramos:di.grams};}):[];
    const fallbackMeal=fbDish?{slot_id:slotId,nombre:fbDish.name,ingredientes:fbIngs,kcal:fbDish.kcal,proteina_g:fbDish.p,carbohidratos_g:fbDish.c,grasa_g:fbDish.f}:{slot_id:slotId,nombre:`${slot.slot} rápido`,ingredientes:[],kcal:0,proteina_g:0,carbohidratos_g:0,grasa_g:0};
    const fallback=JSON.stringify({explicacion:"Opción del catálogo para el slot.",comidas:[fallbackMeal]});
    const validation={expectedMeals:1,slots:[slotId],target:{kcal:remKcal,p:remP,c:remC,f:remF},hardRestrictions:hardTerms};
    const quota=coachQuota("diet_day",requestId,"slot-"+slotId,fallback,validation,rejectionScope(slotId+":"+draft.ds,draft.ds));
    const prevName=coachKey((draft.comidas.find(c=>c.slot_id===slotId)||{}).nombre);
    const txt=await callClaude(prompt,500,quota);
    const wasReused=lastCoachCallReused;
    const parsed=parseJSON(txt);
    const oneMeal=(Array.isArray(parsed.comidas)&&parsed.comidas[0])||parsed;

    const ings=Array.isArray(oneMeal.ingredientes)?oneMeal.ingredientes.map(x=>({nombre:coachCopy((x.nombre||"").trim()),gramos:+x.gramos})):[];
    const hay=(nombre+" "+ings.map(g=>g.nombre).join(" ")).toLowerCase();
    if(coachTextHasTerms(hay,hardTerms))throw new Error("La opción contiene una restricción del perfil.");
    // REQ-123: si el cupo de frescas se agotó y el servidor reutilizó la misma sugerencia

    // REQ-169/170: lo mismo si el coach devuelve algo ya descartado o un plato
    // contundente para un momento ligero (ej. arroz con pollo en el desayuno).
    const ndCoach=window.FITBUD_NUTRITION_DOMAIN;
    const unsuitable=!!(ndCoach&&(
      (ndCoach.mealNameBlockedByProfile&&ndCoach.mealNameBlockedByProfile({nombre},prefs))||
      (ndCoach.slotMomentTextConflict&&ndCoach.slotMomentTextConflict(nombre,slotId,prefs))

    const reusedSameDish=(wasReused&&coachKey(nombre)===prevName)||unsuitable;
    const meal=reusedSameDish&&fbDish
      ?{slot_id:slotId,nombre:fbDish.name,ingredientes:fbIngs,kcal:fbDish.kcal,proteina_g:fbDish.p,carbohidratos_g:fbDish.c,grasa_g:fbDish.f}
      :{slot_id:slotId,nombre,ingredientes:ings,kcal:Math.round(+oneMeal.kcal||remKcal),proteina_g:Math.round(+oneMeal.proteina_g||remP),carbohidratos_g:Math.round(+oneMeal.carbohidratos_g||remC),grasa_g:Math.round(+oneMeal.grasa_g||remF)};
    // REQ-138: puerta única — las demás comidas del borrador quedan bloqueadas

// --- modelo de peso: S.weights[n] puede ser número (legado, solo kg) u objeto {kg,bf}.
function wEntry(n){const v=S.weights[n];if(v==null)return null;return typeof v==="object"?v:{kg:+v,bf:null};}
function wkg(n){const e=wEntry(n);return e&&e.kg!=null?+e.kg:null;}
function wbf(n){const e=wEntry(n);return e&&e.bf!=null?+e.bf:null;}
function setWeightEntry(n,patch){
  const e=wEntry(n); const cur=e?{kg:e.kg,bf:e.bf}:{kg:null,bf:null};
  if("kg" in patch) cur.kg=(patch.kg===""||patch.kg==null)?null:+patch.kg;
  if("bf" in patch) cur.bf=(patch.bf===""||patch.bf==null)?null:+patch.bf;
  if(cur.kg==null&&cur.bf==null) delete S.weights[n];
  else S.weights[n]={kg:cur.kg,bf:cur.bf};
  pushWeight(n, cur.kg==null?null:cur.kg, cur.bf);
  save();renderProgress();
}

function weightAxisDomain(points,reference){
  const values=points.map(p=>p.y).filter(v=>Number.isFinite(v));
  if(reference!=null)values.push(reference);
  const min=Math.min(...values),max=Math.max(...values);
  const spread=Math.max(0,max-min);
  const padKg=Math.max(2,spread*.05);
  return {minY:min-padKg,maxY:max+padKg};
}
function weightChart(){
  const pts=Object.keys(WEIGHT_RANGES).map(n=>({x:+n,y:wkg(n)})).filter(p=>p.y!=null);
  if(pts.length<1)return "";
  const W=520,H=160,pad=28;const span=Math.max(1,PLAN_DURATION_WEEKS-1);const xs=p=>pad+(p.x-1)/span*(W-pad*2);
  const startRef=startWeightReference();
  const {minY,maxY}=weightAxisDomain(pts,startRef);
  const ys=y=>H-pad-(y-minY)/(maxY-minY)*(H-pad*2);
  const line=pts.map((p,i)=>(i?"L":"M")+xs(p).toFixed(1)+" "+ys(p.y).toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle cx="${xs(p).toFixed(1)}" cy="${ys(p.y).toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join("");
  const startLayer=startRef!=null?`<line x1="${pad}" y1="${ys(startRef)}" x2="${W-pad}" y2="${ys(startRef)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="${W-pad}" y="${Math.max(12,ys(startRef)-4)}" fill="var(--muted)" font-size="10" text-anchor="end">Inicio ${startRef.toFixed(1)} kg</text>`:"";
  // Overlay de % grasa corporal (eje propio, en terracota) si hay datos.
  const bfpts=Object.keys(WEIGHT_RANGES).map(n=>({x:+n,y:wbf(n)})).filter(p=>p.y!=null);
  let bfLayer="";
  if(bfpts.length>=1){
    const bfAll=bfpts.map(p=>p.y);const bMin=Math.min(...bfAll)-1,bMax=Math.max(...bfAll)+1;
    const bys=y=>H-pad-(y-bMin)/((bMax-bMin)||1)*(H-pad*2);
    const bline=bfpts.map((p,i)=>(i?"L":"M")+xs(p).toFixed(1)+" "+bys(p.y).toFixed(1)).join(" ");
    const bdots=bfpts.map(p=>`<circle cx="${xs(p).toFixed(1)}" cy="${bys(p.y).toFixed(1)}" r="3" fill="var(--terra-400)"/>`).join("");
    bfLayer=`<path d="${bline}" fill="none" stroke="var(--terra-400)" stroke-width="1.6" stroke-dasharray="2 2"/>${bdots}
      <text x="${pad}" y="12" fill="var(--terra-300)" font-size="10">% grasa</text>`;
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%">
    ${startLayer}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}
    ${bfLayer}
  </svg></div>`;
}

/* ---------- REQ-23: sistema de rachas justo ---------- */

// Nutrición cumplida: ≥50 % de las comidas planificadas marcadas.
function nutritionDayDone(ds){
  const day=buildDay(ds);
  if(!day.meals.length)return false;
  const done=day.meals.filter(m=>{const ms=mealState(ds,m.id);return ms.done&&mealHasContent(mealValue(m,ms));}).length;
  return done>=Math.ceil(day.meals.length/2);
}

/* ---------- REQ-63: adherencia reciente y aprendizaje silencioso de patrones ---------- */

// True si ≥5 de los últimos 7 días calendario (ventana deslizante hacia atrás desde ds) cumplen nutritionDayDone.
function recentNutritionAdherence(ds){
  let count=0;
  for(let i=0;i<7;i++){const d=addDays(ds,-i);if(d>=START&&nutritionDayDone(d))count++;}
  return count>=5;
}

// Escanea los últimos windowDays días y devuelve los ingredientes y nombres de plato más frecuentes
// entre comidas marcadas done:true con override de IA (ovr presente).
function extractLearnedPatterns(ds,windowDays){
  windowDays=windowDays||14;
  const ingFreq={},mealFreq={};
  for(let i=0;i<windowDays;i++){
    const d=addDays(ds,-i);
    if(d<START)break;
    const st=S.days&&S.days[d];if(!st||!st.meals)continue;
    const day=buildDay(d);
    day.meals.forEach(b=>{
      const ms=st.meals&&st.meals[b.id];
      if(!ms||!ms.done)return;
      const o=ms.ovr;
      if(!o)return;
      if(o.name){const k=o.name.trim();if(k)mealFreq[k]=(mealFreq[k]||0)+1;}
      if(Array.isArray(o.ingredientes)){
        o.ingredientes.forEach(x=>{
          const k=(x.nombre||x.name||"").trim();
          if(k)ingFreq[k]=(ingFreq[k]||0)+1;
        });
      }
    });
  }
  const topIngredients=Object.entries(ingFreq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>k);
  const topMealNames=Object.entries(mealFreq).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k])=>k);
  return{topIngredients,topMealNames,detectedAt:ds,windowDays};
}

// Comprueba la condición 5-de-7 y, si se cumple, persiste los patrones aprendidos en profile.prefs.learnedPatterns.
// Sin notificación al usuario. Decisión técnica: recalcula como máximo una vez por día (detectedAt===todayStr()).
async function maybeUpdateLearnedPatterns(){
  if(!supa||!profile||!session||!isActive())return;
  const ds=todayStr();
  if(!recentNutritionAdherence(ds))return;
  const existing=profile.prefs&&profile.prefs.learnedPatterns;
  if(existing&&existing.detectedAt===ds)return;
  const patterns=extractLearnedPatterns(ds,14);
  if(!patterns.topIngredients.length&&!patterns.topMealNames.length)return;
  if(!profile.prefs)profile.prefs={};
  profile.prefs.learnedPatterns=patterns;
  try{
    await supa.from("profiles").update({prefs:profile.prefs,updated_at:new Date().toISOString()}).eq("id",uid());
  }catch(e){/* best-effort */}
}

// Resultado de entrenamiento del día.
function trainingDayResult(ds){
  const ew=effectiveWorkout(ds);
  const isRest=ew.workout&&ew.workout.id==="descanso";
  const st=S.days[ds]||{};
  // REQ-206: descanso planificado, pero entrenó igual → cuenta como entrenado.
  // REQ-252: un día de actividad libre sin registrar tampoco rompe la racha.
  if(isRest||isFreeActivityWorkout(ew.workout))return manualActivities(st).length?"done":"rest";
  // REQ-163: una sesión in_progress/paused (bloques omitidos, series sueltas)
  // no es un cierre real — solo un resultado TERMINAL (completed/partial) o
  // el legado st.workoutDone cuentan para la racha. workoutHasRecordedActivity()
  // no se toca aquí a propósito: otros usos (p. ej. protección de días en
  // REQ-126) siguen queriendo detectar cualquier actividad, no solo la cerrada.
  const outcome=workoutOutcomeForState(st);
  const done=outcome==="completed"||outcome==="partial"||!!st.workoutDone;
  return done?"done":"missed";
}

// Día con cumplimiento combinado (nutrición + entrenamiento o descanso planificado).
function combinedDayDone(ds){
  if(ds<START||ds>todayStr())return false;
  const trainRes=trainingDayResult(ds);
  return nutritionDayDone(ds)&&(trainRes==="done"||trainRes==="rest");
}

// Métricas completas de rachas: pase hacia adelante desde START hasta hoy.
// El día en curso (hoy) aún no cumplido no rompe la racha, igual que streak():
// "pendiente" (hoy sin registrar todavía) es distinto de "rota" (un día ya
// vencido sin cumplir). Solo los días anteriores a hoy resetean el contador.
function streakStats(){
  const today=todayStr();
  let ds=START;
  let nutCur=0,nutBest=0,trainCur=0,trainBest=0,combCur=0,combBest=0;
  while(ds<=today&&ds<=END){
    const isToday=ds===today;
    const nutDone=nutritionDayDone(ds);
    const trainRes=trainingDayResult(ds);
    if(nutDone){nutCur++;if(nutCur>nutBest)nutBest=nutCur;}
    else if(!isToday)nutCur=0;
    if(trainRes==="done"){trainCur++;if(trainCur>trainBest)trainBest=trainCur;}
    else if(trainRes!=="rest"&&!isToday)trainCur=0;
    const combOk=nutDone&&(trainRes==="done"||trainRes==="rest");
    if(combOk){combCur++;if(combCur>combBest)combBest=combCur;}
    else if(!isToday)combCur=0;
    ds=addDays(ds,1);
  }
  // Consistencia de la semana actual (sesiones de entrenamiento)
  const prefs=planPrefsForDate(today);
  const week=weekOf(today,prefs)||weekOf(today);
  let weekPlanned=0,weekDone=0;
  if(week){
    let d=week.start;
    while(d<=week.end&&d<=today){
      const res=trainingDayResult(d);
      if(res!=="rest"){weekPlanned++;if(res==="done")weekDone++;}
      d=addDays(d,1);
    }
  }
  return{nutCur,nutBest,trainCur,trainBest,combCur,combBest,weekPlanned,weekDone};
}

const STREAK_MILESTONE_LEVELS=[3,7,14,30];

function getStreakMilestones(){
  return Array.isArray(profile&&profile.prefs&&profile.prefs.streakMilestones)
    ?profile.prefs.streakMilestones:[];
}

// Guarda hito de racha si no existe ya para (type, level, cycle).
async function saveStreakMilestone(type,level){
  if(!profile||!profile.prefs)return;
  const key=`${type}-${level}-c${cycleNumber()}`;
  const existing=getStreakMilestones();
  if(existing.some(m=>m.key===key))return;
  const milestone={key,type,level,cycle:cycleNumber(),date:todayStr()};
  const updated=[...existing,milestone];
  if(!profile.prefs.streakMilestones)profile.prefs.streakMilestones=[];
  profile.prefs.streakMilestones=updated;
  try{await saveProfilePrefs(profile.prefs);}catch(e){/* best-effort */}
}

// Detecta y guarda hitos nuevos; muestra toast la primera vez.
function checkAndSaveMilestones(){
  if(!profile||!session||!isActive())return;
  const stk=streak();
  STREAK_MILESTONE_LEVELS.forEach(level=>{
    if(stk>=level){
      const key=`combined-${level}-c${cycleNumber()}`;
      if(!getStreakMilestones().some(m=>m.key===key)){
        saveStreakMilestone("combined",level);
        toast(`🔥 ¡${level} días de racha! Sigue así.`);
      }
    }
  });
}

// Racha combinada: días consecutivos cumplidos hasta hoy (ventana de 1 día).
function streak(){
  let n=0,ds=todayStr();
  if(!combinedDayDone(ds))ds=addDays(ds,-1);
  while(ds>=START&&combinedDayDone(ds)){n++;ds=addDays(ds,-1);}
  return n;
}

async function saveProfilePrefs(prefs,meta){
  if(!supa||!uid())return{error:{message:"Sin sesión"}};
  if(!isActive())return{error:{message:"Cuenta desactivada"}};
  const normalized=migrateProfilePrefs(prefs||{});
  const result=await supa.from("profiles").upsert({
    id:uid(),
    email:(session&&session.user&&session.user.email)||"",
    prefs:normalized,
    updated_at:new Date().toISOString(),
  },{onConflict:"id"});
  if(!result.error){
    profile.prefs=normalized;
    refreshPlanCalendar();
    if(!(meta&&meta.skipPlanVersion)){
      try{
        const version=await ensurePlanVersion({
          prefs:normalized,
          source:(meta&&meta.source)||"manual",
          reason:(meta&&meta.reason)||"",
          validFrom:validYmd(meta&&meta.validFrom)?meta.validFrom:todayStr(),
          validTo:validYmd(meta&&meta.validTo)?meta.validTo:null,
          cycleNumber:(meta&&meta.cycleNumber)!=null?meta.cycleNumber:normalized.planCycleNumber,
        });
        if(version)await backfillDayVersions();
      }catch(e){
        if(!String((e&&e.message)||e).match(/plan_versions|relation|column|constraint/i))console.warn("No se pudo sincronizar la versión del plan tras guardar el perfil.",e);
      }
    }
  }
  return result;
}
// Progresión automática de nivel (solo sube, nunca baja).
// Umbral: beginner→intermediate si ≥75% sets con RPE≤6 en ≥3 sesiones (últimas 3 semanas, ≥6 sets con RPE);
//         intermediate→advanced si ≥75% sets con RPE≤7 en ≥4 sesiones (últimas 4 semanas, ≥8 sets con RPE).
async function checkAutoLevelProgression(){
  if(!profile||!profile.prefs)return;
  const currentExp=profile.prefs.trainingExperience;
  if(currentExp==="advanced")return;
  const weeksWindow=currentExp==="intermediate"?4:3;
  const minSessions=currentExp==="intermediate"?4:3;
  const minSets=currentExp==="intermediate"?8:6;
  const rpeThreshold=currentExp==="intermediate"?7:6;
  const cutoff=addDays(todayStr(),-weeksWindow*7);
  const days=Object.keys(S.days||{}).filter(ds=>ds>=cutoff&&ds<=todayStr()).sort();
  const sessions=[];
  for(const ds of days){
    const execution=S.days[ds]&&S.days[ds].workoutExecution;
    if(!execution||!Array.isArray(execution.steps))continue;
    const sets=[];
    for(const step of execution.steps){
      if(step.type!=="strength"||!Array.isArray(step.sets))continue;
      for(const set of step.sets){
        if(set&&set.done&&set.rpe!=null&&Number.isFinite(Number(set.rpe))){
          sets.push(Number(set.rpe));
        }
      }
    }
    if(sets.length>=2)sessions.push(sets);
  }
  if(sessions.length<minSessions)return;
  const allSets=sessions.flat();
  if(allSets.length<minSets)return;
  const pctLow=allSets.filter(r=>r<=rpeThreshold).length/allSets.length;
  if(pctLow<0.75)return;
  const nextExp=currentExp==="beginner"?"intermediate":"advanced";
  const prefs={...profile.prefs,trainingExperience:nextExp,workoutSplit:undefined};
  const result=await saveProfilePrefs(prefs,{source:"auto_level",reason:`RPE sostenido ≤${rpeThreshold} en ${sessions.length} sesiones`});
  if(!result||result.error)return;
  toast(`Nivel actualizado a ${TRAINING_EXPERIENCE_LABELS[nextExp]} 🎉`);
}

  try{
    const ref=new URL(supaUrlFrom(effectiveSettings().supaUrl)).hostname.split(".")[0];

async function signOutUser(button){
  if(_signOutBusy)return;
  _signOutBusy=true;
  if(button){button.disabled=true;button.textContent="Cerrando sesión…";}
  // Intentar vaciar cola antes de limpiar la sesión (máx 5 s)
  await Promise.race([drainSyncQueue(),new Promise(r=>setTimeout(r,5000))]);
  const client=supa;
  clearSignedOutState();

    if(client){
      const result=await Promise.race([
        client.auth.signOut({scope:"local"}),
        new Promise((_,reject)=>setTimeout(()=>reject(new Error("Tiempo de espera agotado")),8000)),
      ]);
      if(result&&result.error)throw result.error;
    }
  }catch(e){
    clearStoredAuthSession(client);

  }finally{_signOutBusy=false;}
}

async function dbLoad(){
  if(!supa){DB.error="no-config";return;}
  try{
    const [a,b,c,d,e,f]=await Promise.all([
      supa.from("ingredients").select("*"),
      supa.from("dishes").select("*"),
      supa.from("dish_ingredients").select("*"),
      supa.from("diets").select("*"),
      supa.from("diet_dishes").select("*"),
      supa.from("exercises").select("*"),
    ]);
    for(const r of [a,b,c,d,e]) if(r.error) throw r.error;
    DB.ingredients=a.data||[];DB.dishes=b.data||[];DB.dishIng=c.data||[];DB.diets=d.data||[];DB.dietDishes=e.data||[];
    if(f.error){
      DB.exercises=LOCAL_EXERCISES.map(x=>({...x}));
      DB.exerciseReady=false;
      DB.exerciseError=(f.error&&f.error.message)||String(f.error);
    }else{
      DB.exercises=f.data||[];
      DB.exerciseReady=true;
      DB.exerciseError=null;
    }
    DB.byName={};DB.dishes.forEach(x=>{DB.byName[x.name]=x;});
    DB.ingredients.sort((x,y)=>(x.category||"").localeCompare(y.category||"")||x.name.localeCompare(y.name));
    DB.dishes.sort((x,y)=>(x.slot||"").localeCompare(y.slot||"")||x.name.localeCompare(y.name));
    DB.diets.sort((x,y)=>(x.code||"").localeCompare(y.code||""));
    DB.exercises.sort((x,y)=>(x.discipline||"").localeCompare(y.discipline||"")||x.name.localeCompare(y.name));
    DB.loaded=true;DB.error=null;
  }catch(e){DB.loaded=false;DB.error=(e&&e.message)||String(e);}
}

/* ---- Historial de ciclos + foto de progreso personal ---- */
async function compressProgressPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=url;});
    const maxSide=1600,scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);
    return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("No se pudo procesar la foto.")),"image/jpeg",.84));
  }finally{URL.revokeObjectURL(url);}
}
async function uploadProgressPhoto(file,cycleNo){
  if(!supa||!uid())throw new Error("Inicia sesión para guardar la foto.");
  if(!hasCurrentConsent("progress_photos"))throw new Error("Autoriza las fotos de progreso personal antes de guardar.");
  let blob;
  try{blob=await compressProgressPhoto(file);}catch(e){blob=file;}
  const path=`${uid()}/cycle-${cycleNo}/final-${Date.now()}.${blob.type==="image/jpeg"?"jpg":"img"}`;
  const result=await supa.storage.from("progress-photos").upload(path,blob,{contentType:blob.type||file.type||"image/jpeg",upsert:true});
  if(result.error)throw new Error("No se pudo guardar la foto. Aplica supabase/plan_cycles.sql y vuelve a intentar.");
  return path;
}

function daysBetween(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000);}
function restartNudgeDue(){
  const p=(profile&&profile.prefs)||{};
  if(!hasCompleteOnboarding(p)||onboardingActive)return false;
  const today=todayStr();
  if(today<START||today>END)return false;
  const since=[lastTrainingDate(),START].filter(Boolean).sort().pop();
  if(daysBetween(since,today)<RESTART_NUDGE_DAYS)return false;
  const snoozed=Date.parse(p.restartNudgeDismissedAt||"");
  return !(Number.isFinite(snoozed)&&Date.now()-snoozed<RESTART_NUDGE_SNOOZE_DAYS*86400000);
}

async function pullPlanVersions(){
  PLAN_VERSIONS=[];
  if(!supa||!uid())return false;
  try{
    const result=await supa.from("plan_versions").select("id,user_id,cycle_number,version_number,version_key,source,status,valid_from,valid_to,reason,prompt,model,snapshot_hash,snapshot,activated_at,superseded_at,created_at,updated_at").eq("user_id",uid()).order("cycle_number",{ascending:false}).order("version_number",{ascending:false});
    if(result.error)throw result.error;
    PLAN_VERSIONS=Array.isArray(result.data)?result.data:[];
    PLAN_VERSIONS_LOADED=true;
    PLAN_VERSIONS_ERROR=null;
    return true;
  }catch(e){
    PLAN_VERSIONS=[];
    PLAN_VERSIONS_LOADED=false;
    PLAN_VERSIONS_ERROR=(e&&e.message)||String(e);
    return false;
  }
}

function planVersionVersionNumber(cycleNo){
  return PLAN_VERSIONS.reduce((max,row)=>{
    if(Number(row.cycle_number)===Number(cycleNo))return Math.max(max,Number(row.version_number)||0);
    return max;
  },0)+1;
}

function planVersionActiveForCycle(cycleNo){
  return PLAN_VERSIONS.find(row=>Number(row.cycle_number)===Number(cycleNo)&&row.status==="active")||null;
}

function planVersionSnapshotMatches(row,digest){
  return !!row&&String(row.snapshot_hash||"")===String(digest||"");
}

function resolvePlanVersionIdForDate(ds){
  const row=planVersionForDate(ds);
  return row&&row.id?row.id:null;
}

async function ensurePlanVersion(meta){
  if(!supa||!uid())return null;
  if(!PLAN_VERSIONS_LOADED)await pullPlanVersions();
  const prefs=migrateProfilePrefs((meta&&meta.prefs)||(meta&&meta.profilePrefs)||(profile&&profile.prefs)||{});
  const cycleNo=Math.max(1,Number.parseInt((meta&&meta.cycleNumber)!=null?meta.cycleNumber:prefs.planCycleNumber,10)||cycleNumber());
  const validFrom=validYmd(meta&&meta.validFrom)?meta.validFrom:(validYmd(prefs.planStartDate)?prefs.planStartDate:todayStr());
  const validTo=validYmd(meta&&meta.validTo)?meta.validTo:(validYmd(prefs.planEndDate)?prefs.planEndDate:null);
  const status=(meta&&meta.status)||"active";
  const current=planVersionForDate(validFrom)||planVersionActiveForCycle(cycleNo);
  const explicitTrainingPlan=!!(meta&&Object.prototype.hasOwnProperty.call(meta,"trainingPlan"));
  const explicitNutritionPlan=!!(meta&&Object.prototype.hasOwnProperty.call(meta,"nutritionPlan"));
  if(current&&current.status==="active"&&!explicitTrainingPlan&&!explicitNutritionPlan&&current.snapshot&&current.snapshot.prefs
    &&stableJson(current.snapshot.prefs)===stableJson(planSnapshotFields(prefs))){
    return current;
  }
  const snapshot=planSnapshotDigest(prefs,meta||{});
  if(planVersionSnapshotMatches(current,snapshot.digest)&&current.status==="active"){
    return current;
  }
  const now=new Date().toISOString();
  const versionKey=`${cycleNo}:${validFrom}:${snapshot.digest}`;
  const nextVersionNumber=planVersionVersionNumber(cycleNo);
  if(current&&current.status==="active"&&current.version_key!==versionKey){
    try{
      const sup=await supa.from("plan_versions").update({
        status:"superseded",
        valid_to:validYmd(current.valid_from)&&validFrom>current.valid_from?addDays(validFrom,-1):validFrom,
        superseded_at:now,
        updated_at:now,
      }).eq("id",current.id).eq("user_id",uid()).eq("status","active");
      if(sup.error)throw sup.error;
    }catch(e){
      if(!String((e&&e.message)||e).match(/plan_versions|relation|column|constraint/i))console.warn("No se pudo cerrar la versión anterior del plan.",e);
    }
  }
  try{
    const row={
      user_id:uid(),
      cycle_number:cycleNo,
      version_number:nextVersionNumber,
      version_key:versionKey,
      source:(meta&&meta.source)||"manual",
      status,
      valid_from:validFrom,
      valid_to:validTo,
      reason:(meta&&meta.reason)||null,
      prompt:(meta&&meta.prompt)||null,
      model:(meta&&meta.model)||null,
      snapshot_hash:snapshot.digest,
      snapshot:snapshot.payload,
      activated_at:status==="active"?now:null,
      superseded_at:status==="superseded"?now:null,
      updated_at:now,
    };
    const result=await supa.from("plan_versions").upsert(row,{onConflict:"user_id,version_key"}).select("id,user_id,cycle_number,version_number,version_key,source,status,valid_from,valid_to,reason,prompt,model,snapshot_hash,snapshot,activated_at,superseded_at,created_at,updated_at").maybeSingle();
    if(result.error)throw result.error;
    await pullPlanVersions();
    return planVersionForDate(validFrom)||result.data||null;
  }catch(e){
    if(String((e&&e.message)||e).match(/plan_versions|relation|column|constraint/i)){
      PLAN_VERSIONS_ERROR=(e&&e.message)||String(e);
      console.warn("No se pudo registrar la versión del plan; se mantiene la compatibilidad local.",e);
      return null;
    }
    throw e;
  }
}

function trainingPlanActivationDate(){
  let ds=todayStr()<START?START:todayStr()>END?END:todayStr();
  while(ds<=END&&workoutHasRecordedActivity(S.days[ds]||{}))ds=addDays(ds,1);
  return ds<=END?ds:null;
}

async function createTrainingPlanDraft(plan,prompt){

  const validFrom=trainingPlanActivationDate();
  if(!validFrom)throw new Error("Este ciclo ya no tiene fechas futuras disponibles.");
  if(!PLAN_VERSIONS_LOADED)await pullPlanVersions();

    source:"ia",
    reason:plan.reason||"Plan personalizado según disponibilidad, experiencia y recursos",
    prompt,
    model:effectiveSettings().model||DEFAULT_MODEL,
    trainingPlan:plan,
  };
  const snapshot=planSnapshotDigest(prefs,meta);
  const cycleNo=cycleNumber();
  const versionKey=`${cycleNo}:${validFrom}:training:${snapshot.digest}`;
  const existing=PLAN_VERSIONS.find(row=>row.version_key===versionKey);
  if(existing)return existing;
  const now=new Date().toISOString();
  const row={
    user_id:uid(),
    cycle_number:cycleNo,
    version_number:planVersionVersionNumber(cycleNo),
    version_key:versionKey,

    status:"draft",
    valid_from:validFrom,
    valid_to:END,
    reason:meta.reason,
    prompt,
    model:meta.model,
    snapshot_hash:snapshot.digest,
    snapshot:snapshot.payload,
    activated_at:null,
    superseded_at:null,

  };
  const result=await supa.from("plan_versions").insert(row).select("id,user_id,cycle_number,version_number,version_key,source,status,valid_from,valid_to,reason,prompt,model,snapshot_hash,snapshot,activated_at,superseded_at,created_at,updated_at").single();

async function activateTrainingPlanDraft(versionId){
  if(!supa||!uid())throw new Error("Inicia sesión para activar el plan.");
  if(!PLAN_VERSIONS_LOADED)await pullPlanVersions();
  const draft=PLAN_VERSIONS.find(row=>String(row.id)===String(versionId)&&row.status==="draft");
  if(!draft||!draft.snapshot||!draft.snapshot.trainingPlan)throw new Error("El borrador ya no está disponible.");
  const validFrom=draft.valid_from;
  const currentActive=planVersionActiveForCycle(draft.cycle_number);
  const now=new Date().toISOString();
  try{
    if(currentActive&&String(currentActive.id)!==String(draft.id)){
      const closed=await supa.from("plan_versions").update({
        status:"superseded",
        valid_to:validYmd(currentActive.valid_from)&&validFrom>currentActive.valid_from?addDays(validFrom,-1):validFrom,
        superseded_at:now,
        updated_at:now,
      }).eq("id",currentActive.id).eq("user_id",uid()).eq("status","active");
      if(closed.error)throw closed.error;
    }
    const activated=await supa.from("plan_versions").update({
      status:"active",
      activated_at:now,
      superseded_at:null,
      updated_at:now,
    }).eq("id",draft.id).eq("user_id",uid()).eq("status","draft").select("id").single();
    if(activated.error)throw activated.error;
  }catch(error){
    if(currentActive){
      await supa.from("plan_versions").update({
        status:"active",
        valid_to:currentActive.valid_to||END,
        superseded_at:null,
        updated_at:new Date().toISOString(),
      }).eq("id",currentActive.id).eq("user_id",uid()).eq("status","superseded");
    }
    throw new Error("No se pudo activar el plan sin reemplazar la versión vigente.");
  }
  await pullPlanVersions();
  const active=PLAN_VERSIONS.find(row=>String(row.id)===String(draft.id))||draft;
  try{const p_=(profile&&profile.prefs)||{};trackEvent("training_plan_applied",{duration_weeks:p_.planDurationWeeks||10,sport:p_.primarySport||"gym"});}catch(_){}
  const updates=[];
  Object.keys(S.days||{}).filter(ds=>ds>=validFrom&&ds<=END).forEach(ds=>{
    const state=dayState(ds);
    if(workoutHasRecordedActivity(state))return;
    delete state.workoutOverride;
    state.planVersionId=active.id;
    updates.push(pushDay(ds));
  });
  save();
  if(updates.length)await Promise.all(updates);
  return active;
}

async function backfillDayVersions(){
  if(!supa||!uid()||!PLAN_VERSIONS_LOADED)return false;
  try{
    const result=await supa.from("day_log").select("log_date,plan_version_id").eq("user_id",uid()).gte("log_date",START).lte("log_date",END);
    if(result.error)throw result.error;
    const rows=Array.isArray(result.data)?result.data:[];
    const updates=rows.filter(row=>!row.plan_version_id).map(row=>{
      const planVersionId=resolvePlanVersionIdForDate(row.log_date);
      if(!planVersionId)return null;
      return supa.from("day_log").update({plan_version_id:planVersionId,updated_at:new Date().toISOString()}).eq("user_id",uid()).eq("log_date",row.log_date);
    }).filter(Boolean);
    if(updates.length)await Promise.all(updates);
    return true;
  }catch(e){
    if(!String((e&&e.message)||e).match(/plan_version_id|plan_versions|relation|column/i))console.warn("No se pudo reconciliar la versión del plan en el historial diario.",e);
    return false;
  }
}

/* ---- Registro de consumo en la DB (tabla day_log) ---- */
// Sube el estado del día (comidas marcadas, extras, entreno) a Supabase.
async function pushDay(ds){
  if(!supa||!ds||!uid())return;
  const state={...(S.days[ds]||{})};
  prepareDayStateForSync(state);
  const planVersionId=state.planVersionId||resolvePlanVersionIdForDate(ds);
  if(planVersionId)state.planVersionId=planVersionId;
  const payload={user_id:uid(),log_date:ds,state,plan_version_id:planVersionId||null,updated_at:new Date().toISOString()};
  if(!navigator.onLine){enqueueMutation("day_log",ds,payload);return;}
  try{
    const result=await supa.from("day_log").upsert(payload,{onConflict:"user_id,log_date"});
    if(result.error&&String((result.error&&result.error.message)||result.error).match(/plan_version_id|column/i)){
      const{plan_version_id:_,...compat}=payload;
      await supa.from("day_log").upsert(compat,{onConflict:"user_id,log_date"});
    }else if(result.error)throw result.error;
    // REQ-186: no reemplazar S.days[ds] con la copia enviada: si el día cambió
    // mientras viajaba (p. ej. serie hecha → descanso), esa copia es vieja y
    // borraría el cambio más nuevo. commitDay() ya normalizó el estado local.
    if(planVersionId&&S.days[ds]&&!S.days[ds].planVersionId){S.days[ds].planVersionId=planVersionId;save();}
    _rememberRemoteVersion("day_log",ds,payload.updated_at,payload);
    _dequeueMutation("day_log",ds);
  }catch(e){enqueueMutation("day_log",ds,payload);}
}
// Baja el estado de un día desde Supabase. Si hay mutaciones pendientes en la cola,
// el estado local es la autoridad y no se sobreescribe con el estado del servidor.
async function pullDay(ds){
  if(!supa||!ds||!uid())return false;
  if(_hasPendingDay(ds))return true; // estado local autoridad mientras pendiente
  const seq=_dayCommitSeq[ds]||0;
  try{
    let r=await supa.from("day_log").select("state,plan_version_id,updated_at").eq("user_id",uid()).eq("log_date",ds).maybeSingle();
    if((_dayCommitSeq[ds]||0)!==seq)return true; // cambió mientras leíamos: manda lo local
    if(r.error&&String((r.error&&r.error.message)||r.error).match(/plan_version_id|column/i))r=await supa.from("day_log").select("state,updated_at").eq("user_id",uid()).eq("log_date",ds).maybeSingle();
    if(!r.error&&r.data&&r.data.state&&typeof r.data.state==="object"){
      const state={...r.data.state};
      prepareDayStateForSync(state);
      const planVersionId=r.data.plan_version_id||state.planVersionId||resolvePlanVersionIdForDate(ds)||null;
      if(planVersionId&&!state.planVersionId)state.planVersionId=planVersionId;
      S.days[ds]=state;save();
      _rememberRemoteVersion("day_log",ds,r.data.updated_at,{user_id:uid(),log_date:ds,state,plan_version_id:planVersionId,updated_at:r.data.updated_at});
      if(!r.data.plan_version_id&&planVersionId)backfillDayVersions();
      return true;
    }
  }catch(e){}
  return false;
}
// Baja TODOS los días del usuario. Días con mutaciones pendientes en la cola se omiten
// para preservar los cambios offline hechos en este dispositivo.
async function pullAllDays(){
  if(!supa||!uid())return;
  const seqs={..._dayCommitSeq};
  try{
    let r=await supa.from("day_log").select("log_date,state,plan_version_id,updated_at").eq("user_id",uid()).gte("log_date",START).lte("log_date",END);
    if(r.error&&String((r.error&&r.error.message)||r.error).match(/plan_version_id|column/i))r=await supa.from("day_log").select("log_date,state,updated_at").eq("user_id",uid()).gte("log_date",START).lte("log_date",END);
    if(!r.error&&Array.isArray(r.data)){
      r.data.forEach(row=>{
        if(_hasPendingDay(row.log_date))return; // preservar cambios offline pendientes
        if((_dayCommitSeq[row.log_date]||0)!==(seqs[row.log_date]||0))return; // REQ-186
        if(row.state&&typeof row.state==="object"){
          const state={...row.state};
          prepareDayStateForSync(state);
          const planVersionId=row.plan_version_id||state.planVersionId||resolvePlanVersionIdForDate(row.log_date)||null;
          if(planVersionId&&!state.planVersionId)state.planVersionId=planVersionId;
          S.days[row.log_date]=state;
          _rememberRemoteVersion("day_log",row.log_date,row.updated_at,{user_id:uid(),log_date:row.log_date,state,plan_version_id:planVersionId,updated_at:row.updated_at});
        }
      });
      save();
      await backfillDayVersions();
    }
  }catch(e){}
}
// REQ-186: cuenta los cambios locales por día; una lectura remota que empezó
// antes de un cambio no debe pisarlo al llegar.
const _dayCommitSeq={};
// Guarda local + sube a la DB (usar tras cualquier cambio del día).
function commitDay(ds){
  _dayCommitSeq[ds]=(_dayCommitSeq[ds]||0)+1;
  const st=dayState(ds);
  prepareDayStateForSync(st);
  const planVersionId=st.planVersionId||resolvePlanVersionIdForDate(ds);
  if(planVersionId)st.planVersionId=planVersionId;
  if(DOMAIN_CONTRACTS.validateDayLogState){
    const v=DOMAIN_CONTRACTS.validateDayLogState(st);
    if(!v.ok)console.warn("[domain] dayLog state inválido en",ds,":",v.errors);
  }
  save();
  pushDay(ds);
}

function syncDay(ds){if(supa)pullDay(ds).then(ok=>{if(ok&&(view==="hoy"||view==="nutricion"||view==="entreno")&&current===ds)render();});}

// kg es NOT NULL: sin peso no hay fila (el % grasa acompaña al peso).
// Las inserciones de peso se encolan cuando no hay red; las eliminaciones son last-write-wins.
async function pushWeight(week,kg,bf){
  if(!supa||!uid())return;
  const payload={user_id:uid(),cycle_start:START,week,kg:(kg==null?null:kg),bf_pct:(bf==null?null:bf),updated_at:new Date().toISOString()};
  if(!navigator.onLine){if(kg!=null)enqueueMutation("weight_log","w"+week,payload);return;}
  try{
    const result=kg==null
      ?await supa.from("weight_log").delete().eq("user_id",uid()).eq("cycle_start",START).eq("week",week)
      :await supa.from("weight_log").upsert(payload,{onConflict:"user_id,cycle_start,week"});
    if(result.error&&cycleNumber()===1){
      if(kg==null)await supa.from("weight_log").delete().eq("user_id",uid()).eq("week",week);
      else await supa.from("weight_log").upsert({user_id:uid(),week,kg,bf_pct:(bf==null?null:bf),updated_at:payload.updated_at},{onConflict:"user_id,week"});
    }else if(result.error)throw result.error;
    if(kg!=null)_rememberRemoteVersion("weight_log","w"+week,payload.updated_at,payload);
    _dequeueMutation("weight_log","w"+week);
  }catch(e){if(kg!=null)enqueueMutation("weight_log","w"+week,payload);}
}
async function pullWeights(){
  if(!supa||!uid())return false;
  try{
    let r=await supa.from("weight_log").select("week,kg,bf_pct,updated_at,cycle_start").eq("user_id",uid()).eq("cycle_start",START);
    if(r.error&&cycleNumber()===1)r=await supa.from("weight_log").select("week,kg,bf_pct,updated_at").eq("user_id",uid());
    if(!r.error&&Array.isArray(r.data)){
      const w={...(S.weights||{})};
      const remoteWeeks=new Set();
      r.data.forEach(x=>{
        remoteWeeks.add(String(x.week));
        if(_hasPendingWeight(x.week))return;
        w[x.week]={kg:Number(x.kg),bf:(x.bf_pct==null?null:Number(x.bf_pct))};
        _rememberRemoteVersion("weight_log","w"+x.week,x.updated_at,{user_id:uid(),cycle_start:x.cycle_start||START,week:x.week,kg:x.kg,bf_pct:x.bf_pct,updated_at:x.updated_at});
      });
      Object.keys(w).forEach(week=>{if(!remoteWeeks.has(String(week))&&!_hasPendingWeight(week))delete w[week];});
      S.weights=w;save();return true;
    }
  }catch(e){}
  return false;
}

function ingById(id){return DB.ingredients.find(x=>x.id===id);}
function macrosFromLines(lines){let t={kcal:0,p:0,c:0,f:0};lines.forEach(l=>{const i=ingById(+l.ingredient_id);if(!i||l.grams==null)return;const g=(+l.grams)/100;t.kcal+=i.kcal*g;t.p+=i.protein_g*g;t.c+=i.carbs_g*g;t.f+=i.fat_g*g;});return{kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f)};}
function dishMacros(dishId){return macrosFromLines(DB.dishIng.filter(x=>x.dish_id===dishId));}

async function grantCourtesy(userId,btn){
  if(btn){btn.disabled=true;btn.textContent="Otorgando…";}
  const planId=($("#courtesyPlan")&&$("#courtesyPlan").value)||"monthly";
  const days=Math.max(1,Math.min(365,+($("#courtesyDays")&&$("#courtesyDays").value)||30));
  const notes=($("#courtesyNotes")&&$("#courtesyNotes").value.trim())||"";
  const token=session&&session.access_token;
  if(!token){toast("Sesión requerida");if(btn){btn.disabled=false;btn.textContent="Otorgar acceso";}return;}
  try{
    const r=await fetch("/api/entitlement",{
      method:"POST",
      headers:{"content-type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({action:"grant",userId,planId,days,notes})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||"No se pudo otorgar el acceso.");
    closeModal();toast("Acceso de cortesía otorgado por "+days+" días");
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Otorgar acceso";}
    toast(String(e.message||e));
  }
}

async function prepareAdminTestUser(enterAfter){
  const email=$("#adminTestEmail").value.trim().toLowerCase();
  const password=$("#adminTestPwd").value;
  const confirmPassword=$("#adminTestPwdConfirm").value;
  const out=$("#adminTestOut");
  if(!email||!email.includes("@")){out.textContent="Escribe un correo válido.";return;}
  if(password.length<8){out.textContent="Usa una contraseña de al menos 8 caracteres.";return;}
  if(password!==confirmPassword){out.textContent="Las contraseñas no coinciden.";return;}
  if(!confirm(`¿Reiniciar ${email} como usuario nuevo? Se borrarán todos sus datos de prueba.`))return;
  const buttons=[$("#adminTestPrepareBtn"),$("#adminTestEnterBtn")].filter(Boolean);
  buttons.forEach(button=>button.disabled=true);
  out.textContent="Preparando cuenta…";
  try{
    const result=await adminApi("prepareTestUser",{email,password});
    if(!enterAfter){
      out.innerHTML=`<b>Cuenta ${result.created?"creada":"reiniciada"}.</b><br>Ya puede entrar con el correo y contraseña indicados y comenzará desde onboarding.`;
      buttons.forEach(button=>button.disabled=false);
      return;
    }
    closeModal();
    await signOutUser();
    const signed=await signIn(email,password);
    if(signed.error)throw signed.error;
    const sessionResult=await supa.auth.getSession();
    session=(sessionResult.data&&sessionResult.data.session)||null;
    if(!session)throw new Error("La cuenta se preparó, pero no se pudo iniciar sesión automáticamente.");
    await onAuth();
    toast("Usuario de prueba listo");
  }catch(e){
    if(enterAfter)toast(e.message);
    else if(out)out.textContent="⚠️ "+e.message;
    buttons.forEach(button=>button.disabled=false);
  }
}

function exerciseTextList(value){
  return String(value||"").split(/\n|,/).map(x=>x.trim()).filter(Boolean);

function validateExerciseRecord(exercise){
  const issues=[];
  const requiredText=["slug","name","discipline","level","movement_pattern","start_position","breathing","regression","progression","media_key","static_key","source_name","license_name"];
  requiredText.forEach(key=>{if(!String(exercise&&exercise[key]||"").trim())issues.push(key);});
  ["steps","common_errors","safety_signals","contraindications"].forEach(key=>{if(!exerciseArray(exercise&&exercise[key]).length)issues.push(key);});
  // La media servida debe vivir en almacenamiento propio (Supabase Storage), no en hotlinks externos (REQ-15).
  const mediaUrls=[exercise&&exercise.media_url,exercise&&exercise.poster_url].concat(exerciseArray(exercise&&exercise.frames)).map(u=>String(u||"").trim()).filter(Boolean);
  if(mediaUrls.some(u=>/^https?:\/\//i.test(u)&&!u.includes("/storage/v1/object/")))issues.push("media externa (hotlink)");
  return issues;
}

function filterExerciseCards(){
  const q=($("#exf_q")&&$("#exf_q").value||"").trim().toLowerCase();
  const discipline=($("#exf_discipline")&&$("#exf_discipline").value)||"";
  const place=($("#exf_place")&&$("#exf_place").value)||"";
  const level=($("#exf_level")&&$("#exf_level").value)||"";
  const equipment=($("#exf_equipment")&&$("#exf_equipment").value||"").trim().toLowerCase();
  const limitation=($("#exf_limitation")&&$("#exf_limitation").value||"").trim().toLowerCase();
  document.querySelectorAll("#exerciseAdminList .exercise-card").forEach(card=>{
    const ex=exerciseBySlug(card.dataset.exercise,true);
    if(!ex)return;
    const searchable=[ex.name,...exerciseArray(ex.aliases)].join(" ").toLowerCase();
    const equipmentText=exerciseArray(ex.equipment).join(" ").toLowerCase();
    const contraindications=exerciseArray(ex.contraindications).join(" ").toLowerCase();
    const visible=(!q||searchable.includes(q))
      &&(!discipline||ex.discipline===discipline)
      &&(!place||exerciseArray(ex.places).includes(place))
      &&(!level||ex.level===level)
      &&(!equipment||equipmentText.includes(equipment))
      &&(!limitation||!contraindications.includes(limitation));
    card.style.display=visible?"":"none";
  });
}

function foodsDiets(){
  const dayNames=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const admin=isAdmin();
  let html=admin?`<button class="btn btn-accent" style="width:100%;margin-bottom:10px" onclick="editDiet(null)">＋ Nueva dieta</button>`:"";
  if(!DB.diets.length)return html||'<div class="muted small">Sin dietas.</div>';
  DB.diets.forEach(dt=>{
    const items=DB.dietDishes.filter(x=>x.diet_id===dt.id).sort((a,b)=>{
      const wa=a.weekday===null||a.weekday===undefined?7:(a.weekday+6)%7;
      const wb=b.weekday===null||b.weekday===undefined?7:(b.weekday+6)%7;
      return wa-wb||(a.slot||"").localeCompare(b.slot||"");
    });
    const seen=new Set(),dupes=new Set();
    items.forEach(it=>{const k=(it.weekday===null||it.weekday===undefined?"-":it.weekday)+":"+it.slot;if(seen.has(k))dupes.add(k);seen.add(k);});
    let sum={kcal:0,p:0},n=0;
    const rows=items.map(it=>{
      const dish=DB.dishes.find(x=>x.id===it.dish_id);
      const m=dish?dishMacros(dish.id):{kcal:0,p:0};
      if(dish){sum.kcal+=m.kcal;sum.p+=m.p;n++;}
      const slotWarn=dish&&dish.slot&&it.slot&&dish.slot!==it.slot;
      const wkKey=(it.weekday===null||it.weekday===undefined?"-":it.weekday)+":"+it.slot;
      const isDupe=dupes.has(wkKey);
      const dayLabel=it.weekday===null||it.weekday===undefined?"Cualquier día":dayNames[it.weekday];
      return `<div class="wk-day"${admin?` style="cursor:pointer" onclick="editDietDish(${dt.id},${it.id})"`:''}>
        <div class="wk-left">
          <div class="d">${dayLabel} <span class="muted small">${esc(it.slot||"")}</span>${slotWarn?' <span class="pill" style="background:var(--terra-dim);color:var(--terra-200)">slot</span>':''}${isDupe?' <span class="pill" style="background:var(--bad);color:#fff">dup</span>':''}</div>
          <div class="m">${dish?esc(dish.name):'<span class="muted">Plato eliminado</span>'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="center"><div style="font-weight:600">${m.kcal||""}</div><div class="muted small">${m.p?"P"+m.p:""}</div></div>
          ${admin?`<button class="btn btn-sm" style="color:var(--terra-300);flex-shrink:0" onclick="event.stopPropagation();deleteDietDish(${it.id})">✕</button>`:''}
        </div>
      </div>`;
    }).join("");
    const avgInfo=n?` · promedio ${Math.round(sum.kcal/n)} kcal / P ${Math.round(sum.p/n)} g`:"";
    html+=
      `<div class="row between" style="align-items:center;margin-top:12px">`+
        `<div class="section-h" style="margin:0">${esc(dt.name)}</div>`+
        (admin?`<button class="btn btn-sm" onclick="editDiet(${dt.id})">Editar</button>`:'')+
      `</div>`+
      `<div class="muted small" style="margin:2px 2px 8px">${esc(dt.description||"")}${avgInfo}</div>`+
      rows+
      (admin?`<button class="btn btn-sm" style="width:100%;margin:6px 0 12px" onclick="editDietDish(${dt.id},null)">＋ Agregar asignación</button>`:"");
  });
  return html||'<div class="muted small">Sin dietas.</div>';
}

function editDietDish(dietId,id){
  if(!DB.dishes.length){toast("Agrega platos primero");return;}
  const it=id?DB.dietDishes.find(x=>x.id===id):{diet_id:dietId,dish_id:DB.dishes[0].id,weekday:1,slot:"almuerzo"};
  const dietName=(DB.diets.find(d=>d.id===dietId)||{}).name||"";
  window._dietDish={id,dietId};

    .map(([n,v])=>`<option value="${v}" ${v===it.weekday?"selected":""}>${n}</option>`).join("");
  const noDay=`<option value="" ${it.weekday===null||it.weekday===undefined?"selected":""}>Cualquier día</option>`;
  const slots=NUTRITION_CATALOG_SLOT_OPTIONS;
  const dishOpts=DB.dishes.map(d=>`<option value="${d.id}" ${d.id===it.dish_id?"selected":""}>${esc(d.name)} · ${esc(dishSlotMeta(d))}</option>`).join("");

    `<div class="field"><label for="dd_slot">Slot</label><select id="dd_slot">${slots.map(s=>`<option ${s===(it.slot||"almuerzo")?"selected":""}>${s}</option>`).join("")}</select></div>`+
    `<div class="field"><label for="dd_dish">Plato</label><select id="dd_dish">${dishOpts}</select></div>`+
    `<button class="btn btn-accent" style="width:100%;margin-top:8px" onclick="saveDietDish()">Guardar</button>`+
    (id?`<button class="btn" style="width:100%;margin-top:8px" onclick="deleteDietDish(${id})">Quitar asignación</button>`:""));
}
async function saveDietDish(){
  const dietId=window._dietDish.dietId;
  const id=window._dietDish.id;
  const dayRaw=$("#dd_day").value;
  const weekday=dayRaw===""?null:+dayRaw;
  const slot=$("#dd_slot").value;
  const dish_id=+$("#dd_dish").value;
  if(!dish_id){toast("Selecciona un plato");return;}
  const dup=DB.dietDishes.find(x=>x.diet_id===dietId&&x.weekday===weekday&&x.slot===slot&&(!id||x.id!==id));
  if(dup){
    const dupDish=DB.dishes.find(d=>d.id===dup.dish_id);
    if(!confirm(`Ya existe "${dupDish?dupDish.name:"otro plato"}" en ese día/slot. ¿Reemplazar?`))return;
    const del=await supa.from("diet_dishes").delete().eq("id",dup.id);
    if(del.error){toast("Error al reemplazar: "+del.error.message);return;}
  }
  const dish=DB.dishes.find(d=>d.id===dish_id);
  if(dish&&!dishSupportsSlot(dish,slot)&&!confirm(`"${dish.name}" no está marcado como compatible con ${slot}. ¿Continuar?`))return;
  const row={diet_id:dietId,dish_id,weekday,slot};
  const res=id?await supa.from("diet_dishes").update(row).eq("id",id):await supa.from("diet_dishes").insert(row);
  if(res.error){toast("Error: "+res.error.message);return;}
  closeModal();await dbLoad();render();toast("Asignación guardada");
}
async function deleteDietDish(id){
  if(!confirm("¿Quitar esta asignación de la dieta?"))return;
  const res=await supa.from("diet_dishes").delete().eq("id",id);
  if(res.error){toast("No se pudo: "+res.error.message);return;}
  if(typeof closeModal==="function")closeModal();
  await dbLoad();render();toast("Quitada");
}

   ============================================================ */
const CHECKIN_MAX_KCAL_ADJUST=200;  // límite absoluto por semana
const CHECKIN_MIN_KCAL=1200;        // mínimo seguro

function getWeeklyCheckins(){
  return Array.isArray(profile&&profile.prefs&&profile.prefs.weeklyCheckins)
    ?profile.prefs.weeklyCheckins:[];
}

// Devuelve {key, num, start, end} si hay check-in pendiente para la semana anterior, o null.
function weeklyCheckinDue(){
  if(!profile||!session||!isActive())return null;
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const calendar=planCalendarForPrefs(prefs);
  const today=todayStr();
  const currentWeek=calendar.weeks.find(w=>today>=w.start&&today<=w.end);
  if(!currentWeek||!currentWeek.num||currentWeek.num<2)return null;
  const dueNum=currentWeek.num-1;
  const dueWeek=calendar.weeks.find(w=>w.num===dueNum);
  if(!dueWeek)return null;
  const key=cycleNumber()+"-w"+dueNum;
  if(getWeeklyCheckins().find(c=>c.wk===key))return null;
  const active=weekDays(dueWeek).some(dayActive);
  return{key,num:dueNum,start:dueWeek.start,end:dueWeek.end,active};
}

// Rango de fechas compacto para el check-in ("23–29 jun" o "29 jun – 5 jul").
function weeklyCheckinRangeLabel(startDs,endDs){
  const s=parseYmd(startDs),e=parseYmd(endDs);
  const sMon=MON[s.getMonth()],eMon=MON[e.getMonth()];
  return sMon===eMon?`${s.getDate()}–${e.getDate()} ${sMon}`:`${s.getDate()} ${sMon} – ${e.getDate()} ${eMon}`;
}

function weeklyCheckinBanner(){
  const due=weeklyCheckinDue();if(!due)return"";
  const body=due.active
    ?"Revisa cómo fue tu semana y recibe ajustes a tu plan para la siguiente."

  return`<div class="ci-banner">
    <div class="section-h" style="margin:0 0 3px">Check-in · Semana ${due.num}</div>
    <div style="font-size:15px;font-weight:600;font-family:var(--font-display)">${weeklyCheckinRangeLabel(due.start,due.end)}</div>
    <div class="muted small" style="margin:5px 0 12px">${body}</div>
    <div class="row" style="gap:8px">
      <button class="btn btn-accent btn-sm" onclick="openWeeklyCheckin()">Iniciar check-in</button>
      <button class="btn btn-sm" onclick="skipWeeklyCheckin('${due.key}')">Omitir esta semana</button>
    </div>
  </div>`;
}
// Acceso discreto al check-in pendiente para vistas que no son Home (evita banner duplicado).
function weeklyCheckinChip(){
  const due=weeklyCheckinDue();if(!due)return"";

}

// Calcula sesiones planificadas/realizadas en la semana y peso previo.
function weeklyCheckinStats(weekStart,weekEnd,weekNum){
  const days=[];let d=weekStart;
  while(d<=weekEnd&&d<=todayStr()){days.push(d);d=addDays(d,1);}
  let planned=0,done=0;
  days.forEach(ds=>{
    const wid=plannedWorkoutId(ds);
    if(wid&&wid!=="descanso")planned++;
    const st=S.days[ds]||{};
    if(workoutHasRecordedActivity(st)||st.workoutDone)done++;
  });
  const prevWeekNum=weekNum>1?weekNum-1:null;
  return{
    sessionsPlanned:planned,sessionsDone:done,
    prevWeight:prevWeekNum?wkg(prevWeekNum):null,
    currentWeight:wkg(weekNum),
  };
}

// Selecciona un valor en la escala 1-5 del check-in.
function ciSel(name,val){

function readCiScale(name){
