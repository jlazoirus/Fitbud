      <textarea id="coachInput" aria-label="Escribe a tu coach" placeholder="Pregunta o cuéntale qué estás comiendo…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();coachSendFromInput();}"
        oninput="this.style.height='42px';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button onclick="coachSendFromInput()" title="Enviar" aria-label="Enviar mensaje"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg></button>
    </div>`:`<div class="muted small">Tu coach por escrito no está disponible ahora; las tarjetas de arriba siguen funcionando.</div>`}`;

function renderCoachMessage(m){
  if(m.role==="summary"){
    return `<div class="coach-msg summary"><div class="chat-bubble">${esc(m.text)}</div></div>`;
  }
  if(m.role==="user"){
    const ts=m.ts?new Date(m.ts).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):"";
    return `<div class="coach-msg user">
      <div class="chat-bubble">${esc(m.text)}</div>
      <div class="chat-meta">${ts}</div>
    </div>`;
  }
  // coach message
  const ts=m.ts?new Date(m.ts).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):"";
  const typeLabel={educativo:"Educativo",propuesta:"Propuesta",aplicado:"Aplicado",fallback:"No disponible"}[m.type||"educativo"]||"";
  const typeCls=m.type||"educativo";
  let actionBar="";
  if(m.accion&&m.type==="propuesta"&&!m._applied){
    const safeMsgId=esc(m.id);
    const decision=canApplyCoachAction(m.accion);
    actionBar=decision.ok
      ?`<div class="coach-action-bar">
        <button class="btn btn-accent btn-sm" onclick="applyCoachAction('${safeMsgId}')">${esc(coachActionButtonText(decision))}</button>
        <button class="btn btn-sm" onclick="dismissCoachAction('${safeMsgId}')">Ignorar</button>
      </div>`
      :`<div class="coach-action-note">${esc(m._blocked||decision.reason)}</div>
        <div class="coach-action-bar"><button class="btn btn-sm" onclick="dismissCoachAction('${safeMsgId}')">Entendido</button></div>`;
  }
  return `<div class="coach-msg coach">
    <div class="chat-bubble">${esc(m.text)}</div>
    <div class="chat-meta"><span class="chat-type ${typeCls}">${typeLabel}</span>${ts}</div>
    ${actionBar}
  </div>`;
}

function dismissCoachAction(msgId){
  const msgs=loadCoachChat();
  const msg=msgs.find(m=>m.id===msgId);
  if(msg){msg.accion=null;saveCoachChat(msgs);renderCoach();}

// avisa antes de continuar. El valor no se pierde (REQ-105 no desmonta los
// campos), pero el usuario debe saber que no quedó guardado.
function profileAccordionGuard(ev,summaryEl){
  const details=summaryEl&&summaryEl.closest("details.pf-accordion");
  if(!details||details.open)return true;
  const openSection=document.querySelector(".pf-accordion[open]");
  if(openSection&&openSection!==details){
    const group=pfSectionGroup(openSection.id);
    if(group&&pfGroupDirty(group)){
      ev.preventDefault();
      if(confirm("Tienes cambios sin guardar en esta sección. Se conservan si vuelves, pero no se guardarán hasta que toques \"Guardar\". ¿Continuar de todas formas?")){
        details.open=true;
      }
      return false;
    }
  }
  return true;
}

function updateTrainingSummary(){
  const duration=$("#pf_duration"),priority=$("#pf_priority"),out=$("#trainingSummary");
  if(!out||!duration||!priority)return;
  const sportValue=$("#pf_sport")?$("#pf_sport").value:"walking";
  const strength=strengthModeFromChoice(normalizeStrengthPlace($("#pf_strength")&&$("#pf_strength").value));
  const dayIds=WEEKDAY_OPTIONS.filter(day=>{const el=$("#pf_day_"+day.value);return el&&el.checked;}).map(day=>day.value);
  const labels=dayIds.map(day=>WEEKDAY_OPTIONS.find(option=>option.value===day).short).join(", ");
  const lc=migrateProfilePrefs((profile&&profile.prefs)||{}).lightCardioEnabled;
  const impact=dayIds.length<MIN_TRAINING_DAYS
    ?`Elige al menos ${MIN_TRAINING_DAYS} días para sostener un plan combinado.`
    :trainingPlanSummary(dayIds.length,sportValue,priority.value,lc,strength);
  out.innerHTML=`<b>${duration.value} semanas · ${dayIds.length} días${labels?" ("+labels+")":""}.</b> ${impact}`;
}
function updateTrainingLocationDefaults(prefix){
  const sport=$("#"+prefix+"_sport")?$("#"+prefix+"_sport").value:"walking";
  const strengthChoice=normalizeStrengthPlace($("#"+prefix+"_strength")&&$("#"+prefix+"_strength").value);
  const strength=strengthModeFromChoice(strengthChoice);
  const priorityEl=$("#"+prefix+"_priority");
  const expEl=$("#"+prefix+"_experience");
  const splitEl=$("#"+prefix+"_split");
  const days=WEEKDAY_OPTIONS.filter(day=>{const el=$("#"+prefix+"_day_"+day.value);return el&&el.checked;}).map(day=>day.value);
  const defaults=defaultTrainingLocations(sport,strength,days,priorityEl&&priorityEl.value,expEl&&expEl.value,splitEl&&splitEl.value,strengthChoice);
  days.forEach(day=>{
    const el=$("#"+prefix+"_location_"+day);
    if(el&&TRAINING_LOCATION_LABELS[defaults[day]])el.value=defaults[day];
  });
}

async function saveProfile(){
  const previous=migrateProfilePrefs((profile&&profile.prefs)||{});
  const draft={...previous};
  const diet=["vegetariano","vegano","sin_huevo","sin_lacteos","sin_gluten","omnivoro"].filter(v=>{const el=$("#pf_diet_"+v);return el&&el.checked;});
  draft.diet=diet;
  readFoodScheduleFields("pf",draft);
  readTrainingFields("pf",draft);
  const trainingError=validateTrainingProfile(draft);
  if(trainingError){toast(trainingError);return;}
  const foodError=validateFoodSchedule(draft);
  if(foodError){toast(foodError);return;}
  const preferenceError=validateFoodPreferences(draft);
  if(preferenceError){toast(preferenceError);return;}
  const planDurationWeeks=draft.planDurationWeeks;
  if(!validPlanDuration(planDurationWeeks)){toast("Elige un plan de 4 o 10 semanas");return;}
  const durationChanged=planDurationWeeks!==resolvedPlanDuration(previous);
  const planStartDate=validYmd(previous.planStartDate)?previous.planStartDate:START;
  const planEndDate=planEndFor(planStartDate,planDurationWeeks);
  const calendarChanged=durationChanged||previous.planStartDate!==planStartDate||previous.planEndDate!==planEndDate;
  const prefs={...previous,
    profileSchemaVersion:PROFILE_SCHEMA_VERSION,
    name:$("#pf_name").value.trim(),
    betweenExerciseRestSeconds:normalizedBetweenExerciseRest($("#pf_between_rest")&&$("#pf_between_rest").value),
    diet,
    mealCount:draft.mealCount,mealTimes:draft.mealTimes,
    eatingWindowStart:draft.eatingWindowStart,eatingWindowEnd:draft.eatingWindowEnd,mainMealIndex:draft.mainMealIndex,
    cookingMinutes:draft.cookingMinutes,foodBudget:draft.foodBudget,repeatPreference:draft.repeatPreference,
    preferredCuisines:checkedValues("pf_cuisine",CUISINE_LABELS),
    preferredPreparations:checkedValues("pf_preparation",PREPARATION_LABELS),
    preferredIngredients:$("#pf_preferred_ingredients").value.trim(),
    preferredDishes:$("#pf_preferred_dishes").value.trim(),
    foodNotes:$("#pf_food_notes").value.trim(),
    allergies:$("#pf_allergies").value.trim(),
    dislikedIngredients:$("#pf_disliked").value.trim(),
    primarySport:draft.primarySport,
    strengthMode:draft.strengthMode,
    strengthPlace:draft.strengthPlace,
    trainType:draft.primarySport,
    trainDays:draft.trainingDays.length,
    trainingDays:draft.trainingDays,
    trainingLocations:draft.trainingLocations,
    sessionMinutes:draft.sessionMinutes,
    equipment:draft.equipment,
    trainingExperience:draft.trainingExperience,
    workoutSplit:draft.trainingExperience==="advanced"?(draft.workoutSplit||undefined):undefined,
    trainingPriority:draft.trainingPriority,
    trainingSafetyMode:draft.trainingSafetyMode,
    preferredTrainingTime:draft.preferredTrainingTime,
    injuries:draft.injuries,
    limitations:draft.limitations,
    avoidMovements:draft.avoidMovements,
    trainPlace:draft.strengthPlace==="outdoor"?"aire_libre":draft.strengthPlace==="home"?"casa":"gym",
    planDurationWeeks,
    planStartDate,
    planEndDate,
  };
  prefs.avoid=[prefs.allergies,prefs.dislikedIngredients].filter(Boolean).join(", ");
  prefs.trainNote=[prefs.injuries,prefs.limitations,prefs.avoidMovements].filter(Boolean).join(". ");
  if(prefs.onboardingEssentialOnly&&!prefs.profileRefinedAt)prefs.profileRefinedAt=new Date().toISOString();
  const result=await saveProfilePrefs(prefs);
  if(result&&result.error){toast("Error: "+result.error.message);return;}
  if(calendarChanged){await upsertActiveCycle();await pullCycleHistory();}
  current=clampDate(current);
  profileClearDirty();
  render();
  toast(durationChanged?`Plan ajustado a ${planDurationWeeks} semanas`:"Preferencias guardadas");
}
async function saveOptionalConsents(){
  const choices={
    progress_photos:$("#pf_consent_photos").checked,
  };
  const now=new Date().toISOString();
  const rows=Object.entries(choices).map(([type,accepted])=>{
    const previous=consentRecord(type);
    return {
      user_id:uid(),
      consent_type:type,
      policy_version:CONSENT_POLICY_VERSION,
      status:accepted?"accepted":"withdrawn",
      accepted_at:accepted?(previous&&previous.status==="accepted"?previous.accepted_at:now):null,
      withdrawn_at:accepted?null:now,
      source:"privacy_center",
      metadata:{legal_review_required:true},
      updated_at:now,
    };
  });
  const result=await supa.from("user_consents").upsert(rows,{onConflict:"user_id,consent_type,policy_version"});
  if(result.error){toast(privacyApiMessage(result.error));return;}
  await loadPrivacyState();
  await pullCycleHistory();
  pfPrivacyClearDirty();
  render();toast("Permisos actualizados");
}
async function privacyRequest(method,body){
  const token=session&&session.access_token;
  if(!token)throw new Error("Vuelve a iniciar sesión.");
  const response=await fetch("/api/privacy",{
    method,
    headers:{"authorization":"Bearer "+token,...(body?{"content-type":"application/json"}:{})},
    body:body?JSON.stringify(body):undefined,
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||("Error "+response.status));
  return data;
}
async function exportPersonalData(button){
  if(button){button.disabled=true;button.textContent="Preparando exportación…";}
  try{
    const data=await privacyRequest("GET");
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;link.download=`evolv-datos-${todayStr()}.json`;
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Exportación descargada");
  }catch(e){toast(isAdmin()?String(e.message||e):"No se pudo preparar la exportación. Intenta de nuevo.");}
  finally{if(button){button.disabled=false;button.textContent="Exportar mis datos";}}
}

  optIn.checked=!!p.email_opt_in;

  const hourEl=document.getElementById("notif_hour");

/* ── Web Push / avisos del dispositivo (REQ-38) ─────────────────────────── */

function urlBase64ToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64);
  return Uint8Array.from(raw,c=>c.charCodeAt(0));
}

function renderPushSection(){
  const el=document.getElementById("pushSection");
  if(!el)return;
  if(!("Notification" in window)||!("serviceWorker" in navigator)||!("PushManager" in window)){
    el.innerHTML='<p class="muted small">Las notificaciones del dispositivo no están disponibles en este navegador. Instala la app (Añadir a pantalla de inicio) para habilitarlas.</p>';
    return;
  }
  const perm=Notification.permission;
  const pushEnabled=!!(notifPrefsCache&&notifPrefsCache.push_opt_in);
  const note='<p class="muted small" style="margin-bottom:10px">Recibe un aviso en este dispositivo antes de que termine el día para no perder tu racha. Usa la misma hora y días configurados arriba. Solo funciona con la app instalada (iOS 16.4+ y Android).</p>';
  if(perm==="denied"){
    el.innerHTML=note+`<div class="alert violet"><b>Avisos bloqueados.</b> Para reactivarlos ve a la configuración de tu navegador y permite las notificaciones para esta app.<br><span class="muted small">iOS: Safari → Configuración del sitio web → Notificaciones. Android: ajustes del navegador → Notificaciones.</span></div>`;
    return;
  }
  if(perm==="default"){
    el.innerHTML=note+`<button class="btn btn-accent" style="width:100%" onclick="requestPushPermission(this)">Activar avisos del dispositivo</button>`;
    return;
  }
  // permission === "granted"
  el.innerHTML=note+`<label class="chip-check" style="display:flex;margin-bottom:6px"><input type="checkbox" id="push_opt_in" ${pushEnabled?"checked":""} onchange="savePushOptIn(this)"><span>Aviso de racha en este dispositivo</span></label><p class="muted small">El aviso se envía una sola vez al día si tienes actividad pendiente.</p>`;
}

async function requestPushPermission(btn){
  if(btn){btn.disabled=true;btn.textContent="Solicitando permiso…";}
  try{
    const perm=await Notification.requestPermission();
    if(perm==="granted"){
      await subscribePush();
      renderPushSection();
      toast("Avisos del dispositivo activados");
    }else{
      renderPushSection();
    }
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Activar avisos del dispositivo";}
    toast("No se pudo activar el aviso del dispositivo");
  }
}

async function subscribePush(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window))return;
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.subscribe({
    userVisibleOnly:true,
    applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  const subJson=sub.toJSON();
  const token=session&&session.access_token;
  if(!token)return;
  const r=await fetch("/api/push-subscribe",{
    method:"POST",
    headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},
    body:JSON.stringify(subJson),
  });
  if(!r.ok)throw new Error("No se pudo guardar la suscripción");
  await _savePushOptInDb(true);
}

async function savePushOptIn(checkbox){
  const enabled=checkbox.checked;
  if(!enabled){
    try{
      if("serviceWorker" in navigator){
        const reg=await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.getSubscription();
        if(sub)await sub.unsubscribe();
      }
      const token=session&&session.access_token;
      if(token){
        await fetch("/api/push-subscribe",{method:"DELETE",headers:{Authorization:"Bearer "+token}});
      }
    }catch(_){}
  }
  await _savePushOptInDb(enabled);
}

async function _savePushOptInDb(enabled){
  if(!supa||!uid())return;
  const tz=(Intl&&Intl.DateTimeFormat?Intl.DateTimeFormat().resolvedOptions().timeZone:null)||
    (profile&&profile.prefs&&profile.prefs.timeZone)||"UTC";
  const row={user_id:uid(),push_opt_in:enabled,timezone:tz,updated_at:new Date().toISOString()};
  const{error}=await supa.from("notification_preferences").upsert(row,{onConflict:"user_id"});
  if(!error){
    notifPrefsCache={...notifPrefsCache,...row};
    toast(enabled?"Avisos del dispositivo activados":"Avisos del dispositivo desactivados");
  }else{
    toast("No se pudo guardar la preferencia");
  }
}

/* ---- Invitación a la beta (REQ-203) ----
   El enlace de invitación (/?codigo=FIT-XXXX-XXXX) guarda el código, abre el
   registro y lo canjea solo al iniciar sesión. Si el correo se confirma en
   otro dispositivo, el código sigue sirviendo a mano en "¿Tienes un código?". */
const INVITE_CODE_KEY="evolv_invite_code";
function captureInviteCode(){
  try{
    const params=new URLSearchParams(location.search);
    const raw=params.get("codigo");
    if(raw===null)return false;
    params.delete("codigo");
    const qs=params.toString();
    history.replaceState(history.state,"",location.pathname+(qs?"?"+qs:"")+location.hash);
    const compact=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(!/^FIT[A-Z0-9]{8}$/.test(compact))return false;
    localStorage.setItem(INVITE_CODE_KEY,"FIT-"+compact.slice(3,7)+"-"+compact.slice(7));
    return true;
  }catch(e){return false;}
}
function pendingInviteCode(){try{return localStorage.getItem(INVITE_CODE_KEY)||"";}catch(e){return "";}}
function clearInviteCode(){try{localStorage.removeItem(INVITE_CODE_KEY);}catch(e){}}
let _inviteRedeeming=false;
// REQ-228: un canje que falló por red se reintenta al volver la conexión, no solo al iniciar sesión.
window.addEventListener("online",()=>{if(session)redeemPendingInvite();});
async function redeemPendingInvite(){
  const code=pendingInviteCode();
  const token=session&&session.access_token;
  if(!code||!token||_inviteRedeeming)return;
  _inviteRedeeming=true;
  try{
    const r=await fetch("/api/entitlement",{
      method:"POST",
      headers:{"content-type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({action:"redeem",code})
    });
    // Sesión vencida o servicio caído: se reintenta en el próximo inicio de sesión.
    if(r.status===401||r.status===404||r.status>=500)return;
    const data=await r.json().catch(()=>({}));
    clearInviteCode();
    if(!r.ok){toast(data.error||"No pudimos activar tu invitación.");return;}
    await loadEntitlement();
    render();
    toast("¡Bienvenido a la beta! Tienes acceso completo por "+couponDurationText(data.entitlement)+".");
  }catch(e){}finally{_inviteRedeeming=false;}
}

// Escalera de n peldaños; los primeros `lit` en lima.
function stairSvg(size,lit,stroke,cls){
  const n=LANDING_STEPS.length,w=size/n;
  const paths=LANDING_STEPS.map((_,i)=>{
    const x=i*w,y0=size-i*w,y1=size-(i+1)*w;
    return `<path class="tr${i<lit?" lit":""}" d="M${x} ${y0}V${y1}H${x+w}"/>`;
  }).join("");
  return `<svg class="${cls||""}" width="${size}" height="${size}" viewBox="${-stroke} ${-stroke} ${size+2*stroke} ${size+2*stroke}" fill="none" stroke-width="${stroke}" stroke-linecap="square" aria-hidden="true">${paths}</svg>`;
}
function landingStairRailHtml(){
  const size=260,w=size/LANDING_STEPS.length;
  const labels=LANDING_STEPS.map((st,i)=>`<button class="l-stair-label" style="left:${Math.round(i*w+4)}px;top:${Math.round(size-(i+1)*w+(i===LANDING_STEPS.length-1?-50:8))}px" onclick="landingGoStep(${i})"${i===0?' aria-current="step"':""}>${st.label}</button>`).join("");
  return `<nav class="l-stair-rail" aria-label="Recorrido de Evolv" data-lit="1">${stairSvg(size,1,6)}${labels}</nav>`;
}
function landingStepsHtml(){
  return LANDING_STEPS.map((st,i)=>`<article class="l-step" id="l-step-${st.id}" data-step="${i}">
      <div class="l-step-text">
        <h3 class="l-step-when">${stairSvg(30,i+1,3,"l-mini-stair")}${st.when}</h3>
        <p class="l-step-lead">${st.lead}</p>
        <p class="l-step-body">${st.body}</p>
      </div>
      <div class="l-step-demo">${st.demo}</div>
    </article>`).join("");
}
function landingGoStep(i){
  const el=document.getElementById("l-step-"+LANDING_STEPS[i].id);if(!el)return;
  const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior:reduced?"auto":"smooth",block:"center"});
}
let _landingStairObserver=null;
function initLandingStair(){
  if(_landingStairObserver){_landingStairObserver.disconnect();_landingStairObserver=null;}
  const rail=document.querySelector("#app .l-stair-rail");
  if(!rail||!("IntersectionObserver" in window))return;
  const setLit=(n)=>{
    rail.dataset.lit=String(n);
    rail.querySelectorAll(".tr").forEach((p,i)=>p.classList.toggle("lit",i<n));
    rail.querySelectorAll(".l-stair-label").forEach((b,i)=>{if(i===n-1)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");});
  };
  _landingStairObserver=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting)setLit(Number(e.target.dataset.step)+1);});
  },{root:document.getElementById("app"),rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("#app .l-step").forEach(el=>_landingStairObserver.observe(el));
}

function landingDemo(kind,btn){

  const key=wasOn?"base":kind;
  if(!wasOn&&btn)btn.setAttribute("aria-pressed","true");
  const d=Object.assign({},LANDING_DEMO.base,LANDING_DEMO[key]);

    const row=box.querySelector(sel);if(!row)return;

function authRedirectUrl(mode){

function authRedirectParams(){
  const params=new URLSearchParams(location.search||"");
  const hash=location.hash&&location.hash[0]==="#"?location.hash.slice(1):location.hash;
  if(hash){
    const hashParams=new URLSearchParams(hash);
    hashParams.forEach((value,key)=>{if(!params.has(key))params.set(key,value);});
  }
  return params;
}

async function finishPasswordRecovery(){
  const pwd=$("#recovery_pwd").value,confirmPwd=$("#recovery_confirm").value,out=$("#recoveryOut");
  if(pwd.length<8){out.textContent="Usa al menos 8 caracteres.";return;}
  if(pwd!==confirmPwd){out.textContent="Las contraseñas no coinciden.";return;}
  if(_recoveryBusy)return;
  _recoveryBusy=true;
  const btn=document.querySelector("#app .dash .btn-accent");
  if(btn)btn.disabled=true;
  out.textContent="Actualizando…";
  try{
    // La sesión del enlace puede haberse perdido (token usado, vencido o
    // consumido por la vista previa del correo): validarla antes de guardar.
    let live=null;
    try{const r=await supa.auth.getSession();live=r&&r.data&&r.data.session;}catch(e){}
    if(!live){
      session=null;
      passwordRecoveryError=passwordRecoveryMode==="invite"
        ?"El enlace de invitación ya se usó o expiró. Si ya creaste tu contraseña, inicia sesión; si no, pide una nueva invitación."
        :"El enlace de recuperación ya se usó o expiró. Pide uno nuevo desde el inicio de sesión.";
      render();
      return;
    }
    const firstLogin=passwordRecoveryMode==="first_login";
    const result=await supa.auth.updateUser(firstLogin?{password:pwd,data:{must_change_password:false}}:{password:pwd});
    if(result.error){
      const m=String(result.error.message||"");

        ?"⚠️ La sesión del enlace se perdió. Pide un enlace nuevo o inicia sesión si ya creaste tu contraseña."
        :"⚠️ "+m;
      if(btn)btn.disabled=false;
      return;
    }
  }finally{_recoveryBusy=false;}
  if(passwordRecoveryMode==="first_login"){
    // Sigue con la misma sesión: no hace falta volver a iniciar sesión.
    try{const r=await supa.auth.getSession();session=(r.data&&r.data.session)||session;}catch(_){}
    if(session&&session.user)session.user.user_metadata={...(session.user.user_metadata||{}),must_change_password:false};
    passwordRecovery=false;passwordRecoveryError="";passwordRecoveryMode="recovery";

    await onAuth();

  }
  if(history&&history.replaceState)history.replaceState({},document.title,location.pathname);
  const invite=passwordRecoveryMode==="invite";
  passwordRecovery=false;
  passwordRecoveryError="";
  passwordRecoveryMode="recovery";
  await signOutUser();
  window._authMode="in";
  toast(invite?"Cuenta activada. Inicia sesión nuevamente.":"Contraseña actualizada. Inicia sesión nuevamente.");
}

let _modalTrigger=null;
function _modalKeyHandler(e){
  if(coachBusy())return; // REQ-175: no cerrar el modal mientras el coach responde
  if(e.key==="Escape"){closeModal();return;}
  if(e.key==="Tab"){
    const sheet=document.querySelector("#overlay .sheet");if(!sheet)return;
    const sel='button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]';
    const focusable=Array.from(sheet.querySelectorAll(sel)).filter(el=>el.offsetParent!==null);
    if(focusable.length<2)return;
    const first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey){if(document.activeElement===first){last.focus();e.preventDefault();}}
    else{if(document.activeElement===last){first.focus();e.preventDefault();}}
  }
}
let _modalOnClose=null;
function modal(html,opts){
  const existing=$("#overlay");
  _modalOnClose=(opts&&typeof opts.onClose==="function")?opts.onClose:null;
  if(!existing)_modalTrigger=document.activeElement;
  let o=existing;
  if(!o){o=document.createElement("div");o.id="overlay";o.className="overlay";o.addEventListener("click",e=>{if(e.target===o)closeModal();});document.body.appendChild(o);}
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="closebar"><button onclick="closeModal()" aria-label="Cerrar">✕</button></div>${html}</div>`;
  const sheet=o.querySelector(".sheet");

  if(h3){h3.id="sheet-title";sheet.setAttribute("aria-labelledby","sheet-title");}
  document.removeEventListener("keydown",_modalKeyHandler);
  document.addEventListener("keydown",_modalKeyHandler);
  setTimeout(()=>{const btn=sheet&&sheet.querySelector(".closebar button");if(btn)btn.focus();},0);
}
function closeModal(){
  const onClose=_modalOnClose;_modalOnClose=null;

}

function applyReplace(ds,id,i,reason){
  const{options}=window._replaceOpts;const o=options[i];const ms=mealState(ds,id);
  const prev=ms.ovr?ms.ovr.name:null;
  ms.ovr={name:o.name,dishName:o.dishName||null,userSet:true};
  if(reason)ms.ovr.contingencyReason=reason;

  const scope=(document.querySelector("input[name='replScope']:checked")||{}).value||"day";
  if(scope==="week"&&reason)propagateMealOverride(ds,id,{...ms.ovr});

}

/* ---- Contingencia: helpers ---- */
function addContingencyEntry(ds,entry){
  const st=dayState(ds);if(!st.contingencyLog)st.contingencyLog=[];
  st.contingencyLog.push(Object.assign({at:new Date().toISOString()},entry));
}
function revertMeal(ds,id){
  const ms=mealState(ds,id);const prev=ms.ovr?ms.ovr.name:null;
  delete ms.ovr;delete ms.subst;
  // Deshacer rebalanceos asociados al último meal_replace de este slot (REQ-83)
  const st=dayState(ds);
  const log=st.contingencyLog||[];
  const lastReplace=[...log].reverse().find(e=>e.type==="meal_replace"&&e.id===id);
  const revertedSlots=[];
  if(lastReplace&&Array.isArray(lastReplace.rebalanced)){
    lastReplace.rebalanced.forEach(r=>{
      if(!r.slot_id)return;
      const fms=mealState(ds,r.slot_id);
      // Solo revertir si la comida futura no fue marcada como hecha después del rebalanceo
      if(fms&&!fms.done){
        if(r.prevOvr)fms.ovr={...r.prevOvr};
        else delete fms.ovr;
        revertedSlots.push(r.slot_id);
      }
    });
  }
  addContingencyEntry(ds,{type:"meal_revert",id,prev,revertedSlots});
  commitDay(ds);render();toast("Comida restaurada al plan"+(revertedSlots.length?` · ${revertedSlots.length} comida${revertedSlots.length>1?"s":""} restablecida${revertedSlots.length>1?"s":""}`:""));
}
function propagateMealOverride(ds,id,ovr){
  const w=weekOf(ds,planPrefsForDate(ds))||weekOf(ds)||(WEEKS&&WEEKS[0]);if(!w)return;
  weekDays(w).filter(d=>d>ds).forEach(d=>{
    const day=buildDay(d);if(!day.meals.find(m=>m.id===id))return;
    const ms=mealState(d,id);if(!ms.done){ms.ovr=Object.assign({},ovr);commitDay(d);}
  });
}
function openMealContingency(ds,id){

const MEAL_OPTION_REROLL_KEY="fitbud_meal_option_rerolls_v1";
function mealOptionRerollStore(){
  try{return JSON.parse(localStorage.getItem(MEAL_OPTION_REROLL_KEY)||"{}")||{};}catch(_){return{};}
}
function saveMealOptionRerollStore(store){
  try{localStorage.setItem(MEAL_OPTION_REROLL_KEY,JSON.stringify(store||{}));}catch(_){}
}
function mealOptionRerollBucket(){
  return `${uid()||"local"}:${todayStr()}`;
}
function mealOptionRerollUsed(){
  const store=mealOptionRerollStore();
  return Math.max(0,Number(store[mealOptionRerollBucket()]||0));
}
function mealOptionRerollRemaining(){
  return Math.max(0,MEAL_OPTION_REROLL_DAILY_LIMIT-mealOptionRerollUsed());
}
function consumeMealOptionReroll(){
  const remaining=mealOptionRerollRemaining();
  if(remaining<=0)return false;
  const store=mealOptionRerollStore();
  const bucket=mealOptionRerollBucket();
  store[bucket]=mealOptionRerollUsed()+1;
  saveMealOptionRerollStore(store);
  return true;
}
function changeMealRerollMeta(){
  return `Quedan ${mealOptionRerollRemaining()} de ${MEAL_OPTION_REROLL_DAILY_LIMIT} hoy`;
}
function changeMealRerollControlsHtml(){
  const disabled=mealOptionRerollRemaining()<=0;
  return `<div class="row between wrap" style="gap:8px;margin-top:8px">
    <button id="chg-reroll" class="btn btn-sm" onclick="rerollChangeMealOptions()" ${disabled?"disabled":""}>Rehacer opciones</button>
    <span id="chg-reroll-meta" class="muted small">${changeMealRerollMeta()}</span>
  </div>`;
}
function updateChangeMealRerollControls(){
  const button=$("#chg-reroll"),meta=$("#chg-reroll-meta");
  if(button)button.disabled=mealOptionRerollRemaining()<=0;
  if(meta)meta.textContent=changeMealRerollMeta();
}
function changeMealCandidatePool(ds,id,excludeSlugs,limit){
  const day=buildDay(ds);const base=day.meals.find(m=>m.id===id);if(!base)return{ranked:null,options:[]};
  const ms=mealState(ds,id);const cv=mealValue(base,ms);
  const excluded=excludeSlugs instanceof Set?excludeSlugs:new Set(excludeSlugs||[]);
  const nd=window.FITBUD_NUTRITION_DOMAIN;
  if(nd&&nd.rankReplacementCandidates&&DB.loaded){
    const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
    const target=effectiveDayTarget();
    const mealTargets=nd.mealSlotTargets?nd.mealSlotTargets(target,prefs,null):null;
    const mealTarget=mealTargets&&mealTargets.find(t=>t.id===id);
    const compatible=nd.compatibleDishesForSlot
      ?nd.compatibleDishesForSlot(id,prefs,DB)
      :DB.dishes.filter(d=>dishSupportsSlot(d,id)&&!coachDishBlockedByProfile(d).blocked);
    if(mealTarget&&compatible.length){
      const candidates=nd.rankReplacementCandidates(cv,compatible,mealTarget.target,DB,prefs);
      const ordered=[
        ...candidates.filter(r=>!excluded.has(r.dish.slug||r.dishSlug||coachKey(r.dish.name))),
        ...candidates.filter(r=>excluded.has(r.dish.slug||r.dishSlug||coachKey(r.dish.name))),
      ];
      const st=dayState(ds);
      return{ranked:ordered.slice(0,limit||12).map(r=>{
        const solv=nd.solveReplacement?nd.solveReplacement(id,r.deltaKcal,day.meals,st):null;
        return{...r,rebalanceNeeded:solv&&solv.rebalanceNeeded,futureMeals:solv&&solv.futureMeals};
      }),options:[]};
    }
  }
  const optionDishes=DB.loaded&&nd&&nd.compatibleDishesForSlot
    ?nd.compatibleDishesForSlot(id,migrateProfilePrefs((profile&&profile.prefs)||{}),DB)
    :(DB.loaded?DB.dishes.filter(d=>dishSupportsSlot(d,id)&&!coachDishBlockedByProfile(d).blocked):[]);
  const options=optionDishes
    .sort((a,b)=>{
      const as=excluded.has(a.slug||coachKey(a.name))?1:0;
      const bs=excluded.has(b.slug||coachKey(b.name))?1:0;
      return as-bs||a.name.localeCompare(b.name);
    })
    .slice(0,limit||12)
    .map(d=>({name:d.name,dishName:d.name}));
  return{ranked:null,options};
}
function changeMealCurrentSlugs(cm){
  const slugs=new Set(cm&&cm.seenSlugs instanceof Set?cm.seenSlugs:[]);
  (cm&&cm.ranked||[]).forEach(r=>{const slug=r&&r.dish&&(r.dish.slug||coachKey(r.dish.name));if(slug)slugs.add(slug);});
  (cm&&cm.options||[]).forEach(o=>{const dish=o.dishName?dishByName(o.dishName):null;const slug=dish&&(dish.slug||coachKey(dish.name));if(slug)slugs.add(slug);});
  return slugs;
}
function dishByCandidateName(name,candidates){
  const exact=dishByName(name);if(exact)return exact;
  const key=coachKey(name);
  return (candidates||[]).find(d=>coachKey(d&&d.name)===key)||null;
}

function _buildChangeMealOpts(cv){
  const{ds:mDs,id,options,ranked}=window._changeMeal;
  const day=buildDay(mDs);const base=day.meals.find(m=>m.id===id);
  const ms=mealState(mDs,id);const cur=cv||mealValue(base,ms);
  // Usar candidatos rankeados cuando están disponibles (REQ-83)
  if(ranked&&ranked.length){
    const st=dayState(mDs);
    return ranked.map((r,i)=>{
      const dk=r.deltaKcal;
      const dkStr=` <span class="muted">(${dk>0?"+":""}${dk} kcal)</span>`;
      const dpStr=r.deltaP!==0?` P${r.deltaP>0?"+":""}${r.deltaP}`:"";
      const rebalInfo=r.rebalanceNeeded&&r.futureMeals&&r.futureMeals.length
        ?`<span class="muted small"> · ajusta ${r.futureMeals.length} comida${r.futureMeals.length>1?"s":""} futura${r.futureMeals.length>1?"s":""}</span>`:"";
      const meta=`${r.macros.kcal} kcal${dkStr}${dpStr}${rebalInfo}`;
      return `<button class="opt" onclick="applyChangeMeal(${i})">${esc(r.dish.name)}<div class="o-meta">${meta}</div></button>`;
    }).join("")||'<p class="muted small">No hay platos compatibles en la base para este espacio.</p>';
  }
  return options.map((o,i)=>{
    const d=o.dishName?dishByName(o.dishName):null;const m=d?dishMacros(d.id):null;
    const dk=m&&cur.kcal?m.kcal-cur.kcal:null;
    const dkStr=dk!=null?` <span class="muted">(${dk>0?"+":""}${dk} kcal)</span>`:"";
    const meta=m?`${m.kcal} kcal · P ${m.p} · C ${m.c} · G ${m.f} g${dkStr}`:"";
    return `<button class="opt" onclick="applyChangeMeal(${i})">${esc(o.name)}<div class="o-meta">${meta}</div></button>`;
  }).join("")||'<p class="muted small">No hay platos en la base para este espacio.</p>';
}
async function rerollChangeMealOptions(){
  const cm=window._changeMeal;if(!cm)return;
  if(mealOptionRerollRemaining()<=0){toast("Ya usaste tus cambios de opciones por hoy");updateChangeMealRerollControls();return;}
  const button=$("#chg-reroll"),opts=$("#chg-opts");
  if(button){button.disabled=true;button.textContent="Buscando…";}
  if(opts)opts.insertAdjacentHTML("afterbegin",`<div class="ai-box" id="chg-reroll-loading">Preparando otras opciones…</div>`);
  consumeMealOptionReroll();
  let wasReused=false;
  try{
    const seen=changeMealCurrentSlugs(cm);
    cm.seenSlugs=seen;
    const fallbackPool=changeMealCandidatePool(cm.ds,cm.id,seen,12);
    const fallbackRanked=fallbackPool.ranked||[];
    const fallbackOptions=fallbackRanked.length
      ?fallbackRanked.slice(0,4).map(r=>({nombre:r.dish.name,kcal:r.macros.kcal,proteina_g:r.macros.p,carbohidratos_g:r.macros.c,grasa_g:r.macros.f}))
      :(fallbackPool.options||[]).slice(0,4).map(o=>{const d=o.dishName?dishByName(o.dishName):null;const m=d?dishMacros(d.id):{kcal:0,p:0,c:0,f:0};return{nombre:o.name,kcal:m.kcal,proteina_g:m.p,carbohidratos_g:m.c,grasa_g:m.f};});
    if(aiAvailable()&&hasEntitlement()&&fallbackOptions.length){
      const requestId=coachRequestId();
      const day=buildDay(cm.ds);const base=day.meals.find(m=>m.id===cm.id);
      const ms=mealState(cm.ds,cm.id);const cur=mealValue(base,ms);
      const candidates=(fallbackRanked.length?fallbackRanked.map(r=>r.dish):fallbackPool.options.map(o=>dishByName(o.dishName)).filter(Boolean));
      const allowedNames=[...new Set(candidates.map(d=>d.name).filter(Boolean))];
      const list=candidates.slice(0,40).map(d=>{const m=dishMacros(d.id);return `${d.name}: ${m.kcal} kcal P${m.p}/C${m.c}/G${m.f}`;}).join("; ");
      const fallback=JSON.stringify({opciones:fallbackOptions});
      const maxKcal=Math.max(cur.kcal||0,...candidates.map(d=>dishMacros(d.id).kcal||0),100);
      const validation=mealOptionValidation(maxKcal,{allowedNames});
      const quota=coachQuota("meal_option",requestId,"change-"+cm.id,fallback,validation,`change:${cm.ds}:${cm.id}:${hashText([...seen].join("|"))}`);
      const prompt=`Para reemplazar la comida "${base.slot}" del ${prettyDate(cm.ds)}, elige 4 platos distintos que respeten el perfil y se parezcan a los macros actuales (${cur.kcal||0} kcal, P ${cur.p||0}, C ${cur.c||0}, G ${cur.f||0}).
Usa SOLO nombres exactos de esta lista de platos candidatos: ${list}.
Evita repetir los platos ya mostrados. Responde SOLO JSON válido:
{"opciones":[{"nombre":"Nombre exacto del plato","kcal":0,"proteina_g":0,"carbohidratos_g":0,"grasa_g":0}]}`;
      try{
        const txt=await callClaude(prompt,600,quota);
        wasReused=lastCoachCallReused;
        const parsed=parseJSON(txt);
        const selected=(parsed&&Array.isArray(parsed.opciones)?parsed.opciones:[])
          .map(o=>dishByCandidateName(o.dishName||o.nombre||o.name,candidates))
          .filter(Boolean);
        // REQ-123: si el cupo de frescas se agotó, el servidor puede reutilizar la
        // misma respuesta de antes; descartamos lo ya visto para no repetir el plato.
        const freshSelected=selected.filter(d=>!seen.has(d.slug||coachKey(d.name)));
        if(freshSelected.length){
          const selectedSlugs=new Set(freshSelected.map(d=>d.slug||coachKey(d.name)));
          const selectedPool=changeMealCandidatePool(cm.ds,cm.id,new Set([...seen].filter(slug=>!selectedSlugs.has(slug))),40);
          if(selectedPool.ranked&&selectedPool.ranked.length){
            const mapped=freshSelected.map(d=>selectedPool.ranked.find(r=>String(r.dish.id)===String(d.id))).filter(Boolean);
            if(mapped.length){cm.ranked=mapped;cm.options=[];}
            else{cm.ranked=fallbackPool.ranked;cm.options=fallbackPool.options;}
          }else{
            cm.ranked=null;
            cm.options=freshSelected.map(d=>({name:d.name,dishName:d.name}));
          }
        }else{
          cm.ranked=fallbackPool.ranked;cm.options=fallbackPool.options;
        }
      }catch(_){
        cm.ranked=fallbackPool.ranked;cm.options=fallbackPool.options;
      }
    }else{
      cm.ranked=fallbackPool.ranked;cm.options=fallbackPool.options;
    }
    const out=$("#chg-opts");if(out)out.innerHTML=_buildChangeMealOpts();
    if(wasReused)toast("Ya usaste tus opciones nuevas de hoy; te mostramos las alternativas más parecidas disponibles.");
  }finally{
    const loading=$("#chg-reroll-loading");if(loading)loading.remove();
    if(button)button.textContent="Rehacer opciones";

function applyChangeMeal(i){
  const{ds,id,options,reason,ranked}=window._changeMeal;
  const day=buildDay(ds);const base=day.meals.find(m=>m.id===id);
  const ms=mealState(ds,id);
  const prevName=ms.ovr?ms.ovr.name:(base&&base.name)||null;
  const prevKcal=mealValue(base||{},ms).kcal||0;
  // Determinar comida nueva: usar candidato rankeado si existe, si no el listado simple
  const ranked_item=ranked&&ranked[i];
  const o=ranked_item?{name:ranked_item.dish.name,dishName:ranked_item.dish.name}:options[i];
  if(!o)return;
  const newOvr={name:o.name,dishName:o.dishName||null,gen:true,userSet:true};
  if(reason)newOvr.contingencyReason=reason;
  if(ranked_item&&ranked_item.macros){
    newOvr.kcal=ranked_item.macros.kcal;
    newOvr.p=ranked_item.macros.p;
    newOvr.c=ranked_item.macros.c;
    newOvr.f=ranked_item.macros.f;
    if(ranked_item.ingredients&&ranked_item.ingredients.length){
      newOvr.ingredientes=ranked_item.ingredients.map(({nombre,gramos,ingredientSlug,kcal,proteina_g,carbohidratos_g,grasa_g})=>
        ({nombre,gramos,ingredientSlug,kcal,proteina_g,carbohidratos_g,grasa_g}));
    }
  }
  ms.ovr=newOvr;
  // Rebalanceo de comidas futuras (REQ-83) — conectado a finalizeNutritionDay()
  // (REQ-142): la comida cambiada y todo lo demás quedan lockedMeals, las
  // futuras candidatas entran como proposal (conservan plato) y
  // globalClosePass() dentro de finalizeNutritionDay() cierra el día completo
  // en vez de repartir -deltaKcal/n de forma proporcional.
  const rebalanced=[];
  const nd=window.FITBUD_NUTRITION_DOMAIN;
  if(ranked_item&&ranked_item.rebalanceNeeded&&ranked_item.futureMeals&&ranked_item.futureMeals.length&&nd&&nd.rebalanceFutureMeals){
    const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
    const target=effectiveDayTarget();
    const futureIds=new Set(ranked_item.futureMeals.map(fm=>fm.id));
    const futureCurrent=new Map(ranked_item.futureMeals.map(fm=>{
      const m=day.meals.find(x=>x.id===fm.id);
      return[fm.id,m?mealEntryForFinalize(m,mealState(ds,fm.id)):null];
    }).filter(([,entry])=>entry));
    const lockedMeals=[
      ...day.meals.filter(m=>m.id!==id&&!futureIds.has(m.id)).map(m=>mealEntryForFinalize(m,mealState(ds,m.id))),
      mealEntryForFinalize(base,ms),
    ];
    const futureProposal=[...futureCurrent.values()];
    const finalized=nd.finalizeNutritionDay&&DB.loaded
      ?finalizeDayWithGate(ds,day,target,prefs,futureProposal,{lockedMeals})
      :null;
    if(finalized&&Array.isArray(finalized.comidas)){
      ranked_item.futureMeals.forEach(fm=>{
        const solved=finalized.comidas.find(c=>c.slot_id===fm.id);
        const fms=mealState(ds,fm.id);
        const prevOvr=fms.ovr?{...fms.ovr}:null;
        const prevEntry=futureCurrent.get(fm.id);
        if(solved){
          fms.ovr={
            name:solved.nombre,dishName:solved.nombre,gen:true,nutritionPlan:true,
            kcal:solved.kcal,p:solved.proteina_g,c:solved.carbohidratos_g,f:solved.grasa_g,
            ingredientes:solved.ingredientes,
          };
        }
        const adjustKcal=solved&&prevEntry?Math.round(solved.kcal-prevEntry.kcal):0;
        rebalanced.push({slot_id:fm.id,slot:fm.slot,adjustKcal,prevOvr,applied:!!solved});
      });
    }else{
      // Capa de compatibilidad si finalizeNutritionDay() no está disponible.
      const adjustments=nd.rebalanceFutureMeals(ranked_item.futureMeals,ranked_item.deltaKcal,target,prefs,DB);
      adjustments.forEach(adj=>{
        const fms=mealState(ds,adj.slot_id);
        const prevOvr=fms.ovr?{...fms.ovr}:null;
        if(adj.newOvr){fms.ovr={...adj.newOvr};}
        rebalanced.push({slot_id:adj.slot_id,slot:adj.slot,adjustKcal:adj.adjustKcal,prevOvr,applied:!!adj.newOvr});
      });
    }
  }
  addContingencyEntry(ds,{
    type:"meal_replace",id,reason:reason||null,
    prev:{name:prevName,kcal:prevKcal},
    chosen:{name:o.name,kcal:ranked_item&&ranked_item.macros&&ranked_item.macros.kcal||null},

}

function openWorkoutContingency(ds,reason){
  if(trainingSafetyHold()){toast("El entrenamiento está pausado por seguridad");return;}
  const execution=normalizedWorkoutExecution(ds);
  if(execution||dayState(ds).workoutDone){toast("La sesión registrada conserva el entrenamiento ejecutado");return;}
  const ew=effectiveWorkout(ds);const allOpts=workoutOptions(ds);
  const titles={tiempo:"Solo tengo poco tiempo",casa:"Hoy entreno en casa",equipo:"Sin acceso al equipo"};
  const hints={tiempo:"Elige la sesión más eficiente o descansa activamente.",casa:"Elige una opción que puedas hacer en casa.",equipo:"Opciones sin equipamiento especializado."};
  let filtered=allOpts;

function perPortion(v){
  const k=+(v&&v.portion);
  if(!(k>0&&k!==1))return v;
  // REQ-270: una porción de la fuente; la base se conserva y la cantidad vuelve a 1.
  const meta=normalizeNutritionMeta(v.nutritionMeta);
  if(meta&&meta.base&&meta.base.unit==="portion"){meta.qty=1;delete meta.corrected;}
  return Object.assign({name:v.name,kcal:v.kcal/k,p:v.p/k,c:v.c/k,f:v.f/k},v.macrosUnknown?{macrosUnknown:true}:{},meta?{nutritionMeta:meta}:{});
}
function recentCustomMeals(limit){
  const out=[],seen=new Set();
  const push=v=>{
    const entry=mealMacrosEntry(perPortion(v)),key=entry&&catalogSlug(entry.name);
    if(entry&&key&&entry.kcal>0&&!seen.has(key)){seen.add(key);out.push(entry);}
  };
  Object.keys(S.days||{}).sort().reverse().forEach(ds=>{
    const d=S.days[ds]||{};
    // Lo que el usuario escribió (no los platos que propuso el plan).
    Object.values(d.meals||{}).forEach(ms=>{const o=ms&&ms.ovr;if(o&&!o.dishName&&!o.gen)push(o);});
    (d.extras||[]).slice().reverse().forEach(push);

}

function recipeComponentsFor(ds,id){

// Aplica la operación sobre la versión más reciente del perfil para no perder lo
// creado en otro dispositivo; lo ya registrado conserva su snapshot.
const PREFS_LIBRARIES={
  foods:{key:"customFoods",deletedKey:"customFoodsDeleted",merge:(a,b,d)=>mergeCustomFoods(a,b,d),max:CUSTOM_FOODS_MAX},
  recipes:{key:"customRecipes",deletedKey:"customRecipesDeleted",merge:(a,b,d)=>mergeCustomRecipes(a,b,d),max:RECIPES_MAX},
};
async function persistLibraryOp(kind,op){
  const cfg=PREFS_LIBRARIES[kind];
  if(!cfg||!supa||!uid())return false;
  let server=null;
  try{
    const r=await supa.from("profiles").select("prefs").eq("id",uid()).maybeSingle();
    if(r.error)return false;
    server=r.data&&r.data.prefs||{};
  }catch(_){return false;}
  const local=(profile&&profile.prefs)||{};
  const deleted=[...new Set([].concat(server[cfg.deletedKey]||[],local[cfg.deletedKey]||[],op.remove?[op.remove]:[]).map(String))].slice(-CUSTOM_FOOD_DELETED_MAX);
  let list=cfg.merge(server[cfg.key],local[cfg.key],deleted);
  if(op.upsert){
    list=list.filter(x=>x.id!==op.upsert.id);
    if(list.length>=cfg.max)return false;
    list.unshift(op.upsert);
  }
  const prefs={...local,[cfg.key]:list,[cfg.deletedKey]:deleted};
  const result=await saveProfilePrefs(prefs,{skipPlanVersion:true});
  return !(result&&result.error);
}

/* REQ-276: escaneo progresivo. Solo si el navegador trae BarcodeDetector y cámara
   en contexto seguro; si no, se escribe el código. Sin librerías ni servicios externos. */
const SCAN_FORMATS=["ean_13","ean_8","upc_a","itf"];
function barcodeScanSupported(){
  return typeof window.BarcodeDetector==="function"&&!!window.isSecureContext
    &&!!(navigator.mediaDevices&&typeof navigator.mediaDevices.getUserMedia==="function");
}
function renderScanRow(){
  const row=$("#qpScanRow");if(!row)return;
  row.innerHTML=barcodeScanSupported()
    ?`<button class="btn btn-sm" onclick="startBarcodeScan()">📷 Escanear código de barras</button>`
    :`<span class="muted small">También puedes escribir el número del código de barras.</span>`;
}
function scanMessage(text){const box=$("#qpScan");if(box)box.innerHTML=`<div class="muted small scan-msg" role="status">${esc(text)}</div>`;}
async function startBarcodeScan(){
  if(window._scan)return;
  if(!barcodeScanSupported()){scanMessage("Este navegador no puede leer códigos con la cámara. Escribe el número del código.");return;}
  let formats=SCAN_FORMATS;
  try{const sup=await window.BarcodeDetector.getSupportedFormats();if(Array.isArray(sup))formats=SCAN_FORMATS.filter(f=>sup.includes(f));}catch(_){}
  if(!formats.length){scanMessage("Este navegador no lee este tipo de código. Escribe el número del código.");return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});}
  catch(_){scanMessage("No pudimos usar la cámara (sin permiso o sin cámara). Escribe el número del código.");return;}
  const box=$("#qpScan");
  if(!box){stream.getTracks().forEach(t=>t.stop());return;}
  window._scan={stream,detector:new window.BarcodeDetector({formats}),active:true,timer:null};
  box.innerHTML=`<div class="scan"><video id="qpScanVideo" playsinline muted autoplay aria-label="Vista de la cámara"></video>
    <div class="muted small">Apunta al código de barras de la etiqueta.</div>
    <button class="btn btn-sm" onclick="stopBarcodeScan(true)">Cancelar</button></div>`;
  const video=$("#qpScanVideo");video.srcObject=stream;
  try{await video.play();}catch(_){}
  scanLoop();
}
async function scanLoop(){
  const sc=window._scan;if(!sc||!sc.active)return;
  const video=$("#qpScanVideo");if(!video){stopBarcodeScan();return;}
  try{
    const found=await sc.detector.detect(video);
    if(!window._scan||!window._scan.active)return;
    const codes=[...new Set((found||[]).map(b=>normalizeGtin(b&&b.rawValue)).filter(Boolean))];
    if(codes.length===1){stopBarcodeScan();applyScannedCode(codes[0]);return;}
    if(codes.length>1){
      stopBarcodeScan();
      const box=$("#qpScan");
      if(box)box.innerHTML=`<div class="muted small">Se leyeron varios códigos. Elige el del producto:</div>${codes.map(c=>`<button class="btn btn-sm" style="margin:4px 4px 0 0" onclick="applyScannedCode('${c}')">${c}</button>`).join("")}`;
      return;
    }
  }catch(_){}
  sc.timer=setTimeout(scanLoop,250);
}
function stopBarcodeScan(clear){
  const sc=window._scan;
  if(sc){sc.active=false;clearTimeout(sc.timer);try{sc.stream.getTracks().forEach(t=>t.stop());}catch(_){}window._scan=null;}
  if(clear){const box=$("#qpScan");if(box)box.innerHTML="";}
}
function applyScannedCode(code){
  const qp=window._qp;const box=$("#qpScan");if(box)box.innerHTML="";
  const search=$("#qpSearch");if(search)search.value=code;
  if(qp){qp.query=code;renderQuickPicks();}

}

// Aplica la sustitución sobre una sola comida, guardando lo anterior para deshacer.
function applyMealSubstitution(ds,id,v,eaten){
  const ms=mealState(ds,id);const day=buildDay(ds);const b=day.meals.find(m=>m.id===id);
  const before=mealValue(b,ms);
  const prev={ovr:ms.ovr?JSON.parse(JSON.stringify(ms.ovr)):null,done:!!ms.done,skipped:!!ms.skipped};
  ms.ovr=Object.assign({name:v.name,kcal:v.kcal,p:v.p,c:v.c,f:v.f,userSet:true},
    v.macrosUnknown?{macrosUnknown:true}:{},v.nutritionMeta?{nutritionMeta:v.nutritionMeta}:{},v.components?{components:v.components}:{});
  ms.done=!!eaten;delete ms.skipped;
  ms.subst={at:new Date().toISOString(),prev,sig:substSignature(ms)};
  addContingencyEntry(ds,{type:"meal_replace",id,reason:"logged_instead",prev:{name:before.name||null,kcal:mealHasContent(before)?before.kcal:null},chosen:{name:v.name,kcal:v.kcal},rebalanced:[]});
}
function substSignature(ms){return JSON.stringify(ms&&ms.ovr||null);}
function canUndoSubst(ms){return !!(ms&&ms.subst&&substSignature(ms)===ms.subst.sig);}
// Deshace solo el cambio propio: si la comida se editó después, no se pisa.
function undoMealSubstitution(ds,id){
  const ms=mealState(ds,id);const sub=ms.subst;if(!sub)return;
  if(substSignature(ms)!==sub.sig){toast("Esta comida cambió después; edítala o vuelve al plan.");return;}
  const prev=sub.prev||{};
  if(prev.ovr)ms.ovr=prev.ovr;else delete ms.ovr;
  ms.done=!!prev.done;
  if(prev.skipped)ms.skipped=true;else delete ms.skipped;
  delete ms.subst;
  addContingencyEntry(ds,{type:"meal_revert",id,reason:"undo_logged_instead",prev:null,revertedSlots:[]});
  commitDay(ds);closeModal();render();toast("Sustitución deshecha");
}
/* REQ-273: copiar una comida o las entradas de un día a otra fecha del ciclo, con
   vista previa. El origen no cambia; las copias tienen identidad nueva y
   procedencia. El futuro queda planificado; hoy/pasado exige elegir si se comió. */
function copyableEntries(ds){
  const day=buildDay(ds),st=dayState(ds),out=[];
  day.meals.forEach(b=>{
    const ms=st.meals[b.id]||{};if(ms.skipped)return;
    const v=mealValue(b,ms);if(!mealHasContent(v)||!v.name)return;
    const o=ms.ovr;
    const entry=Object.assign({},v,o&&o.kcal!=null&&o.dishName==null?{components:o.components,nutritionMeta:o.nutritionMeta}:{nutritionMeta:{source:"recipe",ref:{kind:"recipe",name:v.name},base:{kcal:v.kcal,p:v.p,c:v.c,f:v.f,unit:"portion"},qty:1}});
    out.push({key:"meal:"+b.id,slotId:b.id,label:b.slot,entry,done:!!ms.done});
  });
  st.extras.forEach((e,i)=>{if(mealHasContent(e)&&e.name)out.push({key:"extra:"+i,slotId:null,label:"Extra",entry:e,done:!!e.done});});
  return out;

function coachRequestId(){
  if(window.crypto&&typeof window.crypto.randomUUID==="function")return window.crypto.randomUUID();
  const bytes=new Uint8Array(16);
  if(window.crypto&&window.crypto.getRandomValues)window.crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);

async function coachProxyFetch(payload){

    try{
      // REQ-175: tope por intento para que la capa de espera nunca quede colgada.
      const controller=new AbortController();

        res=await fetch("/api/claude",{
          method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+session.access_token},
          body:JSON.stringify(payload),signal:controller.signal
        });
      }catch(fetchError){
        if(fetchError&&fetchError.name==="AbortError")throw new Error("Tu coach tardó demasiado en responder. Inténtalo de nuevo en un momento.");
        throw fetchError;
      }finally{clearTimeout(timer);}
      const data=await res.json().catch(()=>({}));
      if(res.status===409&&attempt===0){await new Promise(resolve=>setTimeout(resolve,350));continue;}
      if(res.status===402){
        const err=new Error(data.error||"Activa tu plan para usar esta función.");
        err.paywall=true;err.expired=!!(data&&data.expired);err.trialLimit=!!(data&&data.trialLimit);err.trial=(data&&data.trial)||null;
        throw err;
      }
      if(res.status===404)throw new Error("El proxy /api/claude no está disponible. Despliega en Vercel o usa una configuración local de desarrollo.");
      if(!res.ok){const err=new Error(data.error||("Error "+res.status));err.status=res.status;if(data.code)err.code=String(data.code);throw err;}
      return data;
    }catch(e){
      lastError=e;
      if(attempt===0&&/fetch|network|conexi|proceso/i.test(String(e&&e.message||e))){
        await new Promise(resolve=>setTimeout(resolve,250));
        continue;
      }
      throw e;
    }
  }
  throw lastError||new Error("No se pudo contactar al coach.");
}

function finalizedDayIsComplete(day,finalized){
  if(!finalized||!Array.isArray(finalized.comidas))return false;
  const bySlot=new Set(finalized.comidas.map(c=>c.slot_id));
  return (day.meals||[]).every(m=>bySlot.has(m.id));
}
// Suma macros de un arreglo de comidas ya cerradas (formato {kcal,proteina_g,carbohidratos_g,grasa_g}).
function comidasMacroTotals(comidas){
  return (comidas||[]).reduce((s,c)=>({
    kcal:s.kcal+(+c.kcal||0),p:s.p+(+c.proteina_g||0),c:s.c+(+c.carbohidratos_g||0),f:s.f+(+c.grasa_g||0),
  }),{kcal:0,p:0,c:0,f:0});
}
// REQ-139: aviso suave y no bloqueante cuando el día ya cerrado (totals) no cumple
// DIET_CONTRACT frente a su meta. Nunca impide aplicar/guardar el día; solo informa.
// Copy sin vocabulario técnico (REQ-31): habla de "tu meta", no de "contrato" ni "IA".
function dietContractNoticeText(totals,target){
  const nd=window.FITBUD_NUTRITION_DOMAIN;
  if(!nd||!nd.validateDietContractTotals||!totals||!target)return"";

}

// Agrega ingredientes de todos los días generados y devuelve la lista ordenada por gramos.
function buildShoppingList(daysData){
  const totals=new Map();
  (daysData||[]).forEach(d=>{
    (d.comidas||[]).forEach(c=>{
      (c.ingredientes||[]).forEach(g=>{
        const key=(g.nombre||"").trim().toLowerCase();
        if(!key)return;
        const prev=totals.get(key)||{nombre:g.nombre,gramos:0};
        totals.set(key,{nombre:prev.nombre,gramos:prev.gramos+Math.round(Number(g.gramos||0))});
      });
    });
  });
  return [...totals.values()].sort((a,b)=>b.gramos-a.gramos);
}

function validMealSuggestions(value){

    String(option&&option.nombre||"").trim()
    &&[option.kcal,option.proteina_g,option.carbohidratos_g,option.grasa_g].every(n=>Number.isFinite(Number(n)))

function activeTrainingCatalog(){

}
function trainingEquipmentSupports(requirement,prefs){
  const selected=new Set(prefs.equipment||[]);
  const support={
    barbell:["barbell"],rack:["barbell"],bench:["dumbbells","barbell","machines"],
    cable:["machines"],leg_press:["machines"],leg_curl:["machines"],
    dumbbells:["dumbbells"],dumbbells_or_cable:["dumbbells","machines"],
    barbell_or_dumbbells:["barbell","dumbbells"],resistance_band:["bands"],
    pullup_bar:["pullup"],bench_or_assistance:["machines","bodyweight"],
    bench_or_chair:["bodyweight","dumbbells"],step_or_bench:["bodyweight","dumbbells"],
    sliders_or_towel:["bodyweight"],bicycle:["bike","trainer"],pool:["pool_gear"],
  };
  const options=support[requirement]||[];
  return !options.length||options.some(option=>selected.has(option));
}
function exerciseConflictsWithProfile(exercise,prefs){
  const blocked=String([prefs.injuries,prefs.limitations,prefs.avoidMovements].filter(Boolean).join(" ")).toLowerCase();
  if(!blocked)return false;
  const words=new Set(blocked.split(/[^a-záéíóúñ]+/i).filter(word=>word.length>=5&&!["evitar","dolor","lesion","lesión","movimiento"].includes(word)));
  if(!words.size)return false;
  const safety=[
    exercise.name,exercise.movement_pattern,
    ...exerciseArray(exercise.aliases),...exerciseArray(exercise.contraindications),
    ...exerciseArray(exercise.safety_signals),
  ].join(" ").toLowerCase();
  return [...words].some(word=>safety.includes(word));
}
function allowedLevelsForExperience(experience){
  if(experience==="advanced")return null; // null = all levels
  if(experience==="intermediate")return new Set(["beginner","intermediate"]);
  return new Set(["beginner"]);
}
function exerciseLevelAllowed(exercise,experience){
  if(!exercise||!["beginner","intermediate","advanced"].includes(exercise.level))return false;
  const allowed=allowedLevelsForExperience(experience);
  return !allowed||allowed.has(exercise.level);
}
function allowedExercisesForSession(spec,prefs,catalog){
  const strength=spec.type==="strength";
  const cardioRoleIds=!strength&&WORKOUT_EXERCISE_IDS[prefs.primarySport]
    ?new Set(compatibleCardioExerciseIds(prefs.primarySport,spec.role,prefs,catalog)):null;
  return catalog.filter(exercise=>{
    if(!exerciseLevelAllowed(exercise,prefs.trainingExperience))return false;
    if(exerciseConflictsWithProfile(exercise,prefs))return false;
    if(isGentleTrainingPlan(prefs)&&exerciseBlockedByGentleMode(exercise))return false;
    const places=exerciseArray(exercise.places);
    if(places.length&&!places.includes(spec.location))return false;
    if(strength){
      const disciplines=prefs.strengthMode==="bodyweight"
        ?new Set(["bodyweight","strength"])
        :new Set(["gym","strength","bodyweight"]);
      if(!disciplines.has(exercise.discipline))return false;
      return exerciseArray(exercise.equipment).every(item=>trainingEquipmentSupports(item,prefs));
    }
    return exercise.discipline===prefs.primarySport&&(!cardioRoleIds||cardioRoleIds.has(exercise.slug));
  });
}
function trainingExpectedWeeks(prefs){
  const p=migrateProfilePrefs(prefs||((profile&&profile.prefs)||{}));
  const training=trainingPrefsFromPrefs(p);
  const planPrefs={...p,primarySport:training.primary};
  const calendar=planCalendarForPrefs(p);
  const schedule=workoutSchedule(training.days,training.dayIds,training.priority,training.locations,training.primary,training.experience,training.workoutSplit,training.strength,training.lightCardioEnabled);
  const strengthRoles=STRENGTH_SESSION_IDS;
  const catalog=activeTrainingCatalog();
  return calendar.weeks.map((week,index)=>{
    const sessions=[];
    for(let offset=0;offset<7;offset++){
      const date=addDays(week.start,offset);
      const weekday=parseYmd(date).getDay();
      if(!training.dayIds.includes(weekday))continue;
      const role=schedule[weekday];
      const type=strengthRoles.has(role)?"strength":training.primary;
      const spec={date,weekday,location:training.locations[weekday],role,type};
      spec.allowedExerciseIds=allowedExercisesForSession(spec,planPrefs,catalog).map(exercise=>exercise.slug);
      sessions.push(spec);
    }
    return {week:index+1,phase:TRAINING_PLAN.phaseForWeek(index+1,training.duration),sessions};
  });
}
function trainingBlockedTerms(prefs){
  return String(prefs.avoidMovements||"").split(/[,;]/).map(term=>term.trim().toLowerCase()).filter(Boolean);
}
function trainingPlanValidationConfig(expected,prefs){
  const allowed=[...new Set(expected.sessions.flatMap(session=>session.allowedExerciseIds||[]))];
  return {
    schema:"training_plan_week_v1",
    // REQ-68: training-plan.js#normalizeWeek lee `config.week` (no `expectedWeek`) para
    // calcular la semana y la fase esperadas. Sin esta clave, normalizeWeek asumía
    // siempre semana 1 y el plan completo quedaba mal numerado a partir de la semana 2.
    week:expected.week,
    expectedWeek:expected.week,
    expectedPhase:expected.phase,
    expectedSessions:expected.sessions.map(({date,weekday,location,role,type})=>({date,weekday,location,role,type})),
    sessionMinutes:prefs.sessionMinutes,
    allowedExerciseIds:allowed,
    hardRestrictions:trainingBlockedTerms(prefs),
    gentleMode:isGentleTrainingPlan(prefs),
  };
}
function trainingPhaseDose(phase,prefs){
  const gentle=isGentleTrainingPlan(prefs||{});
  if(gentle)return {
    base:{sets:2,rpe:5,rir:4},
    progression:{sets:3,rpe:6,rir:3},
    deload:{sets:2,rpe:4,rir:4},
    build:{sets:3,rpe:6,rir:3},
    consolidation:{sets:2,rpe:5,rir:4},
  }[phase]||{sets:2,rpe:5,rir:4};
  return {
    base:{sets:3,rpe:6,rir:3},
    progression:{sets:4,rpe:7,rir:2},
    deload:{sets:2,rpe:5,rir:4},
    build:{sets:4,rpe:8,rir:1},
    consolidation:{sets:3,rpe:6,rir:3},
  }[phase]||{sets:3,rpe:6,rir:3};
}
function deterministicTrainingWeekPayload(expected,prefs){
  const dose=trainingPhaseDose(expected.phase,prefs);
  const planPrefs={...prefs,primarySport:effectiveTrainingPrimarySport(prefs)};
  const gentle=isGentleTrainingPlan(prefs);
  const sessions=expected.sessions.map(spec=>{
    let workout=workoutById(spec.date,spec.role,planPrefs);
    const strength=spec.type==="strength";
    // REQ-92: filtrar ejercicios del template por los permitidos; si quedan < 2, suplementar
    // desde spec.allowedExerciseIds para que el fallback nunca produzca exercises:[]
    let exerciseIds=exerciseArray(workout&&workout.exerciseIds).filter(id=>(spec.allowedExerciseIds||[]).includes(id));
    if(!strength&&!exerciseIds.length){
      exerciseIds=(spec.allowedExerciseIds||[]).slice(0,1);
      const easy=sportSessions(spec.type,spec.date,planPrefs).endurance;
      workout={...workout,name:easy.name,detail:easy.detail,cardioRole:"facil"};
    }
    if(strength&&exerciseIds.length<2){
      const extra=(spec.allowedExerciseIds||[]).filter(id=>!exerciseIds.includes(id));
      exerciseIds=[...exerciseIds,...extra].slice(0,6);
    }
    const exercises=exerciseIds.map(slug=>exerciseBySlug(slug,true)).filter(Boolean);
    const prescription=buildWorkoutPrescription(workout,exercises,{week:expected.week,durationWeeks:resolvedPlanDuration(prefs),sessionMinutes:prefs.sessionMinutes});
    const prescribed=strength
      ?prescription.steps.filter(step=>step.type==="strength").map(step=>({
        exercise_id:step.exerciseSlug,sets:step.prescribedSets,reps:step.reps,
        rest_seconds:step.restSeconds,target_rpe:step.targetRpe,target_rir:step.targetRir,tempo:step.tempo,
      }))
      :[{
        exercise_id:exerciseIds[0],sets:dose.sets,reps:"Sesión completa",
        rest_seconds:60,target_rpe:dose.rpe,target_rir:dose.rir,tempo:"Ritmo controlado",
      }];
    const blocks=strength?[]:prescription.steps.map(step=>({
      phase:step.phase,label:step.label,target:step.target,intensity:step.intensity,duration_seconds:step.durationSeconds,
    }));
    return {
      date:spec.date,weekday:spec.weekday,location:spec.location,role:spec.role,type:spec.type,
      name:workout.name,objective:prescription.objective,duration_minutes:Math.min(prefs.sessionMinutes,prescription.estimatedMinutes),
      intensity:strength?`RPE ${dose.rpe}`:workout.cardioRole==="facil"?"RPE 3-5":(gentle?(spec.role==="calidad"?"RPE 5":spec.role==="tecnica"?"RPE 3-4":"RPE 2-4"):(spec.role==="calidad"?"RPE 7":spec.role==="tecnica"?"RPE 5":"RPE 3-5")),
      exercises:prescribed,blocks,
    };
  });
  return {
    week:expected.week,
    phase:expected.phase,
    reason:"Semana construida con el catálogo verificado, la disponibilidad y la progresión del ciclo.",
    sessions,
  };
}

// REQ-257: con 2048 tokens la semana llegaba cortada (en producción, siempre) y
// caía a la alternativa validada; 4096 es el tope del proxy.
const TRAINING_WEEK_MAX_TOKENS=4096;
async function generateTrainingWeek(expected,prefs,request){
  const fallbackRaw=deterministicTrainingWeekPayload(expected,prefs);
  const validation=trainingPlanValidationConfig(expected,prefs);
  if(request.fallbackOnly){
    const normalized=TRAINING_PLAN.normalizeWeek(fallbackRaw,{...validation,durationWeeks:resolvedPlanDuration(prefs),sessions:expected.sessions,blockedTerms:trainingBlockedTerms(prefs)});
    return {...normalized,fallback:true};
  }
  const fallback=JSON.stringify(fallbackRaw);
  const quota=coachQuota(request.action,request.requestId,request.partKey,fallback,validation,`training-week-${expected.week}-${expected.sessions.map(s=>s.date).join(":")}`);
  const txt=await callClaude(trainingWeekPrompt(expected,prefs),TRAINING_WEEK_MAX_TOKENS,quota);
  const parsed=parseJSON(txt);
  return TRAINING_PLAN.normalizeWeek(parsed,{
    ...validation,durationWeeks:resolvedPlanDuration(prefs),sessions:expected.sessions,blockedTerms:trainingBlockedTerms(prefs),
  });
}

async function persistTrainingDraft(plan,prefs,expectedWeeks,warnings){
  const check=TRAINING_PLAN.validatePlan(plan,{durationWeeks:resolvedPlanDuration(prefs)});
  if(!check.ok)throw new Error(check.issues[0]||"El plan completo no pasó las validaciones.");
  const prompt=trainingPlanPromptMetadata(prefs,expectedWeeks);
  const draft=await createTrainingPlanDraft(plan,prompt);
  const trialFirstWeekOnly=!!(window._trainingDraft&&window._trainingDraft.trialFirstWeekOnly);
  window._trainingDraft={plan,versionId:draft.id,validFrom:draft.valid_from,prefs,expectedWeeks,warnings:warnings||[],prompt,trialFirstWeekOnly};
  return draft;
}

async function openTrainingPlanGenerator(){
  if(trainingSafetyHold()){toast("El entrenamiento está pausado por seguridad");return;}
  if(!hasRequiredConsents()||!hasCurrentScreening()){toast("Revisa privacidad y seguridad antes de preparar tu plan");return;}
  if(aiAvailable()&&!hasEntitlement()){showPaywall("training");return;} // REQ-25
  await checkAutoLevelProgression(); // REQ-67: subir nivel si RPE lo justifica
  const actionKey="training_plan";
  const requestId=beginCoachAction(actionKey);if(!requestId)return;
  const prefs=migrateProfilePrefs((profile&&profile.prefs)||{});
  const expectedWeeks=trainingExpectedWeeks(prefs);
  const missing=expectedWeeks.flatMap(week=>week.sessions.filter(session=>!session.allowedExerciseIds.length));
  if(missing.length){endCoachAction(actionKey);toast("Faltan ejercicios compatibles con tus lugares o recursos");return;}
  const trialFirstWeekOnly=hasActivePremiumTrial()&&!entitlement;
  modal(`<h3>Preparar mi plan de entrenamiento</h3><div id="trainingPlanOut"><div class="loading-row"><div class="spinner"></div><span>${trialFirstWeekOnly?"Preparando tu primera semana personalizada…":"Preparando tu plan…"}</span></div></div>`);
  const weeks=[];const warnings=[];let fallbackOnly=!aiAvailable();
  try{
    for(let index=0;index<expectedWeeks.length;index++){
      const expected=expectedWeeks[index];
      const out=$("#trainingPlanOut");
      if(out)out.innerHTML=`<div class="loading-row"><div class="spinner"></div><span>Preparando semana ${index+1} de ${expectedWeeks.length}…</span></div>`;
      let result;
      if(trialFirstWeekOnly&&index>0){
        result=await generateTrainingWeek(expected,prefs,{fallbackOnly:true});
        warnings.push(`semana ${expected.week}`);
        weeks.push(result.week);
        continue;
      }
      try{
        result=await generateTrainingWeek(expected,prefs,{
          action:"training_plan",requestId,partKey:`week-${expected.week}`,fallbackOnly,
        });
        if(!result.ok)throw new Error(result.issues[0]||"La semana no pasó las validaciones.");
      }catch(error){
        fallbackOnly=true;
        result=await generateTrainingWeek(expected,prefs,{fallbackOnly:true});
        warnings.push(`semana ${expected.week}`);
      }
      weeks.push(result.week);
    }
    const plan={
      version:TRAINING_PLAN.VERSION,
      durationWeeks:resolvedPlanDuration(prefs),
      startDate:START,endDate:END,
      reason:"Combina tu disciplina principal con fuerza, respeta tus días exactos y ajusta la carga por fase.",
      createdAt:new Date().toISOString(),
      validation:{schema:"training_plan_week_v1",status:"passed",catalogHash:coachCompatibilityContext("training_plan").catalog.exercises},
      weeks,
    };
    await persistTrainingDraft(plan,prefs,expectedWeeks,warnings);
    if(window._trainingDraft)window._trainingDraft.trialFirstWeekOnly=trialFirstWeekOnly;
    $("#trainingPlanOut").innerHTML=trainingDraftReviewHtml();
  }catch(error){
    const out=$("#trainingPlanOut");if(out)out.innerHTML=`<div class="ai-box">⚠️ ${esc(coachErrorMessage(error))}</div>`;
  }finally{endCoachAction(actionKey);}
}
async function regenerateTrainingDraftWeek(index){
  const draft=window._trainingDraft;if(!draft)return;
  if(draft.trialFirstWeekOnly&&index>0){showPaywall("trial_limit");return;}
  const expected=draft.expectedWeeks[index];if(!expected)return;
  const actionKey=`training_plan_week_${expected.week}`;
  const requestId=beginCoachAction(actionKey);if(!requestId)return;

// estimación y, si algo que no se ve cambia mucho las kcal, hasta 2 preguntas.

const MEAL_PHOTO_MAX_PX=1024;
const MEAL_PHOTO_MAX_ROUNDS=3;
function pickMealPhoto(){const input=$("#f_photo");if(input){input.value="";input.click();}}
async function mealPhotoToJpeg(file){
  let source;
  try{source=await createImageBitmap(file,{imageOrientation:"from-image"});}
  catch(_){
    source=await new Promise((resolve,reject)=>{
      const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("No pudimos leer la foto."));
      img.src=URL.createObjectURL(file);
    });
  }
  const w=source.width||source.naturalWidth,h=source.height||source.naturalHeight;
  const scale=Math.min(1,MEAL_PHOTO_MAX_PX/Math.max(w,h));
  const canvas=document.createElement("canvas");
  canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
  canvas.getContext("2d").drawImage(source,0,0,canvas.width,canvas.height);
  const dataUrl=canvas.toDataURL("image/jpeg",0.82);
  return {mediaType:"image/jpeg",data:dataUrl.slice(dataUrl.indexOf(",")+1),dataUrl};
}

async function photoEstimateRound(retry){

Entrega siempre tu mejor estimación actual. "nombre": nombre corto y descriptivo del plato. "nota": una frase con lo que supusiste.

// REQ-228: el error de la estimación dice qué pasó (sin hablar de tecnología) y
// deja reintentar; un motivo no reconocido muestra su código. REQ-238: también
// para "Estimar macros" por texto (photo=false).
// REQ-268: una respuesta solo se aplica si trae los cuatro valores finitos y no
// negativos y no es una plantilla de reserva; si no, cuenta como fallo.
function validEstimate(j){
  if(!j||typeof j!=="object"||lastCoachCallOrigin==="template")return null;
  const ok=["kcal","proteina_g","carbohidratos_g","grasa_g"].every(k=>j[k]!==null&&j[k]!==""&&Number.isFinite(Number(j[k]))&&Number(j[k])>=0);
  return ok?j:null;
}
function estimateUnavailableError(){const err=new Error("no_compatible_result");err.status=422;err.code="no_compatible_result";return err;}
function estimateErrorMessage(e,photo){
  const message=String(e&&e.message||"");
  const status=Number(e&&e.status)||0;
  if(e&&(e.paywall||e.trialLimit))return coachErrorMessage(e);
  if(e&&e.code==="no_compatible_result")return photo?"No pudimos estimar esta foto ahora. Tus valores no cambiaron: describe la comida, ingrésalos a mano o inténtalo más tarde.":"No pudimos estimar esta comida ahora. Tus valores no cambiaron: ingrésalos a mano o inténtalo más tarde.";
  if(/tard[oó] demasiado/i.test(message)||status===504)return photo?"El análisis de la foto tardó demasiado. Inténtalo de nuevo.":"La estimación tardó demasiado. Inténtalo de nuevo.";
  if(photo&&(/imagen|formato/i.test(message)||status===413))return "No pudimos leer esta foto. Prueba con otra o con una captura de pantalla.";
  if(status===429||status===503||status===529||/overloaded|rate/i.test(message))return "Ahora mismo hay mucha demanda. Inténtalo en un minuto.";
  if(status===422)return photo?"No pudimos estimar esta foto. Prueba con otra foto o describe la comida.":"No pudimos estimar esta comida. Descríbela con más detalle (cantidad, cómo se preparó) o ingresa los macros.";
  if(/fetch|network|load failed|conexi/i.test(message))return "No hay conexión. Revisa tu internet e inténtalo de nuevo.";
  const generic=coachErrorMessage(e);
  return status?`${generic} (código ${status})`:generic;
}

// REQ-230: aplica la estimación a los campos, los resalta y devuelve la línea
