<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" role="img" aria-labelledby="title desc">
  <title id="title">Peso muerto a una pierna sin carga</title>
  <desc id="desc">Vista lateral en dos posiciones. De pie sobre una pierna, la persona lleva la cadera atrás e inclina el tronco mientras extiende la pierna libre hacia atrás. La rodilla de apoyo está ligeramente flexionada. No hay kettlebell ni otra carga.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#c6f36a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    .limb,.torso,.far,.prop,.floor,.arrow,.band{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .limb{stroke:#e4ebdf;stroke-width:9}.torso{stroke:#e4ebdf;stroke-width:13}
    .far{stroke:#738372;stroke-width:8}.head{fill:#e4ebdf}.joint{fill:#c6f36a}
    .prop{stroke:#9eaf9a;stroke-width:5}.floor{stroke:#46513f;stroke-width:2}
    .arrow{stroke:#c6f36a;stroke-width:2.5}.band{stroke:#c6f36a;stroke-width:4}
    .label{font:600 14px system-ui,sans-serif;fill:#c6f36a}.cue{font:14px system-ui,sans-serif;fill:#b9c5b3}
  </style>
  <rect width="640" height="272" fill="#171b16"/>
  <path d="M320 48v181" stroke="#36402f"/>
  <g transform="translate(0 0)"><text class="label" x="28" y="31">1 · Apoyo en una pierna</text><path class="floor" d="M28 224H292"/><path class="far" d="M163 145L188 186 212 198"/><path class="torso" d="M160 85L163 145"/><path class="limb" d="M163 145L160 185 160 224"/><path class="limb" d="M155 224h18"/><path class="limb" d="M160 94L150 127 152 154"/><circle class="head" cx="160" cy="59" r="11"/><path class="limb" d="M160 72v13"/><circle class="joint" cx="163" cy="145" r="4"/></g>
  <g transform="translate(320 0)"><text class="label" x="28" y="31">2 · Lleva la cadera atrás</text><path class="floor" d="M28 224H292"/><path class="far" d="M171 141L225 141 278 143"/><path class="torso" d="M110 138L171 141"/><path class="limb" d="M171 141L178 183 172 224"/><path class="limb" d="M167 224h18"/><path class="limb" d="M114 140L108 174 103 204"/><circle class="head" cx="85" cy="137" r="11"/><path class="limb" d="M98 137h12"/><circle class="joint" cx="171" cy="141" r="4"/><path class="arrow" d="M151 112Q123 92 103 113" marker-end="url(#arrow)"/></g>
  <text class="cue" x="320" y="254" text-anchor="middle">Sin carga · Espalda alineada · Rodilla de apoyo suave</text>
</svg>
