<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" role="img" aria-labelledby="title desc">
  <title id="title">Curl femoral con deslizadores: extensión y flexión</title>
  <desc id="desc">Vista lateral de una persona boca arriba con los hombros en el suelo y la cadera elevada. Los talones descansan sobre discos deslizantes planos. Acerca los talones a los glúteos flexionando las rodillas y vuelve a extender con control. No se usa pelota.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#c6f36a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    .limb,.torso,.far,.prop,.floor,.arrow,.band{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .limb{stroke:#e4ebdf;stroke-width:9}.torso{stroke:#e4ebdf;stroke-width:13}
    .far{stroke:#738372;stroke-width:8}.head{fill:#e4ebdf}.joint{fill:#c6f36a}
    .prop{stroke:#9eaf9a;stroke-width:5}.floor{stroke:#46513f;stroke-width:2}
    .arrow{stroke:#c6f36a;stroke-width:2.5}.band{stroke:#c6f36a;stroke-width:4}
    .label{font:600 14px system-ui,sans-serif;fill:#c6f36a}.cue{font:14px system-ui,sans-serif;fill:#b9c5b3}
  </style>
  <rect width="640" height="272" fill="#171b16"/>
  <path d="M320 48v181" stroke="#36402f"/>
  <g transform="translate(0 0)"><text class="label" x="28" y="31">1 · Extiende con control</text><path class="floor" d="M28 224H292"/><path class="far" d="M80 202L120 220"/><path class="far" d="M150 169L205 197 263 220"/><ellipse cx="257" cy="224" rx="18" ry="4" fill="#c6f36a"/><path class="torso" d="M78 202L150 169"/><path class="limb" d="M150 169L202 193 255 218"/><path class="limb" d="M80 202L110 218"/><circle class="head" cx="53" cy="201" r="11"/><circle class="joint" cx="150" cy="169" r="4"/></g>
  <g transform="translate(320 0)"><text class="label" x="28" y="31">2 · Acerca los talones</text><path class="floor" d="M28 224H292"/><path class="far" d="M80 202L120 220"/><path class="far" d="M150 165L196 151 218 220"/><ellipse cx="210" cy="224" rx="18" ry="4" fill="#c6f36a"/><path class="torso" d="M78 202L150 165"/><path class="limb" d="M150 165L188 151 207 218"/><path class="limb" d="M80 202L110 218"/><circle class="head" cx="53" cy="201" r="11"/><circle class="joint" cx="150" cy="165" r="4"/><path class="arrow" d="M255 200h-31" marker-end="url(#arrow)"/></g>
  <text class="cue" x="320" y="254" text-anchor="middle">Talones sobre toallas o deslizadores · Cadera elevada</text>
</svg>
